<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">HyDE: Hypothetical Document Embeddings</text>
  <text x="430" y="46" text-anchor="middle" font-size="10" fill="#64748b">Gao et al. (2022) — Generate a hypothetical answer, embed it, then retrieve similar real documents</text>

  <!-- Standard retrieval (top) -->
  <rect x="30" y="65" width="800" height="100" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="430" y="88" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">Standard Dense Retrieval (Problem: query-document mismatch)</text>

  <rect x="55" y="105" width="100" height="35" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="105" y="120" text-anchor="middle" font-size="7" font-weight="bold" fill="#831843">"What causes</text>
  <text x="105" y="132" text-anchor="middle" font-size="7" font-weight="bold" fill="#831843">northern lights?"</text>

  <line x1="155" y1="122" x2="178" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="180" y="105" width="80" height="35" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="220" y="127" text-anchor="middle" font-size="8" fill="#0c4a6e">Encode q</text>

  <line x1="260" y1="122" x2="283" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="285" y="105" width="80" height="35" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="325" y="127" text-anchor="middle" font-size="8" fill="#0c4a6e">FAISS</text>

  <line x1="365" y1="122" x2="388" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="390" y="100" width="250" height="45" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="515" y="118" text-anchor="middle" font-size="7" fill="#ef4444">Short query ≠ long document style</text>
  <text x="515" y="133" text-anchor="middle" font-size="7" fill="#ef4444">Query: question form · Docs: declarative statements</text>

  <text x="700" y="122" text-anchor="middle" font-size="8" fill="#ef4444" font-weight="bold">Embedding gap!</text>

  <!-- HyDE pipeline -->
  <rect x="30" y="185" width="800" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="208" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">HyDE: Bridge the Gap with a Hypothetical Document</text>

  <!-- Step 1: Query -->
  <rect x="50" y="225" width="90" height="40" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="95" y="242" text-anchor="middle" font-size="7" font-weight="bold" fill="#831843">"What causes</text>
  <text x="95" y="254" text-anchor="middle" font-size="7" font-weight="bold" fill="#831843">northern lights?"</text>

  <line x1="140" y1="245" x2="158" y2="245" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 2: LLM generates hypothetical doc -->
  <rect x="160" y="218" width="160" height="55" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="240" y="237" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">LLM (InstructGPT)</text>
  <text x="240" y="252" text-anchor="middle" font-size="7" fill="#d97706">"Generate a passage that</text>
  <text x="240" y="264" text-anchor="middle" font-size="7" fill="#d97706">answers this question"</text>

  <line x1="320" y1="245" x2="338" y2="245" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Hypothetical document -->
  <rect x="340" y="220" width="150" height="50" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="415" y="237" text-anchor="middle" font-size="7" fill="#14532d" font-weight="bold">Hypothetical Document:</text>
  <text x="415" y="250" text-anchor="middle" font-size="6" fill="#334155">"Aurora borealis is caused</text>
  <text x="415" y="261" text-anchor="middle" font-size="6" fill="#334155">by solar wind particles..."</text>

  <line x1="490" y1="245" x2="508" y2="245" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 3: Encode hypothetical doc -->
  <rect x="510" y="225" width="80" height="40" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="550" y="242" text-anchor="middle" font-size="7" font-weight="bold" fill="#0c4a6e">Encode</text>
  <text x="550" y="255" text-anchor="middle" font-size="7" fill="#0284c7">hypothetical</text>

  <line x1="590" y1="245" x2="608" y2="245" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 4: FAISS -->
  <rect x="610" y="225" width="70" height="40" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="645" y="249" text-anchor="middle" font-size="8" fill="#0c4a6e">FAISS</text>

  <line x1="680" y1="245" x2="698" y2="245" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 5: Real documents -->
  <rect x="700" y="220" width="110" height="50" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="755" y="240" text-anchor="middle" font-size="8" font-weight="bold" fill="#14532d">Real docs!</text>
  <text x="755" y="255" text-anchor="middle" font-size="7" fill="#16a34a">doc-style → doc match</text>

  <!-- Annotation -->
  <text x="550" y="300" text-anchor="middle" font-size="8" fill="#16a34a" font-weight="bold">Document-style embedding matches document-style corpus → better retrieval!</text>

  <!-- Key insight -->
  <rect x="30" y="335" width="390" height="55" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="225" y="355" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">Key Insight</text>
  <text x="50" y="373" font-size="8" fill="#334155">Hypothetical doc may be factually wrong, but its</text>
  <text x="50" y="387" font-size="8" fill="#334155">embedding is close to real relevant docs in vector space</text>

  <!-- Advantages -->
  <rect x="440" y="335" width="390" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="635" y="355" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">Properties</text>
  <text x="460" y="373" font-size="8" fill="#334155">• Zero-shot: no training data or fine-tuning needed</text>
  <text x="460" y="387" font-size="8" fill="#334155">• Works with any encoder + any LLM</text>
</svg>