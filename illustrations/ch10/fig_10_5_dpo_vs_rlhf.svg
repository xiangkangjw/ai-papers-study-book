<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">DPO vs RLHF: Direct Preference Optimization</text>
  <text x="430" y="46" text-anchor="middle" font-size="10" fill="#64748b">Rafailov et al. (2023) — Skip reward model, optimize policy directly from preferences</text>

  <!-- RLHF pipeline (top) -->
  <rect x="30" y="65" width="800" height="165" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="430" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">RLHF: 3-Stage Pipeline</text>

  <!-- Stage 1 -->
  <rect x="50" y="100" width="110" height="55" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="105" y="118" text-anchor="middle" font-size="8" font-weight="bold" fill="#0c4a6e">Stage 1: SFT</text>
  <text x="105" y="133" text-anchor="middle" font-size="7" fill="#334155">Supervised</text>
  <text x="105" y="146" text-anchor="middle" font-size="7" fill="#334155">fine-tune π_SFT</text>

  <line x1="160" y1="127" x2="178" y2="127" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Stage 2 -->
  <rect x="180" y="100" width="170" height="55" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="265" y="118" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">Stage 2: Reward Model</text>
  <text x="265" y="133" text-anchor="middle" font-size="7" fill="#334155">Train R_ψ on human prefs</text>
  <text x="265" y="146" text-anchor="middle" font-size="7" fill="#334155">(y_w ≻ y_l) → Bradley-Terry</text>

  <line x1="350" y1="127" x2="368" y2="127" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Stage 3 -->
  <rect x="370" y="100" width="200" height="55" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="470" y="118" text-anchor="middle" font-size="8" font-weight="bold" fill="#831843">Stage 3: PPO Training</text>
  <text x="470" y="133" text-anchor="middle" font-size="7" fill="#334155">4 models: actor, ref, critic, reward</text>
  <text x="470" y="146" text-anchor="middle" font-size="7" fill="#334155">max R(x,y) - β·KL(π‖π_ref)</text>

  <line x1="570" y1="127" x2="588" y2="127" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="590" y="105" width="80" height="45" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="630" y="132" text-anchor="middle" font-size="8" font-weight="bold" fill="#14532d">π_RLHF</text>

  <!-- RLHF problems -->
  <text x="430" y="180" text-anchor="middle" font-size="8" fill="#ef4444" font-weight="bold">Problems: Complex (4 models in memory), unstable RL, reward hacking, expensive</text>
  <text x="430" y="198" text-anchor="middle" font-size="8" fill="#ef4444">Memory: ~4× model size needed simultaneously · Training: sensitive to hyperparameters</text>

  <!-- DPO pipeline (bottom) -->
  <rect x="30" y="245" width="800" height="140" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">DPO: Direct Preference Optimization (Single Stage)</text>

  <!-- Stage 1 same -->
  <rect x="50" y="285" width="110" height="55" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="105" y="303" text-anchor="middle" font-size="8" font-weight="bold" fill="#0c4a6e">SFT (same)</text>
  <text x="105" y="318" text-anchor="middle" font-size="7" fill="#334155">Initialize π_ref</text>
  <text x="105" y="331" text-anchor="middle" font-size="7" fill="#334155">from SFT model</text>

  <line x1="160" y1="312" x2="178" y2="312" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Preferences directly -->
  <rect x="180" y="285" width="130" height="55" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="245" y="303" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">Preference Data</text>
  <text x="245" y="318" text-anchor="middle" font-size="7" fill="#334155">(x, y_w, y_l) pairs</text>
  <text x="245" y="331" text-anchor="middle" font-size="7" fill="#d97706">No reward model!</text>

  <line x1="310" y1="312" x2="328" y2="312" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- DPO loss -->
  <rect x="330" y="280" width="260" height="65" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="460" y="300" text-anchor="middle" font-size="8" font-weight="bold" fill="#14532d">DPO Loss (supervised!)</text>
  <text x="460" y="318" text-anchor="middle" font-size="7" fill="#14532d" font-family="'SF Mono', Consolas, monospace">L = -log σ(β · (log π(y_w|x)/π_ref(y_w|x)</text>
  <text x="460" y="333" text-anchor="middle" font-size="7" fill="#14532d" font-family="'SF Mono', Consolas, monospace">            - log π(y_l|x)/π_ref(y_l|x)))</text>

  <line x1="590" y1="312" x2="608" y2="312" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="610" y="290" width="80" height="45" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="317" text-anchor="middle" font-size="8" font-weight="bold" fill="#14532d">π_DPO</text>

  <text x="430" y="365" text-anchor="middle" font-size="8" fill="#16a34a" font-weight="bold">Only 2 models: π_θ and π_ref · Standard cross-entropy-style loss · No RL instability</text>

  <!-- Key insight -->
  <rect x="30" y="400" width="390" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="225" y="423" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">DPO Key Insight</text>
  <text x="50" y="443" font-size="8" fill="#334155">Optimal policy under KL-constrained reward</text>
  <text x="50" y="458" font-size="8" fill="#334155">maximization has a closed form — the reward</text>
  <text x="50" y="473" font-size="8" fill="#334155">model is <tspan font-weight="bold">implicitly defined</tspan> by the policy itself</text>

  <rect x="440" y="400" width="390" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="635" y="423" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">Practical Impact</text>
  <text x="460" y="443" font-size="8" fill="#334155">• Used by LLaMA-2-Chat, Zephyr, many open models</text>
  <text x="460" y="458" font-size="8" fill="#334155">• Simpler to implement: standard supervised training</text>
  <text x="460" y="473" font-size="8" fill="#334155">• Variants: IPO, KTO (unpaired), ORPO, SimPO</text>
</svg>