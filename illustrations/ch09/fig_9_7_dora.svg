<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">DoRA: Weight-Decomposed Low-Rank Adaptation</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Liu et al. (2024) — Decompose weight into magnitude and direction, adapt each separately</text>

  <!-- LoRA (left) for comparison -->
  <rect x="30" y="70" width="260" height="320" rx="10" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="2"/>
  <text x="160" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">Standard LoRA</text>

  <rect x="85" y="120" width="150" height="45" rx="6" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="2"/>
  <text x="160" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a4a5a">W₀</text>
  <text x="160" y="158" text-anchor="middle" font-size="11" fill="#c0c0c8">frozen pretrained</text>

  <text x="160" y="185" text-anchor="middle" font-size="14" fill="#4a4a5a">+</text>

  <rect x="85" y="198" width="150" height="45" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="160" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">BA</text>
  <text x="160" y="236" text-anchor="middle" font-size="11" fill="#d4a03c">low-rank update</text>

  <line x1="160" y1="243" x2="160" y2="268" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="85" y="270" width="150" height="35" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="160" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">W' = W₀ + BA</text>

  <text x="160" y="325" text-anchor="middle" font-size="11" fill="#7a7a8a">Magnitude and direction</text>
  <text x="160" y="340" text-anchor="middle" font-size="11" fill="#7a7a8a">entangled in single update</text>

  <!-- DoRA (right) -->
  <rect x="320" y="70" width="510" height="320" rx="10" fill="#edf7f5" stroke="#3a9e8f" stroke-width="2"/>
  <text x="575" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a9e8f">DoRA (Weight-Decomposed)</text>

  <!-- Decomposition -->
  <rect x="345" y="118" width="180" height="45" rx="6" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="2"/>
  <text x="435" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a4a5a">W₀ = m · V/‖V‖</text>
  <text x="435" y="156" text-anchor="middle" font-size="11" fill="#c0c0c8">decompose pretrained weight</text>

  <!-- Two branches -->
  <line x1="400" y1="163" x2="380" y2="195" stroke="#4a4a5a" stroke-width="1.5"/>
  <line x1="470" y1="163" x2="560" y2="195" stroke="#4a4a5a" stroke-width="1.5"/>

  <!-- Magnitude branch -->
  <rect x="340" y="198" width="120" height="65" rx="8" fill="#f6e4e3" stroke="#d4645c" stroke-width="2.5"/>
  <text x="400" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Magnitude m</text>
  <text x="400" y="240" text-anchor="middle" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace">m = ‖W₀‖_c</text>
  <text x="400" y="255" text-anchor="middle" font-size="11" fill="#d4645c">trainable scalar per column</text>

  <!-- Direction branch -->
  <rect x="500" y="198" width="180" height="65" rx="8" fill="#f5ece0" stroke="#d4a03c" stroke-width="2.5"/>
  <text x="590" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Direction V' = V + BA</text>
  <text x="590" y="240" text-anchor="middle" font-size="11" fill="#3a3a4a">LoRA applied to direction only</text>
  <text x="590" y="255" text-anchor="middle" font-size="11" fill="#d4a03c">normalized: V'/‖V'‖_c</text>

  <!-- Recombine -->
  <line x1="400" y1="263" x2="490" y2="295" stroke="#d4645c" stroke-width="1.5"/>
  <line x1="590" y1="263" x2="490" y2="295" stroke="#d4a03c" stroke-width="1.5"/>

  <rect x="430" y="298" width="200" height="40" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="530" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f" font-family="'JetBrains Mono', 'Fira Code', monospace">W' = m · (V + BA)/‖V + BA‖_c</text>
  <text x="530" y="332" text-anchor="middle" font-size="11" fill="#3a9e8f">magnitude x normalized direction</text>

  <!-- Insight -->
  <rect x="630" y="118" width="185" height="80" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="722" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Insight from Full FT</text>
  <text x="645" y="158" font-size="11" fill="#3a3a4a">Full fine-tuning changes</text>
  <text x="645" y="172" font-size="11" fill="#3a3a4a">magnitude and direction</text>
  <text x="645" y="186" font-size="11" fill="#d4a03c">independently. LoRA entangles.</text>

  <!-- Bottom comparison -->
  <rect x="30" y="400" width="800" height="15" rx="3" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1"/>
  <text x="430" y="412" text-anchor="middle" font-size="11" fill="#4a4a5a">DoRA consistently outperforms LoRA by 1-3% across NLU, NLG, and vision tasks with negligible parameter overhead (~0.01%)</text>
</svg>