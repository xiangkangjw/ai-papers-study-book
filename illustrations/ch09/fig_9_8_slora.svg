<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">S-LoRA: Serving Many LoRA Adapters Efficiently</text>
  <text x="430" y="46" text-anchor="middle" font-size="10" fill="#64748b">Sheng et al. (2023) — Unified memory management for thousands of concurrent LoRA adapters</text>

  <!-- Single base model -->
  <rect x="30" y="75" width="800" height="100" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Single Base Model in GPU Memory</text>

  <rect x="60" y="115" width="740" height="45" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="430" y="135" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">Frozen Base Weights (e.g., LLaMA-7B)</text>
  <text x="430" y="152" text-anchor="middle" font-size="8" fill="#94a3b8">Loaded once — shared across all requests</text>

  <!-- Multiple adapters -->
  <rect x="30" y="195" width="800" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="430" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">LoRA Adapter Pool (hot-swapped per request)</text>

  <rect x="55" y="230" width="95" height="50" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="102" y="250" text-anchor="middle" font-size="7" font-weight="bold" fill="#0c4a6e">Adapter A</text>
  <text x="102" y="264" text-anchor="middle" font-size="6" fill="#0284c7">chatbot</text>
  <text x="102" y="275" text-anchor="middle" font-size="5" fill="#94a3b8" font-family="'SF Mono', Consolas, monospace">r=16, ~4MB</text>

  <rect x="165" y="230" width="95" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="212" y="250" text-anchor="middle" font-size="7" font-weight="bold" fill="#14532d">Adapter B</text>
  <text x="212" y="264" text-anchor="middle" font-size="6" fill="#16a34a">code gen</text>
  <text x="212" y="275" text-anchor="middle" font-size="5" fill="#94a3b8" font-family="'SF Mono', Consolas, monospace">r=32, ~8MB</text>

  <rect x="275" y="230" width="95" height="50" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="322" y="250" text-anchor="middle" font-size="7" font-weight="bold" fill="#831843">Adapter C</text>
  <text x="322" y="264" text-anchor="middle" font-size="6" fill="#db2777">medical QA</text>
  <text x="322" y="275" text-anchor="middle" font-size="5" fill="#94a3b8" font-family="'SF Mono', Consolas, monospace">r=8, ~2MB</text>

  <rect x="385" y="230" width="95" height="50" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="432" y="250" text-anchor="middle" font-size="7" font-weight="bold" fill="#581c87">Adapter D</text>
  <text x="432" y="264" text-anchor="middle" font-size="6" fill="#9333ea">summarize</text>
  <text x="432" y="275" text-anchor="middle" font-size="5" fill="#94a3b8" font-family="'SF Mono', Consolas, monospace">r=16, ~4MB</text>

  <text x="510" y="258" font-size="16" fill="#94a3b8">···</text>

  <rect x="550" y="235" width="100" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="600" y="255" text-anchor="middle" font-size="7" font-weight="bold" fill="#78350f">up to 1000s</text>
  <text x="600" y="268" text-anchor="middle" font-size="6" fill="#d97706">of adapters</text>

  <!-- Memory management -->
  <rect x="670" y="228" width="145" height="55" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="742" y="248" text-anchor="middle" font-size="7" font-weight="bold" fill="#78350f">Unified Paging</text>
  <text x="742" y="262" text-anchor="middle" font-size="6" fill="#334155">GPU ↔ CPU memory</text>
  <text x="742" y="274" text-anchor="middle" font-size="6" fill="#d97706">page in/out on demand</text>

  <!-- Key innovations -->
  <rect x="30" y="310" width="260" height="100" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="160" y="335" text-anchor="middle" font-size="10" font-weight="bold" fill="#0c4a6e">Batched LoRA Computation</text>
  <text x="50" y="355" font-size="7" fill="#334155">Custom CUDA kernels for batched</text>
  <text x="50" y="370" font-size="7" fill="#334155">LoRA matmul across different adapters</text>
  <text x="50" y="385" font-size="7" fill="#334155">in a single batch (heterogeneous ranks)</text>
  <text x="50" y="400" font-size="7" fill="#0284c7" font-family="'SF Mono', Consolas, monospace">y_i = x_i W₀ + x_i B_i A_i</text>

  <rect x="310" y="310" width="250" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="435" y="335" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">Tensor Parallelism</text>
  <text x="330" y="355" font-size="7" fill="#334155">Base model: standard tensor parallel</text>
  <text x="330" y="370" font-size="7" fill="#334155">LoRA A: partitioned across GPUs</text>
  <text x="330" y="385" font-size="7" fill="#334155">LoRA B: replicated (small)</text>
  <text x="330" y="400" font-size="7" fill="#16a34a">Minimal communication overhead</text>

  <rect x="580" y="310" width="250" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="705" y="335" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">Results</text>
  <text x="600" y="355" font-size="7" fill="#334155">Serve 2000 adapters on single GPU</text>
  <text x="600" y="370" font-size="7" fill="#334155">4x throughput vs. naive approach</text>
  <text x="600" y="385" font-size="7" fill="#334155">30x throughput vs. individual deployment</text>
  <text x="600" y="400" font-size="7" fill="#d97706">No quality loss — exact same outputs</text>
</svg>