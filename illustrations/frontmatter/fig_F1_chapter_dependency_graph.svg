<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Gray (core) -->
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <!-- Purple (LLMs) -->
    <marker id="ap" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/></marker>
    <!-- Blue (Image Gen) -->
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/></marker>
    <!-- Pink (VLMs) -->
    <marker id="ak" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#db2777"/></marker>
    <!-- Green (RL) -->
    <marker id="ae" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Chapter Dependency Graph</text>
  <text x="440" y="48" text-anchor="middle" font-size="10" fill="#64748b">Colored arrows show recommended reading paths</text>

  <!-- ====== NODES ====== -->
  <!-- Row 1 (y=80): Ch2, Ch3 -->
  <rect x="170" y="80" width="100" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="220" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">Ch 2</text>
  <text x="220" y="116" text-anchor="middle" font-size="9" fill="#0284c7">VAE</text>

  <rect x="170" y="280" width="100" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="220" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">Ch 3</text>
  <text x="220" y="316" text-anchor="middle" font-size="9" fill="#0284c7">GAN</text>

  <!-- Row 2 (y=175): Main spine Ch1 → Ch4 → Ch5 -->
  <rect x="30" y="175" width="110" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
  <text x="85" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Ch 1</text>
  <text x="85" y="215" text-anchor="middle" font-size="9" fill="#475569">Foundations</text>

  <rect x="310" y="175" width="110" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
  <text x="365" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Ch 4</text>
  <text x="365" y="215" text-anchor="middle" font-size="9" fill="#475569">Transformer</text>

  <rect x="490" y="175" width="110" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
  <text x="545" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Ch 5</text>
  <text x="545" y="215" text-anchor="middle" font-size="9" fill="#475569">GPT / BERT</text>

  <!-- Row 1 right: Ch6, Ch9, Ch7 -->
  <rect x="560" y="80" width="100" height="48" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="610" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#831843">Ch 6</text>
  <text x="610" y="116" text-anchor="middle" font-size="9" fill="#db2777">ViT</text>

  <rect x="680" y="175" width="100" height="56" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="730" y="197" text-anchor="middle" font-size="11" font-weight="bold" fill="#3b0764">Ch 9</text>
  <text x="730" y="215" text-anchor="middle" font-size="9" fill="#9333ea">LoRA / PEFT</text>

  <rect x="770" y="80" width="90" height="48" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="815" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#3b0764">Ch 7</text>
  <text x="815" y="116" text-anchor="middle" font-size="9" fill="#9333ea">RAG</text>

  <!-- Row 3: Ch8, Ch10 -->
  <rect x="370" y="280" width="100" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="420" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">Ch 8</text>
  <text x="420" y="316" text-anchor="middle" font-size="9" fill="#0284c7">Diffusion</text>

  <rect x="620" y="280" width="110" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="675" y="302" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">Ch 10</text>
  <text x="675" y="320" text-anchor="middle" font-size="9" fill="#16a34a">RL &amp; VLM</text>

  <!-- ====== READING PATH ARROWS ====== -->

  <!-- GRAY core spine: Ch1 → Ch4 → Ch5 -->
  <line x1="140" y1="203" x2="308" y2="203" stroke="#475569" stroke-width="3" marker-end="url(#ag)"/>
  <line x1="420" y1="203" x2="488" y2="203" stroke="#475569" stroke-width="3" marker-end="url(#ag)"/>

  <!-- PURPLE path (LLMs): Ch1→Ch4→Ch5→Ch9→Ch7 -->
  <!-- Ch5 → Ch9 -->
  <line x1="600" y1="196" x2="678" y2="196" stroke="#9333ea" stroke-width="2.5" marker-end="url(#ap)"/>
  <!-- Ch9 → Ch7 -->
  <line x1="780" y1="175" x2="810" y2="128" stroke="#9333ea" stroke-width="2.5" marker-end="url(#ap)"/>

  <!-- BLUE path (Image Gen): Ch1→Ch2,Ch3→Ch4→Ch8 -->
  <!-- Ch1 → Ch2 -->
  <line x1="110" y1="175" x2="178" y2="128" stroke="#0284c7" stroke-width="2.5" marker-end="url(#ab)"/>
  <!-- Ch1 → Ch3 -->
  <line x1="110" y1="231" x2="178" y2="280" stroke="#0284c7" stroke-width="2.5" marker-end="url(#ab)"/>
  <!-- Ch2 → Ch4 (down-right) -->
  <line x1="270" y1="115" x2="330" y2="175" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ab)"/>
  <!-- Ch3 → Ch4 (up-right) -->
  <line x1="270" y1="290" x2="330" y2="231" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ab)"/>
  <!-- Ch4 → Ch8 -->
  <line x1="385" y1="231" x2="410" y2="278" stroke="#0284c7" stroke-width="2.5" marker-end="url(#ab)"/>

  <!-- PINK path (VLMs): Ch1→Ch4→Ch5→Ch6→Ch10 -->
  <!-- Ch5 → Ch6 -->
  <line x1="570" y1="175" x2="590" y2="128" stroke="#db2777" stroke-width="2.5" marker-end="url(#ak)"/>
  <!-- Ch6 → Ch10 -->
  <line x1="640" y1="128" x2="660" y2="278" stroke="#db2777" stroke-width="2.5" marker-end="url(#ak)"/>

  <!-- GREEN path (RL): Ch1→Ch4→Ch5→Ch10 -->
  <!-- Ch5 → Ch10 -->
  <line x1="580" y1="231" x2="630" y2="278" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ae)"/>

  <!-- ====== LEGEND ====== -->
  <rect x="30" y="375" width="820" height="115" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="440" y="398" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Reading Paths</text>

  <!-- Gray -->
  <line x1="60" y1="420" x2="90" y2="420" stroke="#475569" stroke-width="3"/>
  <text x="98" y="424" font-size="9" fill="#475569" font-weight="bold">Minimum viable: Ch1 → Ch4 → Ch5 (then branch)</text>

  <!-- Purple -->
  <line x1="60" y1="442" x2="90" y2="442" stroke="#9333ea" stroke-width="2.5"/>
  <text x="98" y="446" font-size="9" fill="#3b0764">"I want to understand LLMs": Ch1 → Ch4 → Ch5 → Ch9 → Ch7</text>

  <!-- Blue -->
  <line x1="60" y1="464" x2="90" y2="464" stroke="#0284c7" stroke-width="2.5"/>
  <text x="98" y="468" font-size="9" fill="#0c4a6e">"I want to understand image generation": Ch1 → Ch2, Ch3 → Ch4 → Ch8</text>

  <!-- Pink -->
  <line x1="460" y1="420" x2="490" y2="420" stroke="#db2777" stroke-width="2.5"/>
  <text x="498" y="424" font-size="9" fill="#831843">"I want to understand VLMs": Ch1 → Ch4 → Ch5 → Ch6 → Ch10</text>

  <!-- Green -->
  <line x1="460" y1="442" x2="490" y2="442" stroke="#16a34a" stroke-width="2.5"/>
  <text x="498" y="446" font-size="9" fill="#14532d">"I want to understand RL for AI": Ch1 → Ch4 → Ch5 → Ch10</text>
</svg>