<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">VQ-VAE: Vector Quantized Variational Autoencoder</text>
  <text x="430" y="46" text-anchor="middle" font-size="10" fill="#64748b">van den Oord et al. (2017) — Discrete latent space via codebook lookup</text>

  <!-- Input -->
  <rect x="20" y="85" width="90" height="60" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="65" y="112" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Input x</text>
  <text x="65" y="132" text-anchor="middle" font-size="7" fill="#64748b">image</text>

  <line x1="110" y1="115" x2="138" y2="115" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Encoder -->
  <rect x="140" y="80" width="100" height="70" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="190" y="110" text-anchor="middle" font-size="10" font-weight="bold" fill="#0c4a6e">Encoder</text>
  <text x="190" y="130" text-anchor="middle" font-size="7" fill="#0284c7" font-family="'SF Mono', Consolas, monospace">z_e(x) ∈ ℝ^d</text>
  <text x="190" y="145" text-anchor="middle" font-size="7" fill="#0284c7">continuous</text>

  <line x1="240" y1="115" x2="268" y2="115" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Quantization (nearest codebook) -->
  <rect x="270" y="72" width="160" height="86" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="350" y="95" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">Quantize</text>
  <text x="350" y="115" text-anchor="middle" font-size="8" fill="#d97706">Find nearest codebook vector:</text>
  <text x="350" y="133" text-anchor="middle" font-size="8" fill="#d97706" font-family="'SF Mono', Consolas, monospace">z_q = e_k where</text>
  <text x="350" y="150" text-anchor="middle" font-size="8" fill="#d97706" font-family="'SF Mono', Consolas, monospace">k = argmin ‖z_e - e_j‖</text>

  <line x1="430" y1="115" x2="458" y2="115" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Discrete latent -->
  <rect x="460" y="85" width="90" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="505" y="110" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532d">z_q</text>
  <text x="505" y="130" text-anchor="middle" font-size="7" fill="#16a34a">discrete</text>

  <line x1="550" y1="115" x2="578" y2="115" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Decoder -->
  <rect x="580" y="80" width="100" height="70" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="630" y="110" text-anchor="middle" font-size="10" font-weight="bold" fill="#831843">Decoder</text>
  <text x="630" y="130" text-anchor="middle" font-size="7" fill="#db2777">Reconstruct from z_q</text>

  <line x1="680" y1="115" x2="708" y2="115" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Output -->
  <rect x="710" y="85" width="90" height="60" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="755" y="112" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">x̂</text>
  <text x="755" y="132" text-anchor="middle" font-size="7" fill="#64748b">reconstruction</text>

  <!-- Codebook (below) -->
  <rect x="220" y="190" width="360" height="90" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">Codebook E = {e₁, e₂, ..., e_K}</text>
  <text x="400" y="230" text-anchor="middle" font-size="8" fill="#d97706" font-family="'SF Mono', Consolas, monospace">K vectors, each ∈ ℝ^d (e.g., K=512, d=64)</text>

  <!-- Codebook vectors -->
  <rect x="240" y="240" width="40" height="25" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="260" y="257" text-anchor="middle" font-size="7" fill="#78350f">e₁</text>
  <rect x="290" y="240" width="40" height="25" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="310" y="257" text-anchor="middle" font-size="7" fill="#78350f">e₂</text>
  <rect x="340" y="240" width="40" height="25" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="257" text-anchor="middle" font-size="7" font-weight="bold" fill="#14532d">e_k</text>
  <text x="395" y="257" text-anchor="middle" font-size="10" fill="#94a3b8">···</text>
  <rect x="415" y="240" width="40" height="25" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="435" y="257" text-anchor="middle" font-size="7" fill="#78350f">e_K</text>

  <!-- Arrow from codebook to quantize -->
  <line x1="360" y1="190" x2="360" y2="160" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="375" y="178" font-size="7" fill="#d97706">nearest</text>

  <!-- Straight-through estimator -->
  <rect x="130" y="295" width="600" height="35" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="430" y="312" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Straight-Through Estimator: ∇ passes through quantization as identity</text>
  <text x="430" y="325" text-anchor="middle" font-size="8" fill="#64748b" font-family="'SF Mono', Consolas, monospace">L = ‖x - x̂‖² + ‖sg[z_e] - e_k‖² + β·‖z_e - sg[e_k]‖²</text>
</svg>