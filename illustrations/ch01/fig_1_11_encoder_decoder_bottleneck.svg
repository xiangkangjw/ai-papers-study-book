<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a7fb5"/></marker>
    <marker id="ap" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d4645c"/></marker>
  </defs>

  <text x="460" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Encoder-Decoder with Information Bottleneck</text>

  <!-- ===== ENCODER ===== -->
  <rect x="20" y="80" width="320" height="180" rx="10" fill="#edf2f8" stroke="#4a7fb5" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="180" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7fb5">Encoder (LSTM)</text>

  <!-- Encoder cells -->
  <rect x="40" y="120" width="75" height="50" rx="8" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="77" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Enc₁</text>

  <rect x="150" y="120" width="75" height="50" rx="8" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="187" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Enc₂</text>

  <rect x="260" y="120" width="75" height="50" rx="8" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="297" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Enc₃</text>

  <!-- Encoder connections -->
  <line x1="115" y1="145" x2="148" y2="145" stroke="#4a7fb5" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="225" y1="145" x2="258" y2="145" stroke="#4a7fb5" stroke-width="2" marker-end="url(#ab)"/>

  <!-- Input tokens -->
  <rect x="45" y="200" width="65" height="30" rx="4" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="77" y="220" text-anchor="middle" font-size="11" fill="#1a1a2e">"I"</text>
  <rect x="155" y="200" width="65" height="30" rx="4" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="187" y="220" text-anchor="middle" font-size="11" fill="#1a1a2e">"love"</text>
  <rect x="265" y="200" width="65" height="30" rx="4" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="297" y="220" text-anchor="middle" font-size="11" fill="#1a1a2e">"ML"</text>

  <line x1="77" y1="200" x2="77" y2="172" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="187" y1="200" x2="187" y2="172" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="297" y1="200" x2="297" y2="172" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ===== CONTEXT VECTOR (Bottleneck) ===== -->
  <circle cx="430" cy="145" r="40" fill="#f6e4e3" stroke="#d4645c" stroke-width="3"/>
  <text x="430" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#b5454a">Context C</text>
  <text x="430" y="155" text-anchor="middle" font-size="11" fill="#b5454a">Fixed-size</text>
  <text x="430" y="168" text-anchor="middle" font-size="11" fill="#b5454a">vector</text>

  <!-- Arrow encoder → context -->
  <line x1="335" y1="145" x2="388" y2="145" stroke="#d4645c" stroke-width="3" marker-end="url(#a)"/>
  <text x="362" y="135" text-anchor="middle" font-size="11" fill="#d4645c">compress</text>

  <!-- Bottleneck annotation -->
  <text x="430" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">⚠ Information Bottleneck</text>
  <text x="430" y="225" text-anchor="middle" font-size="11" fill="#b5454a">Entire input compressed to</text>
  <text x="430" y="238" text-anchor="middle" font-size="11" fill="#b5454a">one vector — lossy for long seq</text>

  <!-- ===== DECODER ===== -->
  <rect x="520" y="80" width="380" height="180" rx="10" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="710" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#d4645c">Decoder (LSTM)</text>

  <!-- Decoder cells -->
  <rect x="540" y="120" width="75" height="50" rx="8" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="577" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Dec₁</text>

  <rect x="660" y="120" width="75" height="50" rx="8" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="697" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Dec₂</text>

  <rect x="780" y="120" width="75" height="50" rx="8" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="817" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Dec₃</text>

  <!-- Decoder connections -->
  <line x1="615" y1="145" x2="658" y2="145" stroke="#d4645c" stroke-width="2" marker-end="url(#ap)"/>
  <line x1="735" y1="145" x2="778" y2="145" stroke="#d4645c" stroke-width="2" marker-end="url(#ap)"/>

  <!-- Context → Decoder -->
  <line x1="470" y1="145" x2="538" y2="145" stroke="#d4645c" stroke-width="3" marker-end="url(#a)"/>
  <text x="504" y="135" text-anchor="middle" font-size="11" fill="#d4645c">init state</text>

  <!-- BOS token -->
  <rect x="545" y="200" width="65" height="30" rx="4" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="577" y="220" text-anchor="middle" font-size="11" fill="#1a1a2e">⟨BOS⟩</text>
  <line x1="577" y1="200" x2="577" y2="172" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Decoder outputs -->
  <rect x="545" y="85" width="65" height="28" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="577" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">"J'aime"</text>
  <line x1="577" y1="120" x2="577" y2="115" stroke="#4a4a5a" stroke-width="1"/>

  <rect x="665" y="85" width="65" height="28" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="697" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">"le"</text>
  <line x1="697" y1="120" x2="697" y2="115" stroke="#4a4a5a" stroke-width="1"/>

  <rect x="785" y="85" width="65" height="28" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="817" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">"ML"</text>
  <line x1="817" y1="120" x2="817" y2="115" stroke="#4a4a5a" stroke-width="1"/>

  <!-- Auto-regressive feedback (dashed) -->
  <path d="M 577 85 C 577 75, 640 75, 640 200" fill="none" stroke="#c0c0c8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="640" y1="200" x2="660" y2="200" stroke="#c0c0c8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="660" y1="200" x2="697" y2="172" stroke="#c0c0c8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a)"/>

  <path d="M 697 85 C 697 75, 760 75, 760 200" fill="none" stroke="#c0c0c8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="760" y1="200" x2="780" y2="200" stroke="#c0c0c8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="780" y1="200" x2="817" y2="172" stroke="#c0c0c8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a)"/>

  <text x="640" y="250" font-size="11" fill="#c0c0c8">autoregressive feed</text>

  <!-- Bottom annotation -->
  <rect x="60" y="290" width="800" height="70" rx="8" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="1"/>
  <text x="460" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Why This Matters</text>
  <text x="460" y="328" text-anchor="middle" font-size="11" fill="#3a3a4a">The fixed-size context vector cannot represent arbitrarily long inputs faithfully.</text>
  <text x="460" y="346" text-anchor="middle" font-size="11" fill="#3a3a4a">This bottleneck motivated the attention mechanism (Ch4) — letting the decoder look at all encoder states.</text>
</svg>