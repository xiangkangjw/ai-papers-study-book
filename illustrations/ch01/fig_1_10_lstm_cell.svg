<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">LSTM Cell Architecture</text>

  <!-- ===== Cell State Highway (top) ===== -->
  <line x1="30" y1="90" x2="790" y2="90" stroke="#16a34a" stroke-width="4"/>
  <text x="410" y="78" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">Cell State Highway c_t  (Gradient Highway — additive updates preserve gradients)</text>

  <!-- c_{t-1} label -->
  <text x="20" y="95" text-anchor="end" font-size="10" font-weight="bold" fill="#14532d" font-family="'SF Mono', Consolas, monospace">c_{t-1}</text>
  <!-- c_t label -->
  <text x="800" y="95" font-size="10" font-weight="bold" fill="#14532d" font-family="'SF Mono', Consolas, monospace">c_t</text>

  <!-- ===== Forget Gate ===== -->
  <rect x="100" y="120" width="130" height="65" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="165" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">Forget Gate f_t</text>
  <text x="165" y="158" text-anchor="middle" font-size="8" fill="#92400e" font-family="'SF Mono', Consolas, monospace">σ(W_f·[h_{t-1},x_t]+b_f)</text>
  <text x="165" y="178" text-anchor="middle" font-size="8" fill="#d97706">Output: 0 (forget) to 1 (keep)</text>

  <!-- Forget gate pointwise multiply on highway -->
  <circle cx="165" cy="90" r="14" fill="white" stroke="#d97706" stroke-width="2"/>
  <text x="165" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">⊗</text>
  <line x1="165" y1="120" x2="165" y2="106" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ===== Input Gate ===== -->
  <rect x="280" y="120" width="130" height="65" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="345" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">Input Gate i_t</text>
  <text x="345" y="158" text-anchor="middle" font-size="8" fill="#92400e" font-family="'SF Mono', Consolas, monospace">σ(W_i·[h_{t-1},x_t]+b_i)</text>
  <text x="345" y="178" text-anchor="middle" font-size="8" fill="#d97706">What new info to store</text>

  <!-- ===== Candidate ===== -->
  <rect x="280" y="210" width="130" height="55" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="345" y="230" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">Candidate c̃_t</text>
  <text x="345" y="248" text-anchor="middle" font-size="8" fill="#92400e" font-family="'SF Mono', Consolas, monospace">tanh(W_c·[h_{t-1},x_t])</text>

  <!-- Input gate × Candidate -->
  <circle cx="345" cy="290" r="14" fill="white" stroke="#d97706" stroke-width="2"/>
  <text x="345" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">⊗</text>
  <line x1="345" y1="185" x2="345" y2="278" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="345" y1="265" x2="345" y2="278" stroke="#d97706" stroke-width="1.5"/>

  <!-- Add to highway -->
  <circle cx="410" cy="90" r="14" fill="white" stroke="#16a34a" stroke-width="2.5"/>
  <text x="410" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">⊕</text>
  <!-- Arrow from i⊗c̃ up to highway -->
  <line x1="359" y1="290" x2="395" y2="290" stroke="#475569" stroke-width="1.5"/>
  <line x1="410" y1="290" x2="410" y2="106" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- ===== Output Gate ===== -->
  <rect x="510" y="120" width="130" height="65" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="575" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">Output Gate o_t</text>
  <text x="575" y="158" text-anchor="middle" font-size="8" fill="#92400e" font-family="'SF Mono', Consolas, monospace">σ(W_o·[h_{t-1},x_t]+b_o)</text>
  <text x="575" y="178" text-anchor="middle" font-size="8" fill="#d97706">What to expose</text>

  <!-- tanh of cell state -->
  <rect x="510" y="210" width="60" height="35" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="540" y="233" text-anchor="middle" font-size="10" font-weight="bold" fill="#0c4a6e">tanh</text>
  <!-- Arrow from highway down to tanh -->
  <line x1="540" y1="90" x2="540" y2="90" stroke="#16a34a" stroke-width="1"/>
  <circle cx="540" cy="90" r="3" fill="#16a34a"/>
  <line x1="540" y1="93" x2="540" y2="208" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Output gate × tanh(c) -->
  <circle cx="620" cy="230" r="14" fill="white" stroke="#d97706" stroke-width="2"/>
  <text x="620" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">⊗</text>
  <line x1="570" y1="227" x2="604" y2="227" stroke="#475569" stroke-width="1.5"/>
  <line x1="575" y1="185" x2="620" y2="218" stroke="#d97706" stroke-width="1.5"/>

  <!-- h_t output -->
  <line x1="634" y1="230" x2="720" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="720" y="210" width="80" height="40" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="760" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">h_t</text>

  <!-- ===== Inputs from below ===== -->
  <!-- h_{t-1} -->
  <rect x="20" y="370" width="90" height="40" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="65" y="395" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">h_{t-1}</text>

  <!-- x_t -->
  <rect x="20" y="430" width="90" height="40" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="65" y="455" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">x_t</text>

  <!-- Concat box -->
  <rect x="150" y="370" width="110" height="100" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="205" y="400" text-anchor="middle" font-size="10" font-weight="bold" fill="#0c4a6e">Concat</text>
  <text x="205" y="418" text-anchor="middle" font-size="9" fill="#0284c7">[h_{t-1}, x_t]</text>
  <text x="205" y="458" text-anchor="middle" font-size="8" fill="#64748b" font-family="'SF Mono', Consolas, monospace">[2·d_h]</text>

  <!-- Arrows to concat -->
  <line x1="110" y1="390" x2="148" y2="400" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="110" y1="450" x2="148" y2="440" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Fan-out from concat to all gates -->
  <line x1="260" y1="400" x2="290" y2="400" stroke="#475569" stroke-width="1.5"/>
  <line x1="290" y1="400" x2="290" y2="152" stroke="#475569" stroke-width="1"/>
  <line x1="290" y1="152" x2="165" y2="152" stroke="#475569" stroke-width="1"/>
  <line x1="165" y1="185" x2="165" y2="152" stroke="none"/>
  <!-- Connect to forget gate -->
  <line x1="260" y1="420" x2="140" y2="420" stroke="#475569" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="140" y1="420" x2="140" y2="187" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>
  <!-- Connect to input gate + candidate -->
  <line x1="260" y1="410" x2="310" y2="410" stroke="#475569" stroke-width="1"/>
  <line x1="310" y1="410" x2="310" y2="187" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>
  <line x1="310" y1="410" x2="310" y2="265" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>
  <!-- Connect to output gate -->
  <line x1="260" y1="430" x2="540" y2="430" stroke="#475569" stroke-width="1"/>
  <line x1="540" y1="430" x2="540" y2="187" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>

  <!-- Cell state equation -->
  <rect x="140" y="510" width="540" height="45" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="410" y="528" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">Cell State Update (Additive — not multiplicative!)</text>
  <text x="410" y="546" text-anchor="middle" font-size="10" fill="#14532d" font-family="'SF Mono', Consolas, monospace">c_t = f_t ⊙ c_{t-1} + i_t ⊙ c̃_t     →     Gradient flows through ⊕ unattenuated</text>
</svg>