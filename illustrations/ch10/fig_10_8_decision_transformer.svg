<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Decision Transformer: RL as Sequence Modeling</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Chen et al. (2021) — Cast offline RL as autoregressive prediction conditioned on returns-to-go</text>

  <!-- Main architecture -->
  <rect x="30" y="65" width="800" height="240" rx="10" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="2"/>
  <text x="430" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">Decision Transformer Architecture</text>

  <!-- Input sequence -->
  <text x="80" y="118" font-size="11" font-weight="bold" fill="#4a4a5a">Input Sequence (interleaved triplets):</text>

  <!-- Timestep 1 -->
  <rect x="55" y="130" width="55" height="35" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="82" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">R̂₁</text>
  <text x="82" y="160" text-anchor="middle" font-size="11" fill="#3a9e8f">RTG</text>

  <rect x="115" y="130" width="55" height="35" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="142" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">s₁</text>
  <text x="142" y="160" text-anchor="middle" font-size="11" fill="#4a7fb5">state</text>

  <rect x="175" y="130" width="55" height="35" rx="4" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="202" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">a₁</text>
  <text x="202" y="160" text-anchor="middle" font-size="11" fill="#d4a03c">action</text>

  <!-- Timestep 2 -->
  <rect x="255" y="130" width="55" height="35" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="282" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">R̂₂</text>
  <text x="282" y="160" text-anchor="middle" font-size="11" fill="#3a9e8f">RTG</text>

  <rect x="315" y="130" width="55" height="35" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="342" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">s₂</text>
  <text x="342" y="160" text-anchor="middle" font-size="11" fill="#4a7fb5">state</text>

  <rect x="375" y="130" width="55" height="35" rx="4" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="402" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">a₂</text>
  <text x="402" y="160" text-anchor="middle" font-size="11" fill="#d4a03c">action</text>

  <!-- Dots -->
  <text x="450" y="152" font-size="14" fill="#c0c0c8">···</text>

  <!-- Current timestep -->
  <rect x="480" y="130" width="55" height="35" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="507" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">R̂_t</text>
  <text x="507" y="160" text-anchor="middle" font-size="11" fill="#3a9e8f">RTG</text>

  <rect x="540" y="130" width="55" height="35" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="567" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">s_t</text>
  <text x="567" y="160" text-anchor="middle" font-size="11" fill="#4a7fb5">state</text>

  <rect x="600" y="130" width="55" height="35" rx="4" fill="#f6e4e3" stroke="#d4645c" stroke-width="2.5"/>
  <text x="627" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">a_t ?</text>
  <text x="627" y="160" text-anchor="middle" font-size="11" fill="#d4645c">predict</text>

  <!-- Embeddings -->
  <line x1="400" y1="165" x2="400" y2="188" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="100" y="190" width="600" height="40" rx="6" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="400" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">GPT-2 Transformer (Causal Self-Attention)</text>
  <text x="400" y="224" text-anchor="middle" font-size="11" fill="#d4645c">Each modality has its own embedding layer + timestep positional encoding</text>

  <!-- Output -->
  <line x1="627" y1="230" x2="627" y2="253" stroke="#d4645c" stroke-width="2" marker-end="url(#a)"/>

  <rect x="590" y="255" width="80" height="35" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="630" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">â_t</text>
  <text x="630" y="285" text-anchor="middle" font-size="11" fill="#3a9e8f">predicted</text>

  <!-- RTG explanation -->
  <rect x="680" y="120" width="130" height="80" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="745" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Returns-to-Go</text>
  <text x="745" y="158" text-anchor="middle" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace">R̂_t = Σ_{k=t}^T r_k</text>
  <text x="745" y="175" text-anchor="middle" font-size="11" fill="#3a3a4a">Desired future return</text>
  <text x="745" y="190" text-anchor="middle" font-size="11" fill="#3a9e8f">Set high → optimal behavior</text>

  <!-- Key insight -->
  <rect x="30" y="325" width="390" height="85" rx="8" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="225" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Key Insight</text>
  <text x="50" y="368" font-size="11" fill="#3a3a4a">RL trajectory = sequence of (R̂, s, a) tokens</text>
  <text x="50" y="385" font-size="11" fill="#3a3a4a">Train: next-token prediction on offline data</text>
  <text x="50" y="402" font-size="11" fill="#d4a03c" font-weight="bold">Inference: condition on high R̂ → model outputs</text>
  <text x="50" y="415" font-size="11" fill="#d4a03c" font-weight="bold">actions that achieve that return level</text>

  <!-- Comparison -->
  <rect x="440" y="325" width="390" height="85" rx="8" fill="#edf7f5" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="635" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Why This Matters</text>
  <text x="460" y="368" font-size="11" fill="#3a3a4a">• No value functions, no policy gradients, no TD</text>
  <text x="460" y="385" font-size="11" fill="#3a3a4a">• Standard supervised loss on offline trajectories</text>
  <text x="460" y="402" font-size="11" fill="#3a3a4a">• Leverages transformer scaling + context window</text>
  <text x="460" y="415" font-size="11" fill="#3a9e8f">• Bridge between LLM methods and RL</text>
</svg>