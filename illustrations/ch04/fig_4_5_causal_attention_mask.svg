    <rect x="180" y="155" width="50" height="45" rx="3" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
    <text x="205" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">.4</text>
  </g>

  <!-- Key insight box -->
  <rect x="100" y="340" width="600" height="44" rx="8" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="1.5"/>
  <text x="400" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">e^(−∞) = 0  →  Softmax zeroes out future positions</text>
  <text x="400" y="375" text-anchor="middle" font-size="11" fill="#7a7a8a">Each row's visible weights sum to 1.0 — probability distribution over allowed positions only</text>

  <!-- Triangular mask visual -->
  <text x="400" y="420" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a3a4a">Mask Pattern (T=4)</text>
  <g transform="translate(330, 430)">
    <rect x="0" y="0" width="20" height="20" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1"/>
    <rect x="20" y="0" width="20" height="20" fill="#f6e4e3" stroke="#d4645c" stroke-width="1"/>
    <rect x="40" y="0" width="20" height="20" fill="#f6e4e3" stroke="#d4645c" stroke-width="1"/>
    <rect x="60" y="0" width="20" height="20" fill="#f6e4e3" stroke="#d4645c" stroke-width="1"/>
    <rect x="0" y="20" width="20" height="20" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1"/>
    <rect x="20" y="20" width="20" height="20" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1"/>
    <rect x="40" y="20" width="20" height="20" fill="#f6e4e3" stroke="#d4645c" stroke-width="1"/>
    <rect x="60" y="20" width="20" height="20" fill="#f6e4e3" stroke="#d4645c" stroke-width="1"/>
    <rect x="0" y="40" width="20" height="20" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1"/>
    <rect x="20" y="40" width="20" height="20" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1"/>
    <rect x="40" y="40" width="20" height="20" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1"/>
    <rect x="60" y="40" width="20" height="20" fill="#f6e4e3" stroke="#d4645c" stroke-width="1"/>
    <rect x="0" y="60" width="20" height="20" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1"/>
    <rect x="20" y="60" width="20" height="20" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1"/>
    <rect x="40" y="60" width="20" height="20" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1"/>
    <rect x="60" y="60" width="20" height="20" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1"/>
