<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Embodied AI: LLMs as Robot Brains</text>
  <text x="430" y="46" text-anchor="middle" font-size="10" fill="#64748b">Grounding language models in physical world through perception and action</text>

  <!-- Main loop -->
  <rect x="30" y="65" width="800" height="260" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Perception -->
  <rect x="55" y="95" width="170" height="100" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="140" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#0c4a6e">Perception</text>
  <text x="140" y="138" text-anchor="middle" font-size="8" fill="#334155">Camera, LiDAR, depth</text>
  <text x="140" y="155" text-anchor="middle" font-size="8" fill="#334155">→ Visual tokens</text>
  <text x="140" y="172" text-anchor="middle" font-size="8" fill="#334155">→ Scene description</text>
  <text x="140" y="189" text-anchor="middle" font-size="7" fill="#0284c7">CLIP / ViT / SAM</text>

  <line x1="225" y1="145" x2="268" y2="145" stroke="#0284c7" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- LLM Planner -->
  <rect x="270" y="80" width="280" height="130" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
  <text x="410" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#831843">LLM Planner / Reasoner</text>

  <text x="290" y="128" font-size="8" fill="#334155">Task: "Make me a cup of coffee"</text>

  <rect x="290" y="138" width="240" height="60" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
  <text x="410" y="155" text-anchor="middle" font-size="7" fill="#831843" font-family="'SF Mono', Consolas, monospace">1. Find coffee machine</text>
  <text x="410" y="168" text-anchor="middle" font-size="7" fill="#831843" font-family="'SF Mono', Consolas, monospace">2. Pick up coffee pod</text>
  <text x="410" y="181" text-anchor="middle" font-size="7" fill="#831843" font-family="'SF Mono', Consolas, monospace">3. Insert pod → press start</text>
  <text x="410" y="194" text-anchor="middle" font-size="7" fill="#831843" font-family="'SF Mono', Consolas, monospace">4. Wait → pick up mug → serve</text>

  <line x1="550" y1="145" x2="593" y2="145" stroke="#db2777" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Action execution -->
  <rect x="595" y="95" width="170" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="680" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">Action</text>
  <text x="680" y="138" text-anchor="middle" font-size="8" fill="#334155">Low-level controllers</text>
  <text x="680" y="155" text-anchor="middle" font-size="8" fill="#334155">Grasping, navigation</text>
  <text x="680" y="172" text-anchor="middle" font-size="8" fill="#334155">Motor commands</text>
  <text x="680" y="189" text-anchor="middle" font-size="7" fill="#16a34a">RT-2 / skill primitives</text>

  <!-- Feedback loop -->
  <line x1="680" y1="195" x2="680" y2="230" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="680" y1="230" x2="410" y2="230" stroke="#d97706" stroke-width="1.5"/>
  <line x1="410" y1="230" x2="140" y2="230" stroke="#d97706" stroke-width="1.5"/>
  <line x1="140" y1="230" x2="140" y2="195" stroke="#0284c7" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="410" y="248" text-anchor="middle" font-size="7" fill="#d97706">Environment feedback → re-perceive → re-plan if needed</text>

  <!-- World model -->
  <rect x="300" y="260" width="260" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="430" y="278" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">Grounding: affordances, physics, spatial reasoning</text>
  <text x="430" y="295" text-anchor="middle" font-size="7" fill="#d97706">LLM must understand what is physically possible</text>

  <!-- Key systems -->
  <rect x="30" y="345" width="800" height="105" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="430" y="368" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">Key Systems</text>

  <rect x="50" y="380" width="170" height="55" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="135" y="398" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">SayCan (Google)</text>
  <text x="135" y="413" text-anchor="middle" font-size="7" fill="#334155">LLM plans + affordance</text>
  <text x="135" y="428" text-anchor="middle" font-size="7" fill="#334155">scoring filters actions</text>

  <rect x="240" y="380" width="170" height="55" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="325" y="398" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">RT-2 (Google)</text>
  <text x="325" y="413" text-anchor="middle" font-size="7" fill="#334155">VLM outputs robot actions</text>
  <text x="325" y="428" text-anchor="middle" font-size="7" fill="#334155">as text tokens directly</text>

  <rect x="430" y="380" width="170" height="55" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="515" y="398" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">PaLM-E (Google)</text>
  <text x="515" y="413" text-anchor="middle" font-size="7" fill="#334155">562B embodied multimodal</text>
  <text x="515" y="428" text-anchor="middle" font-size="7" fill="#334155">LM with sensor inputs</text>

  <rect x="620" y="380" width="190" height="55" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="715" y="398" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">Voyager (NVIDIA)</text>
  <text x="715" y="413" text-anchor="middle" font-size="7" fill="#334155">LLM writes code as actions</text>
  <text x="715" y="428" text-anchor="middle" font-size="7" fill="#334155">in Minecraft — lifelong learning</text>
</svg>