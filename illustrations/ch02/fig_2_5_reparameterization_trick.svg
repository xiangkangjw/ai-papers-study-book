<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#3a9e8f"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d4645c"/></marker>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">The Reparameterization Trick</text>

  <!-- ===== (a) Naive: Gradient Blocked ===== -->
  <rect x="15" y="50" width="400" height="350" rx="10" fill="#f6e4e3" stroke="#e4ada9" stroke-width="1.5"/>
  <text x="215" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#b5454a">(a) Naive Sampling — Gradient Blocked</text>

  <!-- Encoder -->
  <rect x="35" y="110" width="80" height="40" rx="6" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="75" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Encoder</text>

  <!-- μ, σ outputs -->
  <rect x="150" y="95" width="50" height="30" rx="4" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="175" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">μ</text>
  <rect x="150" y="135" width="50" height="30" rx="4" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="175" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">σ</text>

  <line x1="115" y1="125" x2="148" y2="110" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="115" y1="135" x2="148" y2="150" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Sample node (STOCHASTIC - blocks gradient) -->
  <circle cx="270" cy="130" r="28" fill="#f6e4e3" stroke="#d4645c" stroke-width="2.5"/>
  <text x="270" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#b5454a">SAMPLE</text>
  <text x="270" y="140" text-anchor="middle" font-size="11" fill="#b5454a">z ~ N(μ,σ²)</text>

  <line x1="200" y1="110" x2="244" y2="120" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="200" y1="150" x2="244" y2="140" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Big red X -->
  <text x="270" y="185" text-anchor="middle" font-size="28" font-weight="bold" fill="#d4645c">✗</text>

  <!-- Decoder -->
  <rect x="330" y="110" width="70" height="40" rx="6" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="365" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Decoder</text>
  <line x1="298" y1="130" x2="328" y2="130" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Gradient arrows that STOP -->
  <line x1="365" y1="160" x2="365" y2="200" stroke="#d4645c" stroke-width="2"/>
  <line x1="365" y1="200" x2="305" y2="200" stroke="#d4645c" stroke-width="2"/>
  <text x="340" y="215" text-anchor="middle" font-size="11" fill="#d4645c">∇ flows here...</text>

  <line x1="295" y1="200" x2="255" y2="200" stroke="#d4645c" stroke-width="2.5" stroke-dasharray="4,3"/>
  <text x="258" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">∇ BLOCKED!</text>
  <text x="258" y="255" text-anchor="middle" font-size="11" fill="#b5454a">Cannot differentiate</text>
  <text x="258" y="268" text-anchor="middle" font-size="11" fill="#b5454a">through random sampling</text>

  <rect x="40" y="300" width="360" height="50" rx="6" fill="#f6e4e3" stroke="#d4645c" stroke-width="1"/>
  <text x="220" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#b5454a">Problem: ∂z/∂μ and ∂z/∂σ are undefined</text>
  <text x="220" y="336" text-anchor="middle" font-size="11" fill="#b5454a">Sampling is a stochastic operation — no gradient path</text>

  <!-- ===== (b) Reparameterized: Gradient Flows ===== -->
  <rect x="445" y="50" width="400" height="350" rx="10" fill="#edf7f5" stroke="#c5e6e1" stroke-width="1.5"/>
  <text x="645" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a9e8f">(b) Reparameterized — Gradient Flows</text>

  <!-- Encoder -->
  <rect x="465" y="110" width="80" height="40" rx="6" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="505" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Encoder</text>

  <!-- μ, σ outputs -->
  <rect x="580" y="95" width="50" height="30" rx="4" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="605" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">μ</text>
  <rect x="580" y="135" width="50" height="30" rx="4" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="605" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">σ</text>

  <line x1="545" y1="125" x2="578" y2="110" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="545" y1="135" x2="578" y2="150" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ε ~ N(0,1) (external randomness) -->
  <rect x="660" y="190" width="80" height="36" rx="6" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="700" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a7a8a">ε ~ N(0,1)</text>
  <text x="700" y="220" text-anchor="middle" font-size="11" fill="#c0c0c8">no gradient needed</text>

  <!-- Deterministic computation node -->
  <circle cx="700" cy="130" r="28" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2.5"/>
  <text x="700" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">z = μ + σ⊙ε</text>
  <text x="700" y="138" text-anchor="middle" font-size="11" fill="#3a9e8f">deterministic!</text>

  <line x1="630" y1="110" x2="674" y2="120" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="630" y1="150" x2="674" y2="140" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="700" y1="190" x2="700" y2="160" stroke="#c0c0c8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Decoder -->
  <rect x="760" y="110" width="70" height="40" rx="6" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="795" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Decoder</text>
  <line x1="728" y1="130" x2="758" y2="130" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Gradient flows (green arrows going backward) -->
  <line x1="760" y1="155" x2="760" y2="260" stroke="#3a9e8f" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="760" y1="260" x2="730" y2="260" stroke="#3a9e8f" stroke-width="2"/>
  <line x1="700" y1="260" x2="700" y2="160" stroke="#3a9e8f" stroke-width="2"/>
  <line x1="700" y1="260" x2="620" y2="260" stroke="#3a9e8f" stroke-width="2"/>
  <line x1="605" y1="260" x2="605" y2="167" stroke="#3a9e8f" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="605" y1="260" x2="505" y2="260" stroke="#3a9e8f" stroke-width="2"/>
  <line x1="505" y1="260" x2="505" y2="152" stroke="#3a9e8f" stroke-width="2" marker-end="url(#ag)"/>
  <text x="660" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">∇ flows through μ and σ ✓</text>

  <rect x="470" y="300" width="360" height="50" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1"/>
  <text x="650" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Solution: Move randomness to ε (external input)</text>
  <text x="650" y="336" text-anchor="middle" font-size="11" fill="#3a9e8f">z = μ + σ ⊙ ε is deterministic given ε → differentiable w.r.t. μ, σ</text>
</svg>