<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Mixture of Experts (MoE)</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Shazeer et al. (2017) — Sparse activation: only top-k experts process each token</text>

  <!-- Standard FFN vs MoE comparison -->
  <rect x="30" y="65" width="350" height="200" rx="10" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="2"/>
  <text x="205" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Standard Transformer FFN</text>

  <rect x="130" y="110" width="150" height="40" rx="6" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="205" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Single FFN</text>

  <text x="205" y="175" text-anchor="middle" font-size="11" fill="#3a3a4a">Every token uses same FFN</text>
  <text x="205" y="195" text-anchor="middle" font-size="11" fill="#3a3a4a">Parameters: d × 4d × d</text>
  <text x="205" y="215" text-anchor="middle" font-size="11" fill="#3a3a4a">All params active for all tokens</text>
  <text x="205" y="240" text-anchor="middle" font-size="11" fill="#7a7a8a" font-family="'JetBrains Mono', 'Fira Code', monospace">FLOPs ∝ total params</text>

  <!-- MoE Layer -->
  <rect x="420" y="65" width="420" height="340" rx="10" fill="#edf7f5" stroke="#3a9e8f" stroke-width="2"/>
  <text x="630" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">MoE Layer (replaces FFN)</text>

  <!-- Input token -->
  <rect x="440" y="110" width="80" height="35" rx="5" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="2"/>
  <text x="480" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Token x</text>

  <!-- Router/Gate -->
  <line x1="480" y1="145" x2="530" y2="168" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="440" y="170" width="180" height="40" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="530" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Router G(x) = softmax(W_g · x)</text>

  <!-- Router outputs -->
  <line x1="530" y1="210" x2="460" y2="238" stroke="#d4a03c" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="530" y1="210" x2="520" y2="238" stroke="#c0c0c8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="530" y1="210" x2="580" y2="238" stroke="#c0c0c8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="530" y1="210" x2="640" y2="238" stroke="#c0c0c8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="530" y1="210" x2="700" y2="238" stroke="#d4a03c" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="530" y1="210" x2="760" y2="238" stroke="#c0c0c8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="530" y1="210" x2="810" y2="238" stroke="#c0c0c8" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Experts -->
  <rect x="435" y="240" width="55" height="45" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="462" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">E₁</text>
  <text x="462" y="275" text-anchor="middle" font-size="11" fill="#3a9e8f">g₁=0.7</text>

  <rect x="497" y="240" width="50" height="45" rx="4" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="522" y="260" text-anchor="middle" font-size="11" fill="#c0c0c8">E₂</text>
  <text x="522" y="275" text-anchor="middle" font-size="11" fill="#c0c0c8">0</text>

  <rect x="554" y="240" width="50" height="45" rx="4" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="579" y="260" text-anchor="middle" font-size="11" fill="#c0c0c8">E₃</text>
  <text x="579" y="275" text-anchor="middle" font-size="11" fill="#c0c0c8">0</text>

  <rect x="611" y="240" width="50" height="45" rx="4" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="636" y="260" text-anchor="middle" font-size="11" fill="#c0c0c8">E₄</text>
  <text x="636" y="275" text-anchor="middle" font-size="11" fill="#c0c0c8">0</text>

  <rect x="668" y="240" width="55" height="45" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="695" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">E₅</text>
  <text x="695" y="275" text-anchor="middle" font-size="11" fill="#3a9e8f">g₅=0.3</text>

  <rect x="730" y="240" width="50" height="45" rx="4" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="755" y="260" text-anchor="middle" font-size="11" fill="#c0c0c8">E₆</text>

  <rect x="787" y="240" width="50" height="45" rx="4" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="812" y="260" text-anchor="middle" font-size="11" fill="#c0c0c8">...</text>

  <!-- Weighted sum -->
  <line x1="462" y1="285" x2="580" y2="310" stroke="#3a9e8f" stroke-width="1.5"/>
  <line x1="695" y1="285" x2="580" y2="310" stroke="#3a9e8f" stroke-width="1.5"/>

  <circle cx="580" cy="315" r="14" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="580" y="319" text-anchor="middle" font-size="11" fill="#3a9e8f">Σ</text>

  <line x1="580" y1="329" x2="580" y2="352" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="530" y="355" width="100" height="30" rx="5" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="580" y="374" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">y = Σ gᵢ·Eᵢ(x)</text>

  <!-- Top-k annotation -->
  <text x="630" y="325" font-size="11" fill="#d4a03c" font-weight="bold">Top-k=2 selected</text>
  <text x="630" y="340" font-size="11" fill="#d4a03c">Only 2 of N experts compute</text>

  <!-- Load balancing -->
  <rect x="30" y="290" width="350" height="105" rx="8" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="205" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Load Balancing Loss</text>
  <text x="50" y="338" font-size="11" fill="#3a3a4a">Without auxiliary loss, router may collapse</text>
  <text x="50" y="355" font-size="11" fill="#3a3a4a">to always picking same experts.</text>
  <text x="50" y="378" font-size="11" fill="#d4a03c" font-family="'JetBrains Mono', 'Fira Code', monospace">L_balance = α · N · Σ fᵢ · Pᵢ</text>
  <text x="50" y="393" font-size="11" fill="#7a7a8a">fᵢ = fraction of tokens routed to expert i</text>

  <!-- Key numbers -->
  <rect x="30" y="415" width="350" height="75" rx="8" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="205" y="438" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Key Insight</text>
  <text x="50" y="458" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace">Total params: N × expert_size (massive)</text>
  <text x="50" y="475" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace">Active params: k × expert_size (small)</text>
  <text x="50" y="490" font-size="11" fill="#3a9e8f" font-weight="bold">→ Scale capacity without scaling compute!</text>
</svg>