<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a7fb5"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Classifier-Free Guidance: Vector Extrapolation</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Ho &amp; Salimans (2022) — Amplify the effect of text conditioning without a separate classifier</text>

  <!-- ===== Geometric Visualization (Left) ===== -->
  <rect x="20" y="65" width="480" height="310" rx="10" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="1.5"/>
  <text x="260" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">Noise Prediction Space (Geometric View)</text>

  <!-- Origin point (latent state) -->
  <circle cx="120" cy="240" r="8" fill="#4a4a5a" stroke="#1a1a2e" stroke-width="2"/>
  <text x="120" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">x_t</text>
  <text x="120" y="283" text-anchor="middle" font-size="11" fill="#7a7a8a">latent state</text>

  <!-- Unconditional prediction (w=0) -->
  <line x1="128" y1="240" x2="230" y2="210" stroke="#d4645c" stroke-width="2.5" marker-end="url(#a)"/>
  <circle cx="232" cy="209" r="5" fill="#d4645c"/>
  <text x="235" y="200" font-size="11" font-weight="bold" fill="#d4645c">ε_uncond</text>
  <text x="235" y="188" font-size="11" fill="#d4645c">(w = 0, null prompt ∅)</text>

  <!-- Conditional prediction (w=1) -->
  <line x1="128" y1="240" x2="310" y2="175" stroke="#3a9e8f" stroke-width="2.5" marker-end="url(#a)"/>
  <circle cx="312" cy="174" r="5" fill="#3a9e8f"/>
  <text x="315" y="165" font-size="11" font-weight="bold" fill="#3a9e8f">ε_cond</text>
  <text x="315" y="153" font-size="11" fill="#3a9e8f">(w = 1, text prompt c)</text>

  <!-- Direction vector -->
  <line x1="232" y1="209" x2="312" y2="174" stroke="#7b68a8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="280" y="205" text-anchor="middle" font-size="11" fill="#7b68a8">ε_cond − ε_uncond</text>

  <!-- Guided prediction (w=7.5) -->
  <line x1="128" y1="240" x2="440" y2="110" stroke="#4a7fb5" stroke-width="3" marker-end="url(#ab)"/>
  <circle cx="442" cy="109" r="6" fill="#4a7fb5" stroke="#fff" stroke-width="2"/>
  <text x="445" y="100" font-size="11" font-weight="bold" fill="#4a7fb5">ε_guided</text>
  <text x="445" y="88" font-size="11" fill="#4a7fb5">(w = 7.5, extrapolated)</text>

  <!-- Scale annotation -->
  <path d="M 315 170 Q 380 135 438 112" fill="none" stroke="#4a7fb5" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="390" y="132" text-anchor="middle" font-size="11" fill="#4a7fb5">scale by (w−1) = 6.5</text>

  <!-- w scale line at bottom -->
  <line x1="120" y1="320" x2="460" y2="320" stroke="#c0c0c8" stroke-width="1.5"/>
  <circle cx="120" cy="320" r="3" fill="#4a4a5a"/>
  <circle cx="232" cy="320" r="3" fill="#d4645c"/>
  <circle cx="312" cy="320" r="3" fill="#3a9e8f"/>
  <circle cx="440" cy="320" r="3" fill="#4a7fb5"/>
  <text x="120" y="340" text-anchor="middle" font-size="11" fill="#4a4a5a">origin</text>
  <text x="232" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">w=0</text>
  <text x="312" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">w=1</text>
  <text x="440" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">w=7.5</text>
  <text x="290" y="358" text-anchor="middle" font-size="11" fill="#7a7a8a">← less aligned with prompt          more aligned with prompt →</text>

  <!-- ===== Equation and Settings (Right) ===== -->
  <rect x="520" y="65" width="320" height="130" rx="10" fill="#edf2f8" stroke="#4a7fb5" stroke-width="2"/>
  <text x="680" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Guidance Equation</text>

  <text x="680" y="118" text-anchor="middle" font-size="11" fill="#1a1a2e" font-family="'JetBrains Mono', 'Fira Code', monospace">ε_guided = ε_uncond</text>
  <text x="680" y="138" text-anchor="middle" font-size="11" fill="#1a1a2e" font-family="'JetBrains Mono', 'Fira Code', monospace">  + w · (ε_cond − ε_uncond)</text>

  <text x="680" y="165" text-anchor="middle" font-size="11" fill="#4a7fb5">Two U-Net forward passes per step:</text>
  <text x="680" y="180" text-anchor="middle" font-size="11" fill="#4a7fb5">one conditional, one unconditional</text>

  <!-- ===== Guidance Scale Effects ===== -->
  <rect x="520" y="210" width="320" height="165" rx="10" fill="#faf5ee" stroke="#d4a03c" stroke-width="2"/>
  <text x="680" y="233" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Guidance Scale w Effects</text>

  <rect x="540" y="248" width="80" height="25" rx="4" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="580" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">w = 0</text>
  <text x="640" y="265" font-size="11" fill="#3a3a4a">Unconditional (ignores prompt)</text>

  <rect x="540" y="280" width="80" height="25" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="580" y="297" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">w = 1</text>
  <text x="640" y="297" font-size="11" fill="#3a3a4a">Pure conditional</text>

  <rect x="540" y="312" width="80" height="25" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="580" y="329" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">w ≈ 7.5</text>
  <text x="640" y="329" font-size="11" fill="#3a3a4a">Standard (matches prompt well)</text>

  <rect x="540" y="344" width="80" height="25" rx="4" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="580" y="361" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b68a8">w > 15</text>
  <text x="640" y="361" font-size="11" fill="#3a3a4a">Over-saturated, artifacts</text>

  <!-- ===== Tradeoff box ===== -->
  <rect x="520" y="390" width="320" height="40" rx="6" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="1.5"/>
  <text x="680" y="408" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Tradeoff: Precision vs. Diversity</text>
  <text x="680" y="422" text-anchor="middle" font-size="11" fill="#7a7a8a">Higher w → better prompt adherence, less sample diversity</text>
</svg>