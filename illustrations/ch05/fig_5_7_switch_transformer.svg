<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Switch Transformer: Simplified MoE Routing</text>
  <text x="430" y="46" text-anchor="middle" font-size="10" fill="#64748b">Fedus et al. (2022) — Top-1 routing for simplified, scalable mixture of experts</text>

  <!-- Main architecture -->
  <rect x="30" y="65" width="500" height="350" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="280" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Switch Transformer Layer</text>

  <!-- Input tokens -->
  <rect x="60" y="355" width="60" height="30" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="90" y="374" text-anchor="middle" font-size="7" font-weight="bold" fill="#475569">tok₁</text>
  <rect x="130" y="355" width="60" height="30" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="160" y="374" text-anchor="middle" font-size="7" font-weight="bold" fill="#475569">tok₂</text>
  <rect x="200" y="355" width="60" height="30" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="230" y="374" text-anchor="middle" font-size="7" font-weight="bold" fill="#475569">tok₃</text>
  <rect x="270" y="355" width="60" height="30" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="300" y="374" text-anchor="middle" font-size="7" font-weight="bold" fill="#475569">tok₄</text>
  <rect x="340" y="355" width="60" height="30" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="370" y="374" text-anchor="middle" font-size="7" font-weight="bold" fill="#475569">tok₅</text>
  <rect x="410" y="355" width="60" height="30" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="440" y="374" text-anchor="middle" font-size="7" font-weight="bold" fill="#475569">tok₆</text>

  <text x="280" y="405" text-anchor="middle" font-size="8" fill="#64748b">Hidden states from self-attention</text>

  <!-- Router -->
  <rect x="150" y="290" width="240" height="40" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="270" y="310" text-anchor="middle" font-size="9" font-weight="bold" fill="#831843">Router: softmax(h · W_r)</text>
  <text x="270" y="324" text-anchor="middle" font-size="7" fill="#db2777">Top-1 selection per token</text>

  <!-- Arrows from tokens to router -->
  <line x1="90" y1="355" x2="200" y2="330" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>
  <line x1="160" y1="355" x2="220" y2="330" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>
  <line x1="230" y1="355" x2="250" y2="330" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>
  <line x1="300" y1="355" x2="290" y2="330" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>
  <line x1="370" y1="355" x2="320" y2="330" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>
  <line x1="440" y1="355" x2="340" y2="330" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>

  <!-- Expert FFNs -->
  <rect x="55" y="175" width="90" height="70" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="100" y="198" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">Expert 1</text>
  <text x="100" y="212" text-anchor="middle" font-size="7" fill="#334155">FFN</text>
  <text x="100" y="235" text-anchor="middle" font-size="6" fill="#d97706">tok₁, tok₃</text>

  <rect x="165" y="175" width="90" height="70" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="210" y="198" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">Expert 2</text>
  <text x="210" y="212" text-anchor="middle" font-size="7" fill="#334155">FFN</text>
  <text x="210" y="235" text-anchor="middle" font-size="6" fill="#d97706">tok₅</text>

  <rect x="275" y="175" width="90" height="70" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="320" y="198" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">Expert 3</text>
  <text x="320" y="212" text-anchor="middle" font-size="7" fill="#334155">FFN</text>
  <text x="320" y="235" text-anchor="middle" font-size="6" fill="#d97706">tok₂, tok₄</text>

  <rect x="385" y="175" width="90" height="70" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="430" y="198" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">Expert 4</text>
  <text x="430" y="212" text-anchor="middle" font-size="7" fill="#334155">FFN</text>
  <text x="430" y="235" text-anchor="middle" font-size="6" fill="#d97706">tok₆</text>

  <!-- Routing arrows (color-coded) -->
  <line x1="200" y1="290" x2="100" y2="245" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="250" y1="290" x2="100" y2="245" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#a)"/>
  <line x1="320" y1="290" x2="210" y2="245" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="230" y1="290" x2="320" y2="245" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="290" y1="290" x2="320" y2="245" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#a)"/>
  <line x1="340" y1="290" x2="430" y2="245" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Output merge -->
  <rect x="150" y="115" width="240" height="35" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="270" y="137" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532d">Multiply by router probability, reorder</text>

  <line x1="100" y1="175" x2="200" y2="150" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="210" y1="175" x2="240" y2="150" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="320" y1="175" x2="300" y2="150" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="430" y1="175" x2="340" y2="150" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Right side: Key innovations -->
  <rect x="555" y="65" width="280" height="120" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="695" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#831843">Top-1 vs Top-2 Routing</text>
  <text x="575" y="112" font-size="8" fill="#334155">Standard MoE: top-2 experts per token</text>
  <text x="575" y="128" font-size="8" fill="#334155">Switch: top-1 expert per token</text>
  <text x="575" y="148" font-size="8" fill="#db2777" font-weight="bold">Benefit: halves computation + comm cost</text>
  <text x="575" y="168" font-size="8" fill="#334155">Router weight p(e) scales expert output</text>

  <!-- Load balancing -->
  <rect x="555" y="200" width="280" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="695" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">Load Balancing Loss</text>
  <text x="575" y="248" font-size="8" fill="#334155" font-family="'SF Mono', Consolas, monospace">L_aux = N * sum(f_i * P_i)</text>
  <text x="575" y="268" font-size="7" fill="#334155">f_i = fraction of tokens to expert i</text>
  <text x="575" y="283" font-size="7" fill="#334155">P_i = mean router probability for expert i</text>
  <text x="575" y="300" font-size="7" fill="#d97706">Encourages uniform expert utilization</text>

  <!-- Scale -->
  <rect x="555" y="325" width="280" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="695" y="348" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">Scale Results</text>
  <text x="575" y="370" font-size="8" fill="#334155">1.6T parameter Switch-C model</text>
  <text x="575" y="388" font-size="8" fill="#334155">128 experts across 2048 TPU cores</text>
  <text x="575" y="406" font-size="8" fill="#16a34a" font-weight="bold">4x speedup over T5-XXL at same FLOPS</text>
</svg>