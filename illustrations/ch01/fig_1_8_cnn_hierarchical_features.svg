<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">CNN Hierarchical Feature Detection</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Each layer detects progressively more complex patterns (Zeiler &amp; Fergus, 2014)</text>

  <!-- Layer 1: Edges -->
  <rect x="30" y="70" width="160" height="190" rx="8" fill="#edf2f8" stroke="#4a7fb5" stroke-width="2"/>
  <text x="110" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Layer 1</text>
  <text x="110" y="108" text-anchor="middle" font-size="11" fill="#4a7fb5">Edges &amp; Gradients</text>

  <!-- Edge patterns -->
  <rect x="45" y="120" width="40" height="40" rx="2" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1"/>
  <line x1="50" y1="155" x2="80" y2="125" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="95" y="120" width="40" height="40" rx="2" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1"/>
  <line x1="115" y1="125" x2="115" y2="155" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="145" y="120" width="40" height="40" rx="2" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1"/>
  <line x1="150" y1="140" x2="180" y2="140" stroke="#1a1a2e" stroke-width="2"/>

  <rect x="45" y="170" width="40" height="40" rx="2" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1"/>
  <line x1="50" y1="175" x2="80" y2="205" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="95" y="170" width="40" height="40" rx="2" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1"/>
  <circle cx="115" cy="190" r="12" fill="none" stroke="#1a1a2e" stroke-width="1.5"/>
  <rect x="145" y="170" width="40" height="40" rx="2" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1"/>
  <path d="M 155 180 Q 165 200 175 180" fill="none" stroke="#1a1a2e" stroke-width="1.5"/>

  <text x="110" y="232" text-anchor="middle" font-size="11" fill="#7a7a8a" font-family="'JetBrains Mono', 'Fira Code', monospace">3×3 kernels</text>
  <text x="110" y="248" text-anchor="middle" font-size="11" fill="#7a7a8a">Low-level, local</text>

  <!-- Arrow -->
  <line x1="190" y1="165" x2="220" y2="165" stroke="#4a4a5a" stroke-width="2" marker-end="url(#a)"/>

  <!-- Layer 2-3: Textures -->
  <rect x="225" y="70" width="160" height="190" rx="8" fill="#faf5ee" stroke="#d4a03c" stroke-width="2"/>
  <text x="305" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Layers 2–3</text>
  <text x="305" y="108" text-anchor="middle" font-size="11" fill="#d4a03c">Textures &amp; Motifs</text>

  <!-- Texture patterns -->
  <rect x="240" y="120" width="55" height="50" rx="2" fill="#f5ece0" stroke="#d4a03c" stroke-width="1"/>
  <g stroke="#d4a03c" stroke-width="0.8" opacity="0.6">
    <line x1="245" y1="125" x2="255" y2="135"/><line x1="255" y1="125" x2="265" y2="135"/>
    <line x1="265" y1="125" x2="275" y2="135"/><line x1="275" y1="125" x2="285" y2="135"/>
    <line x1="245" y1="135" x2="255" y2="145"/><line x1="255" y1="135" x2="265" y2="145"/>
    <line x1="265" y1="135" x2="275" y2="145"/><line x1="275" y1="135" x2="285" y2="145"/>
    <line x1="245" y1="145" x2="255" y2="155"/><line x1="255" y1="145" x2="265" y2="155"/>
    <line x1="265" y1="145" x2="275" y2="155"/><line x1="275" y1="145" x2="285" y2="155"/>
  </g>
  <text x="267" y="180" text-anchor="middle" font-size="11" fill="#d4a03c">stripes</text>

  <rect x="305" y="120" width="55" height="50" rx="2" fill="#f5ece0" stroke="#d4a03c" stroke-width="1"/>
  <g fill="#d4a03c" opacity="0.5">
    <circle cx="315" cy="135" r="3"/><circle cx="325" cy="135" r="3"/><circle cx="335" cy="135" r="3"/><circle cx="345" cy="135" r="3"/>
    <circle cx="320" cy="145" r="3"/><circle cx="330" cy="145" r="3"/><circle cx="340" cy="145" r="3"/>
    <circle cx="315" cy="155" r="3"/><circle cx="325" cy="155" r="3"/><circle cx="335" cy="155" r="3"/><circle cx="345" cy="155" r="3"/>
  </g>
  <text x="332" y="180" text-anchor="middle" font-size="11" fill="#d4a03c">dots</text>

  <rect x="240" y="190" width="120" height="40" rx="2" fill="#f5ece0" stroke="#d4a03c" stroke-width="1"/>
  <text x="300" y="215" text-anchor="middle" font-size="11" fill="#d4a03c">corners, grids, color blobs</text>

  <text x="305" y="248" text-anchor="middle" font-size="11" fill="#7a7a8a">Combinations of edges</text>

  <!-- Arrow -->
  <line x1="385" y1="165" x2="415" y2="165" stroke="#4a4a5a" stroke-width="2" marker-end="url(#a)"/>

  <!-- Layer 4-5: Parts -->
  <rect x="420" y="70" width="160" height="190" rx="8" fill="#f0edf5" stroke="#7b68a8" stroke-width="2"/>
  <text x="500" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b68a8">Layers 4–5</text>
  <text x="500" y="108" text-anchor="middle" font-size="11" fill="#7b68a8">Object Parts</text>

  <!-- Part patterns (simplified) -->
  <rect x="435" y="120" width="55" height="50" rx="2" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1"/>
  <circle cx="462" cy="140" r="10" fill="none" stroke="#7b68a8" stroke-width="1.5"/>
  <circle cx="458" cy="137" r="3" fill="#7b68a8"/>
  <text x="462" y="180" text-anchor="middle" font-size="11" fill="#7b68a8">eyes</text>

  <rect x="500" y="120" width="55" height="50" rx="2" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1"/>
  <path d="M 515 150 Q 527 130 540 150" fill="none" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="527" y="180" text-anchor="middle" font-size="11" fill="#7b68a8">wheels</text>

  <rect x="435" y="190" width="120" height="40" rx="2" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1"/>
  <text x="495" y="215" text-anchor="middle" font-size="11" fill="#7b68a8">faces, legs, windows</text>

  <text x="500" y="248" text-anchor="middle" font-size="11" fill="#7a7a8a">Semantic composites</text>

  <!-- Arrow -->
  <line x1="580" y1="165" x2="610" y2="165" stroke="#4a4a5a" stroke-width="2" marker-end="url(#a)"/>

  <!-- Final: Objects -->
  <rect x="615" y="70" width="160" height="190" rx="8" fill="#edf7f5" stroke="#3a9e8f" stroke-width="2"/>
  <text x="695" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Output</text>
  <text x="695" y="108" text-anchor="middle" font-size="11" fill="#3a9e8f">Full Objects</text>

  <rect x="630" y="120" width="130" height="110" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1"/>
  <text x="695" y="160" text-anchor="middle" font-size="11" fill="#3a9e8f">Cat: 0.95</text>
  <text x="695" y="180" text-anchor="middle" font-size="11" fill="#3a9e8f">Dog: 0.03</text>
  <text x="695" y="200" text-anchor="middle" font-size="11" fill="#3a9e8f">Car: 0.01</text>
  <text x="695" y="220" text-anchor="middle" font-size="11" fill="#7a7a8a">...</text>

  <text x="695" y="248" text-anchor="middle" font-size="11" fill="#7a7a8a">Classification</text>

  <!-- Bottom annotation -->
  <rect x="100" y="275" width="660" height="35" rx="6" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="1"/>
  <text x="430" y="298" text-anchor="middle" font-size="11" fill="#1a1a2e">Receptive field grows with depth: edges → textures → parts → objects. Each layer composes features from the layer below.</text>
</svg>