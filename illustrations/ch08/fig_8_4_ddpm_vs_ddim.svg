<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">DDPM vs DDIM: Stochastic vs Deterministic Sampling</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Song et al. (2020) — Same trained model, different sampling: DDIM enables fewer steps</text>

  <!-- DDPM (top) -->
  <rect x="30" y="65" width="800" height="150" rx="10" fill="#edf2f8" stroke="#4a7fb5" stroke-width="2"/>
  <text x="430" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">DDPM: Stochastic Sampling (T=1000 steps)</text>

  <!-- Steps visualization -->
  <rect x="55" y="105" width="35" height="30" rx="3" fill="#c0c0c8" stroke="#4a4a5a" stroke-width="1"/>
  <text x="72" y="124" text-anchor="middle" font-size="11" fill="#fff">x_T</text>

  <line x1="90" y1="120" x2="108" y2="120" stroke="#4a7fb5" stroke-width="1" marker-end="url(#a)"/>
  <rect x="110" y="105" width="35" height="30" rx="3" fill="#c0c0c8" stroke="#4a4a5a" stroke-width="1" opacity="0.9"/>
  <text x="127" y="124" text-anchor="middle" font-size="11" fill="#fff">x_999</text>

  <line x1="145" y1="120" x2="158" y2="120" stroke="#4a7fb5" stroke-width="1" marker-end="url(#a)"/>
  <rect x="160" y="105" width="35" height="30" rx="3" fill="#c0c0c8" stroke="#4a4a5a" stroke-width="1" opacity="0.8"/>
  <text x="177" y="124" text-anchor="middle" font-size="11" fill="#fff">x_998</text>

  <text x="215" y="124" font-size="11" fill="#4a7fb5">· · ·</text>
  <text x="265" y="124" font-size="11" fill="#4a7fb5">1000 steps</text>
  <text x="305" y="124" font-size="11" fill="#4a7fb5">· · ·</text>

  <rect x="340" y="105" width="35" height="30" rx="3" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1"/>
  <text x="357" y="124" text-anchor="middle" font-size="11" fill="#4a7fb5">x_2</text>

  <line x1="375" y1="120" x2="393" y2="120" stroke="#4a7fb5" stroke-width="1" marker-end="url(#a)"/>
  <rect x="395" y="105" width="35" height="30" rx="3" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1"/>
  <text x="412" y="124" text-anchor="middle" font-size="11" fill="#4a7fb5">x_1</text>

  <line x1="430" y1="120" x2="448" y2="120" stroke="#4a7fb5" stroke-width="1" marker-end="url(#a)"/>
  <rect x="450" y="105" width="35" height="30" rx="3" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="467" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">x_0</text>

  <!-- DDPM equation -->
  <rect x="510" y="100" width="300" height="40" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="660" y="118" text-anchor="middle" font-size="11" fill="#4a7fb5" font-family="'JetBrains Mono', 'Fira Code', monospace">x_{t-1} = μ_θ(x_t, t) + σ_t · z</text>
  <text x="660" y="133" text-anchor="middle" font-size="11" fill="#4a7fb5">z ~ N(0,I) — random noise each step</text>

  <!-- Properties -->
  <text x="55" y="160" font-size="11" fill="#3a3a4a">• <tspan font-weight="bold">Stochastic</tspan>: different z each step → different outputs from same x_T</text>
  <text x="55" y="177" font-size="11" fill="#3a3a4a">• <tspan font-weight="bold">Slow</tspan>: must traverse all T=1000 steps sequentially</text>
  <text x="55" y="194" font-size="11" fill="#d4645c">• ~20 seconds per image on GPU</text>

  <!-- DDIM (bottom) -->
  <rect x="30" y="230" width="800" height="150" rx="10" fill="#edf7f5" stroke="#3a9e8f" stroke-width="2"/>
  <text x="430" y="253" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">DDIM: Deterministic Sampling (S=50 steps, or even 10!)</text>

  <!-- Steps visualization - fewer, bigger jumps -->
  <rect x="55" y="270" width="45" height="30" rx="3" fill="#c0c0c8" stroke="#4a4a5a" stroke-width="1"/>
  <text x="77" y="289" text-anchor="middle" font-size="11" fill="#fff">x_T</text>

  <line x1="100" y1="285" x2="133" y2="285" stroke="#3a9e8f" stroke-width="2" marker-end="url(#a)"/>
  <text x="116" y="278" font-size="11" fill="#3a9e8f">skip!</text>

  <rect x="135" y="270" width="45" height="30" rx="3" fill="#c0c0c8" stroke="#4a4a5a" stroke-width="1" opacity="0.8"/>
  <text x="157" y="289" text-anchor="middle" font-size="11" fill="#fff">x_800</text>

  <line x1="180" y1="285" x2="213" y2="285" stroke="#3a9e8f" stroke-width="2" marker-end="url(#a)"/>

  <rect x="215" y="270" width="45" height="30" rx="3" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1" opacity="0.7"/>
  <text x="237" y="289" text-anchor="middle" font-size="11" fill="#4a7fb5">x_600</text>

  <line x1="260" y1="285" x2="293" y2="285" stroke="#3a9e8f" stroke-width="2" marker-end="url(#a)"/>

  <rect x="295" y="270" width="45" height="30" rx="3" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1"/>
  <text x="317" y="289" text-anchor="middle" font-size="11" fill="#4a7fb5">x_400</text>

  <line x1="340" y1="285" x2="373" y2="285" stroke="#3a9e8f" stroke-width="2" marker-end="url(#a)"/>

  <rect x="375" y="270" width="45" height="30" rx="3" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1"/>
  <text x="397" y="289" text-anchor="middle" font-size="11" fill="#3a9e8f">x_200</text>

  <line x1="420" y1="285" x2="453" y2="285" stroke="#3a9e8f" stroke-width="2" marker-end="url(#a)"/>

  <rect x="455" y="270" width="45" height="30" rx="3" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="477" y="289" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">x_0</text>

  <!-- DDIM equation -->
  <rect x="510" y="268" width="300" height="40" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="660" y="284" text-anchor="middle" font-size="11" fill="#3a9e8f" font-family="'JetBrains Mono', 'Fira Code', monospace">x_{t-1} = √ᾱ_{t-1}·x̂_0 + √(1-ᾱ_{t-1})·ε_θ</text>
  <text x="660" y="301" text-anchor="middle" font-size="11" fill="#3a9e8f">No random noise — deterministic!</text>

  <text x="477" y="260" text-anchor="middle" font-size="11" fill="#3a9e8f" font-weight="bold">50 steps only!</text>

  <!-- Properties -->
  <text x="55" y="325" font-size="11" fill="#3a3a4a">• <tspan font-weight="bold">Deterministic</tspan>: same x_T → same x_0 always (with η=0)</text>
  <text x="55" y="342" font-size="11" fill="#3a3a4a">• <tspan font-weight="bold">Fast</tspan>: skip timesteps — use any subsequence (T→800→600→...→0)</text>
  <text x="55" y="359" font-size="11" fill="#3a9e8f">• 10-50 steps with minimal quality loss → 20-100× speedup</text>

  <!-- Comparison table -->
  <rect x="100" y="380" width="660" height="50" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="200" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a4a5a">Feature</text>
  <text x="370" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">DDPM</text>
  <text x="560" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">DDIM</text>

  <text x="200" y="420" text-anchor="middle" font-size="11" fill="#3a3a4a">Steps / Stochastic / Interpolation</text>
  <text x="370" y="420" text-anchor="middle" font-size="11" fill="#4a7fb5">1000 / Yes / No</text>
  <text x="560" y="420" text-anchor="middle" font-size="11" fill="#3a9e8f">10-50 / No (η=0) / Yes (in x_T space)</text>
</svg>