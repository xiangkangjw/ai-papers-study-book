<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="460" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">RLHF: Three-Stage Pipeline</text>

  <!-- ===== Stage 1: SFT ===== -->
  <rect x="20" y="55" width="265" height="310" rx="10" fill="#edf2f8" stroke="#4a7fb5" stroke-width="2"/>
  <text x="152" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7fb5">Stage 1: Supervised Fine-Tuning</text>

  <rect x="40" y="95" width="225" height="40" rx="6" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="152" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Demonstration Data</text>
  <text x="152" y="128" text-anchor="middle" font-size="11" fill="#4a7fb5">(prompt, expert_response) pairs</text>

  <line x1="152" y1="135" x2="152" y2="155" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="60" y="160" width="185" height="45" rx="8" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="152" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Fine-tune Base LLM</text>
  <text x="152" y="198" text-anchor="middle" font-size="11" fill="#4a7fb5">Standard cross-entropy loss</text>

  <line x1="152" y1="205" x2="152" y2="225" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="70" y="230" width="165" height="45" rx="8" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="152" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">π_SFT</text>
  <text x="152" y="268" text-anchor="middle" font-size="11" fill="#3a9e8f">SFT model</text>

  <text x="152" y="310" text-anchor="middle" font-size="11" fill="#7a7a8a">Human demonstrates</text>
  <text x="152" y="324" text-anchor="middle" font-size="11" fill="#7a7a8a">"good" responses</text>

  <!-- ===== Stage 2: Reward Model ===== -->
  <rect x="320" y="55" width="265" height="310" rx="10" fill="#faf5ee" stroke="#d4a03c" stroke-width="2"/>
  <text x="452" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#d4a03c">Stage 2: Reward Model Training</text>

  <rect x="340" y="95" width="225" height="50" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="452" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Comparison Data</text>
  <text x="452" y="128" text-anchor="middle" font-size="11" fill="#d4a03c">Human ranks: response A &gt; B</text>
  <text x="452" y="140" text-anchor="middle" font-size="11" fill="#d4a03c">(same prompt, different outputs)</text>

  <line x1="452" y1="145" x2="452" y2="165" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="360" y="170" width="185" height="45" rx="8" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="452" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Train Reward Model</text>
  <text x="452" y="205" text-anchor="middle" font-size="11" fill="#d4a03c">Bradley-Terry pairwise loss</text>

  <line x1="452" y1="215" x2="452" y2="235" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="370" y="240" width="165" height="45" rx="8" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="452" y="260" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">R(x, y)</text>
  <text x="452" y="278" text-anchor="middle" font-size="11" fill="#3a9e8f">Reward model</text>

  <text x="452" y="310" text-anchor="middle" font-size="11" fill="#7a7a8a">Human preferences</text>
  <text x="452" y="324" text-anchor="middle" font-size="11" fill="#7a7a8a">teach what "good" means</text>

  <!-- ===== Stage 3: PPO ===== -->
  <rect x="620" y="55" width="280" height="310" rx="10" fill="#edf7f5" stroke="#3a9e8f" stroke-width="2"/>
  <text x="760" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a9e8f">Stage 3: PPO Optimization</text>

  <rect x="640" y="95" width="240" height="35" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="760" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Generate: π_θ(prompt) → response y</text>

  <line x1="760" y1="130" x2="760" y2="148" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="640" y="152" width="240" height="35" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="760" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Score: R(prompt, y) → reward</text>

  <line x1="760" y1="187" x2="760" y2="205" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="640" y="210" width="240" height="45" rx="8" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="760" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">PPO Update π_θ</text>
  <text x="760" y="248" text-anchor="middle" font-size="11" fill="#3a9e8f" font-family="'JetBrains Mono', 'Fira Code', monospace">max E[R(x,y)] − β·KL(π_θ‖π_SFT)</text>

  <!-- KL constraint arrow back to SFT -->
  <path d="M 700 255 C 700 290, 400 380, 200 280" fill="none" stroke="#d4645c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="450" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">KL penalty: don't drift too far from π_SFT</text>

  <text x="760" y="310" text-anchor="middle" font-size="11" fill="#7a7a8a">RL optimizes against</text>
  <text x="760" y="324" text-anchor="middle" font-size="11" fill="#7a7a8a">learned reward signal</text>

  <!-- Stage connection arrows -->
  <line x1="285" y1="252" x2="318" y2="252" stroke="#4a4a5a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="585" y1="262" x2="618" y2="262" stroke="#4a4a5a" stroke-width="2" marker-end="url(#a)"/>

  <!-- Bottom summary -->
  <rect x="100" y="380" width="720" height="30" rx="6" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="1"/>
  <text x="460" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">SFT teaches format → RM captures preferences → PPO optimizes for preferences while staying close to SFT</text>
</svg>