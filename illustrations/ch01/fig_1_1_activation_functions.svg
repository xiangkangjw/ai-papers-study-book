<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ax" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c0c0c8"/></marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Activation Function Gallery</text>

  <!-- ===== Row 1 ===== -->

  <!-- Sigmoid -->
  <g transform="translate(10, 45)">
    <rect x="0" y="0" width="280" height="210" rx="8" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1.5"/>
    <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">Sigmoid</text>
    <text x="140" y="38" text-anchor="middle" font-size="11" fill="#7a7a8a" font-family="'JetBrains Mono', 'Fira Code', monospace">σ(x) = 1 / (1 + e⁻ˣ)</text>
    <!-- Axes -->
    <line x1="30" y1="135" x2="260" y2="135" stroke="#c0c0c8" stroke-width="1" marker-end="url(#ax)"/>
    <line x1="140" y1="195" x2="140" y2="50" stroke="#c0c0c8" stroke-width="1" marker-end="url(#ax)"/>
    <text x="265" y="140" font-size="11" fill="#c0c0c8">x</text>
    <!-- y=0 and y=1 lines -->
    <line x1="35" y1="185" x2="255" y2="185" stroke="#f5f5f8" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="35" y1="75" x2="255" y2="75" stroke="#f5f5f8" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="25" y="79" font-size="11" fill="#c0c0c8">1</text>
    <text x="25" y="189" font-size="11" fill="#c0c0c8">0</text>
    <!-- Sigmoid curve -->
    <path d="M 35,183 C 60,182 80,180 95,175 C 110,165 125,150 140,135 C 155,115 170,95 185,85 C 200,78 230,76 255,75" fill="none" stroke="#4a4a5a" stroke-width="2.5"/>
    <text x="140" y="205" text-anchor="middle" font-size="11" fill="#7a7a8a">Range: (0, 1) — saturates at tails</text>
  </g>

  <!-- Tanh -->
  <g transform="translate(305, 45)">
    <rect x="0" y="0" width="280" height="210" rx="8" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1.5"/>
    <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">Tanh</text>
    <text x="140" y="38" text-anchor="middle" font-size="11" fill="#7a7a8a" font-family="'JetBrains Mono', 'Fira Code', monospace">tanh(x) = (eˣ − e⁻ˣ) / (eˣ + e⁻ˣ)</text>
    <line x1="30" y1="130" x2="260" y2="130" stroke="#c0c0c8" stroke-width="1" marker-end="url(#ax)"/>
    <line x1="140" y1="195" x2="140" y2="50" stroke="#c0c0c8" stroke-width="1" marker-end="url(#ax)"/>
    <line x1="35" y1="70" x2="255" y2="70" stroke="#f5f5f8" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="35" y1="190" x2="255" y2="190" stroke="#f5f5f8" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="25" y="74" font-size="11" fill="#c0c0c8">1</text>
    <text x="22" y="194" font-size="11" fill="#c0c0c8">-1</text>
    <!-- Tanh curve -->
    <path d="M 35,188 C 55,187 75,185 90,178 C 105,165 120,150 140,130 C 160,105 175,85 190,78 C 210,72 240,70 255,70" fill="none" stroke="#4a4a5a" stroke-width="2.5"/>
    <text x="140" y="205" text-anchor="middle" font-size="11" fill="#7a7a8a">Range: (-1, 1) — zero-centered</text>
  </g>

  <!-- ReLU -->
  <g transform="translate(600, 45)">
    <rect x="0" y="0" width="280" height="210" rx="8" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1.5"/>
    <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">ReLU</text>
    <text x="140" y="38" text-anchor="middle" font-size="11" fill="#7a7a8a" font-family="'JetBrains Mono', 'Fira Code', monospace">f(x) = max(0, x)</text>
    <line x1="30" y1="150" x2="260" y2="150" stroke="#c0c0c8" stroke-width="1" marker-end="url(#ax)"/>
    <line x1="140" y1="195" x2="140" y2="50" stroke="#c0c0c8" stroke-width="1" marker-end="url(#ax)"/>
    <!-- Dying ReLU region -->
    <rect x="30" y="50" width="110" height="100" rx="0" fill="#f6e4e3" opacity="0.3"/>
    <text x="85" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Dying ReLU</text>
    <text x="85" y="78" text-anchor="middle" font-size="11" fill="#d4645c">region (∇ = 0)</text>
    <!-- ReLU curve -->
    <line x1="35" y1="150" x2="140" y2="150" stroke="#4a4a5a" stroke-width="2.5"/>
    <line x1="140" y1="150" x2="240" y2="60" stroke="#4a4a5a" stroke-width="2.5"/>
    <text x="140" y="205" text-anchor="middle" font-size="11" fill="#7a7a8a">Range: [0, ∞) — dead neurons for x &lt; 0</text>
  </g>

  <!-- ===== Row 2 ===== -->

  <!-- Leaky ReLU -->
  <g transform="translate(10, 280)">
    <rect x="0" y="0" width="280" height="210" rx="8" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1.5"/>
    <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">Leaky ReLU</text>
    <text x="140" y="38" text-anchor="middle" font-size="11" fill="#7a7a8a" font-family="'JetBrains Mono', 'Fira Code', monospace">f(x) = max(αx, x), α = 0.01</text>
    <line x1="30" y1="150" x2="260" y2="150" stroke="#c0c0c8" stroke-width="1" marker-end="url(#ax)"/>
    <line x1="140" y1="195" x2="140" y2="50" stroke="#c0c0c8" stroke-width="1" marker-end="url(#ax)"/>
    <!-- Leaky ReLU curve -->
    <line x1="35" y1="152" x2="140" y2="150" stroke="#4a4a5a" stroke-width="2.5"/>
    <line x1="140" y1="150" x2="240" y2="60" stroke="#4a4a5a" stroke-width="2.5"/>
    <text x="75" y="170" font-size="11" fill="#3a9e8f">slope = α (small but nonzero)</text>
    <text x="140" y="205" text-anchor="middle" font-size="11" fill="#7a7a8a">Range: (-∞, ∞) — fixes dead neurons</text>
  </g>

  <!-- GELU (modern default, highlighted) -->
  <g transform="translate(305, 280)">
    <rect x="0" y="0" width="280" height="210" rx="8" fill="#edf2f8" stroke="#4a7fb5" stroke-width="2.5"/>
    <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7fb5">GELU ★</text>
    <text x="140" y="38" text-anchor="middle" font-size="11" fill="#4a7fb5" font-family="'JetBrains Mono', 'Fira Code', monospace">f(x) = x · Φ(x)</text>
    <text x="140" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">★ Modern Default</text>
    <line x1="30" y1="150" x2="260" y2="150" stroke="#c0c0c8" stroke-width="1" marker-end="url(#ax)"/>
    <line x1="140" y1="195" x2="140" y2="60" stroke="#c0c0c8" stroke-width="1" marker-end="url(#ax)"/>
    <!-- GELU curve: smooth, slight negative dip -->
    <path d="M 35,150 C 50,150 70,151 85,152 C 100,152 115,152 125,151 C 132,150 137,149 140,148 C 155,138 170,120 190,100 C 210,80 230,65 250,58" fill="none" stroke="#4a7fb5" stroke-width="2.5"/>
    <text x="140" y="205" text-anchor="middle" font-size="11" fill="#4a7fb5">Default in Transformers (BERT, GPT)</text>
  </g>

  <!-- Swish (modern default, highlighted) -->
  <g transform="translate(600, 280)">
    <rect x="0" y="0" width="280" height="210" rx="8" fill="#edf2f8" stroke="#4a7fb5" stroke-width="2.5"/>
    <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7fb5">Swish (SiLU) ★</text>
    <text x="140" y="38" text-anchor="middle" font-size="11" fill="#4a7fb5" font-family="'JetBrains Mono', 'Fira Code', monospace">f(x) = x · σ(x)</text>
    <text x="140" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">★ Modern Default</text>
    <line x1="30" y1="150" x2="260" y2="150" stroke="#c0c0c8" stroke-width="1" marker-end="url(#ax)"/>
    <line x1="140" y1="195" x2="140" y2="50" stroke="#c0c0c8" stroke-width="1" marker-end="url(#ax)"/>
    <!-- Swish curve: similar to GELU with slight negative bump -->
    <path d="M 35,150 C 50,150 65,151 80,153 C 95,154 105,154 115,153 C 125,152 132,151 140,148 C 150,142 165,125 185,105 C 205,82 225,68 250,58" fill="none" stroke="#4a7fb5" stroke-width="2.5"/>
    <text x="140" y="205" text-anchor="middle" font-size="11" fill="#4a7fb5">Default in Vision &amp; Diffusion models</text>
  </g>

  <!-- Legend -->
  <text x="450" y="530" text-anchor="middle" font-size="11" fill="#7a7a8a">★ Blue border = recommended modern defaults  |  Red shading = problematic regions (gradient = 0)</text>
</svg>