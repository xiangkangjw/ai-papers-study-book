<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/></marker>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">The Reparameterization Trick</text>

  <!-- ===== (a) Naive: Gradient Blocked ===== -->
  <rect x="15" y="50" width="400" height="350" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="215" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">(a) Naive Sampling — Gradient Blocked</text>

  <!-- Encoder -->
  <rect x="35" y="110" width="80" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="75" y="135" text-anchor="middle" font-size="10" font-weight="bold" fill="#0c4a6e">Encoder</text>

  <!-- μ, σ outputs -->
  <rect x="150" y="95" width="50" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="175" y="115" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">μ</text>
  <rect x="150" y="135" width="50" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="175" y="155" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">σ</text>

  <line x1="115" y1="125" x2="148" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="115" y1="135" x2="148" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Sample node (STOCHASTIC - blocks gradient) -->
  <circle cx="270" cy="130" r="28" fill="#fee2e2" stroke="#ef4444" stroke-width="2.5"/>
  <text x="270" y="125" text-anchor="middle" font-size="9" font-weight="bold" fill="#7f1d1d">SAMPLE</text>
  <text x="270" y="140" text-anchor="middle" font-size="7" fill="#991b1b">z ~ N(μ,σ²)</text>

  <line x1="200" y1="110" x2="244" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="200" y1="150" x2="244" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Big red X -->
  <text x="270" y="185" text-anchor="middle" font-size="28" font-weight="bold" fill="#ef4444">✗</text>

  <!-- Decoder -->
  <rect x="330" y="110" width="70" height="40" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="365" y="135" text-anchor="middle" font-size="10" font-weight="bold" fill="#831843">Decoder</text>
  <line x1="298" y1="130" x2="328" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Gradient arrows that STOP -->
  <line x1="365" y1="160" x2="365" y2="200" stroke="#ef4444" stroke-width="2"/>
  <line x1="365" y1="200" x2="305" y2="200" stroke="#ef4444" stroke-width="2"/>
  <text x="340" y="215" text-anchor="middle" font-size="8" fill="#ef4444">∇ flows here...</text>

  <line x1="295" y1="200" x2="255" y2="200" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,3"/>
  <text x="258" y="240" text-anchor="middle" font-size="9" font-weight="bold" fill="#ef4444">∇ BLOCKED!</text>
  <text x="258" y="255" text-anchor="middle" font-size="8" fill="#991b1b">Cannot differentiate</text>
  <text x="258" y="268" text-anchor="middle" font-size="8" fill="#991b1b">through random sampling</text>

  <rect x="40" y="300" width="360" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="220" y="318" text-anchor="middle" font-size="9" font-weight="bold" fill="#7f1d1d">Problem: ∂z/∂μ and ∂z/∂σ are undefined</text>
  <text x="220" y="336" text-anchor="middle" font-size="8" fill="#991b1b">Sampling is a stochastic operation — no gradient path</text>

  <!-- ===== (b) Reparameterized: Gradient Flows ===== -->
  <rect x="445" y="50" width="400" height="350" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="645" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">(b) Reparameterized — Gradient Flows</text>

  <!-- Encoder -->
  <rect x="465" y="110" width="80" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="505" y="135" text-anchor="middle" font-size="10" font-weight="bold" fill="#0c4a6e">Encoder</text>

  <!-- μ, σ outputs -->
  <rect x="580" y="95" width="50" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="605" y="115" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">μ</text>
  <rect x="580" y="135" width="50" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="605" y="155" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">σ</text>

  <line x1="545" y1="125" x2="578" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="545" y1="135" x2="578" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ε ~ N(0,1) (external randomness) -->
  <rect x="660" y="190" width="80" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="700" y="206" text-anchor="middle" font-size="9" font-weight="bold" fill="#64748b">ε ~ N(0,1)</text>
  <text x="700" y="220" text-anchor="middle" font-size="7" fill="#94a3b8">no gradient needed</text>

  <!-- Deterministic computation node -->
  <circle cx="700" cy="130" r="28" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="700" y="122" text-anchor="middle" font-size="8" font-weight="bold" fill="#14532d">z = μ + σ⊙ε</text>
  <text x="700" y="138" text-anchor="middle" font-size="7" fill="#16a34a">deterministic!</text>

  <line x1="630" y1="110" x2="674" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="630" y1="150" x2="674" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="700" y1="190" x2="700" y2="160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Decoder -->
  <rect x="760" y="110" width="70" height="40" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="795" y="135" text-anchor="middle" font-size="10" font-weight="bold" fill="#831843">Decoder</text>
  <line x1="728" y1="130" x2="758" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Gradient flows (green arrows going backward) -->
  <line x1="760" y1="155" x2="760" y2="260" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="760" y1="260" x2="730" y2="260" stroke="#16a34a" stroke-width="2"/>
  <line x1="700" y1="260" x2="700" y2="160" stroke="#16a34a" stroke-width="2"/>
  <line x1="700" y1="260" x2="620" y2="260" stroke="#16a34a" stroke-width="2"/>
  <line x1="605" y1="260" x2="605" y2="167" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="605" y1="260" x2="505" y2="260" stroke="#16a34a" stroke-width="2"/>
  <line x1="505" y1="260" x2="505" y2="152" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="660" y="278" text-anchor="middle" font-size="8" font-weight="bold" fill="#16a34a">∇ flows through μ and σ ✓</text>

  <rect x="470" y="300" width="360" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="650" y="318" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532d">Solution: Move randomness to ε (external input)</text>
  <text x="650" y="336" text-anchor="middle" font-size="8" fill="#166534">z = μ + σ ⊙ ε is deterministic given ε → differentiable w.r.t. μ, σ</text>
</svg>