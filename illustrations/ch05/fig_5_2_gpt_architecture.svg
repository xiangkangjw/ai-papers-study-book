<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 880" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="310" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">GPT Architecture (Decoder-Only)</text>
  <text x="310" y="46" text-anchor="middle" font-size="10" fill="#64748b">Autoregressive: predicts next token using causal (left-to-right) attention</text>

  <!-- Token inputs -->
  <rect x="80" y="810" width="50" height="30" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="105" y="830" text-anchor="middle" font-size="9" fill="#0f172a">"The"</text>
  <rect x="170" y="810" width="50" height="30" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="195" y="830" text-anchor="middle" font-size="9" fill="#0f172a">"cat"</text>
  <rect x="260" y="810" width="50" height="30" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="285" y="830" text-anchor="middle" font-size="9" fill="#0f172a">"sat"</text>
  <rect x="350" y="810" width="50" height="30" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="375" y="830" text-anchor="middle" font-size="9" fill="#0f172a">"on"</text>
  <rect x="440" y="810" width="50" height="30" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="465" y="830" text-anchor="middle" font-size="9" fill="#0f172a">"the"</text>

  <!-- Token Embedding -->
  <rect x="130" y="755" width="240" height="32" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="250" y="776" text-anchor="middle" font-size="10" fill="#0f172a">Token Embedding</text>
  <line x1="250" y1="810" x2="250" y2="789" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Position Embedding + Add -->
  <circle cx="310" cy="720" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="310" y="724" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350f">+</text>
  <text x="350" y="724" font-size="8" fill="#d97706">+ Positional Encoding</text>
  <line x1="250" y1="755" x2="250" y2="740" stroke="#475569" stroke-width="1"/>
  <line x1="250" y1="740" x2="296" y2="720" stroke="#475569" stroke-width="1"/>

  <!-- Decoder Block -->
  <rect x="100" y="390" width="310" height="300" rx="10" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="415" y="545" font-size="12" font-weight="bold" fill="#475569" transform="rotate(-90 415 545)">N = 12 layers ×</text>

  <!-- Masked Self-Attention -->
  <rect x="130" y="610" width="250" height="40" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="255" y="628" text-anchor="middle" font-size="10" font-weight="bold" fill="#831843">Masked Multi-Head Self-Attention</text>
  <text x="255" y="644" text-anchor="middle" font-size="8" fill="#db2777">CAUSAL — left-to-right only</text>

  <!-- Add & Norm 1 -->
  <rect x="130" y="555" width="250" height="32" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="255" y="576" text-anchor="middle" font-size="10" fill="#3b0764">Add &amp; LayerNorm</text>

  <!-- Feed Forward -->
  <rect x="130" y="500" width="250" height="32" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="255" y="521" text-anchor="middle" font-size="10" font-weight="bold" fill="#0c4a6e">Feed Forward (GELU)</text>

  <!-- Add & Norm 2 -->
  <rect x="130" y="447" width="250" height="32" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="255" y="468" text-anchor="middle" font-size="10" fill="#3b0764">Add &amp; LayerNorm</text>

  <!-- Internal arrows -->
  <line x1="255" y1="706" x2="255" y2="652" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="255" y1="610" x2="255" y2="589" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="255" y1="555" x2="255" y2="534" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="255" y1="500" x2="255" y2="481" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Residual connections -->
  <path d="M 125 640 L 105 640 L 105 571 L 128 571" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <path d="M 125 525 L 105 525 L 105 463 L 128 463" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Tensor shape -->
  <text x="255" y="415" text-anchor="middle" font-size="8" fill="#64748b" font-family="'SF Mono', Consolas, monospace">[B, T, 768]</text>

  <!-- Linear Head -->
  <rect x="165" y="330" width="180" height="32" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="255" y="351" text-anchor="middle" font-size="10" font-weight="bold" fill="#0c4a6e">Linear (→ vocab_size)</text>
  <line x1="255" y1="390" x2="255" y2="364" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Softmax -->
  <rect x="165" y="280" width="180" height="32" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="255" y="301" text-anchor="middle" font-size="10" font-weight="bold" fill="#3b0764">Softmax</text>
  <line x1="255" y1="330" x2="255" y2="314" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Next token predictions -->
  <rect x="80" y="210" width="50" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="105" y="230" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532d">"cat"</text>
  <rect x="170" y="210" width="50" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="195" y="230" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532d">"sat"</text>
  <rect x="260" y="210" width="50" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="285" y="230" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532d">"on"</text>
  <rect x="350" y="210" width="50" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="375" y="230" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532d">"the"</text>
  <rect x="440" y="210" width="50" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="465" y="230" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532d">"mat"</text>
  <line x1="255" y1="280" x2="255" y2="242" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Autoregressive loop -->
  <path d="M 465 240 C 540 240, 540 820, 465 830" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="555" y="530" font-size="9" font-weight="bold" fill="#16a34a" transform="rotate(90 555 530)">autoregressive loop</text>

  <!-- Label -->
  <text x="310" y="865" text-anchor="middle" font-size="9" fill="#64748b" font-family="'SF Mono', Consolas, monospace">GPT-1: N=12, d_model=768, h=12, vocab=40478 (BPE)</text>
</svg>