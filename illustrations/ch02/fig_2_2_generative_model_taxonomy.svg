<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Generative Model Taxonomy</text>
  <text x="410" y="46" text-anchor="middle" font-size="10" fill="#64748b">How different generative models approach learning the data distribution</text>

  <!-- Root -->
  <rect x="290" y="65" width="240" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
  <text x="410" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Generative Models</text>

  <!-- Split -->
  <line x1="310" y1="105" x2="200" y2="140" stroke="#475569" stroke-width="2"/>
  <line x1="510" y1="105" x2="620" y2="140" stroke="#475569" stroke-width="2"/>

  <!-- Explicit Density -->
  <rect x="60" y="140" width="280" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="200" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">Explicit Density p(x)</text>

  <!-- Implicit Density -->
  <rect x="480" y="140" width="280" height="40" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="620" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#831843">Implicit Density</text>

  <!-- Explicit sub-split -->
  <line x1="120" y1="180" x2="100" y2="210" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="280" y1="180" x2="300" y2="210" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Tractable -->
  <rect x="20" y="215" width="180" height="40" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="110" y="240" text-anchor="middle" font-size="10" font-weight="bold" fill="#0c4a6e">Tractable</text>

  <!-- Approximate -->
  <rect x="220" y="215" width="180" height="40" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="310" y="240" text-anchor="middle" font-size="10" font-weight="bold" fill="#0c4a6e">Approximate</text>

  <!-- Tractable methods -->
  <line x1="110" y1="255" x2="110" y2="275" stroke="#0284c7" stroke-width="1"/>
  <rect x="20" y="278" width="180" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="110" y="298" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532d">Autoregressive</text>
  <text x="110" y="314" text-anchor="middle" font-size="7" fill="#16a34a">GPT, PixelRNN</text>
  <text x="110" y="328" text-anchor="middle" font-size="7" fill="#64748b">Exact likelihood, slow sampling</text>

  <!-- Approximate methods -->
  <line x1="310" y1="255" x2="310" y2="275" stroke="#0284c7" stroke-width="1"/>
  <rect x="220" y="278" width="180" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="310" y="298" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532d">VAE (Ch2)</text>
  <text x="310" y="314" text-anchor="middle" font-size="7" fill="#16a34a">ELBO bound on log p(x)</text>
  <text x="310" y="328" text-anchor="middle" font-size="7" fill="#64748b">Smooth latent space, blurry</text>

  <!-- GAN -->
  <line x1="620" y1="180" x2="620" y2="210" stroke="#db2777" stroke-width="1.5"/>
  <rect x="480" y="215" width="280" height="40" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="620" y="233" text-anchor="middle" font-size="10" fill="#831843">No explicit p(x) — learn to sample</text>

  <line x1="540" y1="255" x2="540" y2="275" stroke="#db2777" stroke-width="1"/>
  <line x1="700" y1="255" x2="700" y2="275" stroke="#db2777" stroke-width="1"/>

  <rect x="460" y="278" width="160" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="298" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532d">GAN (Ch3)</text>
  <text x="540" y="314" text-anchor="middle" font-size="7" fill="#16a34a">Adversarial training</text>
  <text x="540" y="328" text-anchor="middle" font-size="7" fill="#64748b">Sharp samples, mode collapse</text>

  <rect x="640" y="278" width="160" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="720" y="298" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532d">Diffusion (Ch8)</text>
  <text x="720" y="314" text-anchor="middle" font-size="7" fill="#16a34a">Score matching / denoising</text>
  <text x="720" y="328" text-anchor="middle" font-size="7" fill="#64748b">High quality, slow sampling</text>
</svg>