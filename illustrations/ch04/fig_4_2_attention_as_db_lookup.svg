<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Attention as Soft Database Lookup</text>
  <text x="410" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">From hard retrieval to differentiable soft attention over all entries</text>

  <!-- Hard Lookup (Left) -->
  <rect x="30" y="70" width="350" height="280" rx="10" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="1.5"/>
  <text x="205" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">Hard Lookup (Dictionary)</text>

  <!-- Query -->
  <rect x="55" y="120" width="80" height="35" rx="5" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="95" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Query q</text>

  <!-- Key-Value pairs -->
  <rect x="180" y="110" width="180" height="140" rx="6" fill="#fff" stroke="#f5f5f8" stroke-width="1.5"/>
  <text x="270" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a4a5a">Key-Value Store</text>

  <rect x="195" y="140" width="65" height="25" rx="3" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1"/>
  <text x="227" y="157" text-anchor="middle" font-size="11" fill="#4a7fb5">k₁</text>
  <rect x="270" y="140" width="75" height="25" rx="3" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1"/>
  <text x="307" y="157" text-anchor="middle" font-size="11" fill="#3a9e8f">v₁</text>

  <rect x="195" y="170" width="65" height="25" rx="3" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="227" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">k₂ ✓</text>
  <rect x="270" y="170" width="75" height="25" rx="3" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="307" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">v₂ ←</text>

  <rect x="195" y="200" width="65" height="25" rx="3" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1"/>
  <text x="227" y="217" text-anchor="middle" font-size="11" fill="#4a7fb5">k₃</text>
  <rect x="270" y="200" width="75" height="25" rx="3" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1"/>
  <text x="307" y="217" text-anchor="middle" font-size="11" fill="#3a9e8f">v₃</text>

  <!-- Arrow from query to match -->
  <line x1="135" y1="137" x2="192" y2="182" stroke="#d4645c" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="155" y="155" font-size="11" fill="#d4645c">exact match</text>

  <!-- Result -->
  <text x="205" y="270" text-anchor="middle" font-size="11" fill="#4a4a5a">Output = v₂ (single value)</text>
  <text x="205" y="290" text-anchor="middle" font-size="11" fill="#7a7a8a">Non-differentiable — argmax selection</text>
  <text x="205" y="310" text-anchor="middle" font-size="11" fill="#7a7a8a" font-family="'JetBrains Mono', 'Fira Code', monospace">output = V[argmax_k match(q, k)]</text>

  <!-- Soft Lookup (Right) -->
  <rect x="420" y="70" width="370" height="280" rx="10" fill="#edf7f5" stroke="#3a9e8f" stroke-width="2"/>
  <text x="605" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a9e8f">Soft Attention (Transformer)</text>

  <!-- Query -->
  <rect x="445" y="120" width="80" height="35" rx="5" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="485" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Query q</text>

  <!-- Key-Value pairs with weights -->
  <rect x="570" y="110" width="200" height="140" rx="6" fill="#fff" stroke="#f5f5f8" stroke-width="1.5"/>
  <text x="670" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a4a5a">Key-Value Store</text>

  <!-- Weighted entries -->
  <rect x="585" y="140" width="50" height="25" rx="3" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1"/>
  <text x="610" y="157" text-anchor="middle" font-size="11" fill="#4a7fb5">k₁</text>
  <rect x="640" y="140" width="55" height="25" rx="3" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1"/>
  <text x="667" y="157" text-anchor="middle" font-size="11" fill="#3a9e8f">v₁</text>
  <text x="710" y="157" font-size="11" fill="#d4a03c" font-weight="bold">0.1</text>

  <rect x="585" y="170" width="50" height="25" rx="3" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="610" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">k₂</text>
  <rect x="640" y="170" width="55" height="25" rx="3" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="667" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">v₂</text>
  <text x="710" y="187" font-size="11" fill="#d4a03c" font-weight="bold">0.7</text>

  <rect x="585" y="200" width="50" height="25" rx="3" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1"/>
  <text x="610" y="217" text-anchor="middle" font-size="11" fill="#4a7fb5">k₃</text>
  <rect x="640" y="200" width="55" height="25" rx="3" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1"/>
  <text x="667" y="217" text-anchor="middle" font-size="11" fill="#3a9e8f">v₃</text>
  <text x="710" y="217" font-size="11" fill="#d4a03c" font-weight="bold">0.2</text>

  <!-- Arrows from query to all keys -->
  <line x1="525" y1="133" x2="582" y2="152" stroke="#d4645c" stroke-width="1" marker-end="url(#a)"/>
  <line x1="525" y1="137" x2="582" y2="182" stroke="#d4645c" stroke-width="2" marker-end="url(#a)"/>
  <line x1="525" y1="142" x2="582" y2="212" stroke="#d4645c" stroke-width="1" marker-end="url(#a)"/>
  <text x="540" y="165" font-size="11" fill="#d4645c">similarity</text>
  <text x="540" y="178" font-size="11" fill="#d4645c">scores</text>

  <!-- Softmax annotation -->
  <text x="745" y="155" font-size="11" fill="#d4a03c">softmax</text>
  <text x="745" y="168" font-size="11" fill="#d4a03c">weights</text>
  <text x="745" y="181" font-size="11" fill="#d4a03c">α = 1.0</text>

  <!-- Result -->
  <text x="605" y="270" text-anchor="middle" font-size="11" fill="#3a9e8f">Output = 0.1·v₁ + 0.7·v₂ + 0.2·v₃</text>
  <text x="605" y="290" text-anchor="middle" font-size="11" fill="#7a7a8a">Differentiable — weighted sum of all values</text>
  <text x="605" y="310" text-anchor="middle" font-size="11" fill="#7a7a8a" font-family="'JetBrains Mono', 'Fira Code', monospace">output = Σ softmax(qᵀk/√d) · v</text>

  <!-- Bottom equation -->
  <rect x="130" y="365" width="560" height="30" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="410" y="385" text-anchor="middle" font-size="11" fill="#d4a03c" font-family="'JetBrains Mono', 'Fira Code', monospace">Attention(Q, K, V) = softmax(QKᵀ / √d_k) V</text>
</svg>