<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Jamba: Hybrid SSM-Transformer Architecture</text>
  <text x="430" y="46" text-anchor="middle" font-size="10" fill="#64748b">AI21 Labs (2024) — Interleaving Mamba and Attention layers for long-context efficiency</text>

  <!-- Main architecture stack -->
  <rect x="30" y="65" width="480" height="380" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="270" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Jamba Block Stack (52B params, 12B active)</text>

  <!-- Input -->
  <rect x="180" y="408" width="180" height="28" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="270" y="426" text-anchor="middle" font-size="8" font-weight="bold" fill="#475569">Input Embeddings</text>

  <line x1="270" y1="408" x2="270" y2="393" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Layer 1: Mamba -->
  <rect x="130" y="360" width="280" height="32" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="270" y="380" text-anchor="middle" font-size="9" font-weight="bold" fill="#0c4a6e">Mamba Layer</text>
  <text x="70" y="380" font-size="7" fill="#0284c7">L1</text>

  <line x1="270" y1="360" x2="270" y2="348" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Layer 2: Mamba -->
  <rect x="130" y="315" width="280" height="32" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="270" y="335" text-anchor="middle" font-size="9" font-weight="bold" fill="#0c4a6e">Mamba Layer</text>
  <text x="70" y="335" font-size="7" fill="#0284c7">L2</text>

  <line x1="270" y1="315" x2="270" y2="303" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Layer 3: Attention + MoE -->
  <rect x="130" y="268" width="280" height="34" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
  <text x="210" y="289" text-anchor="middle" font-size="9" font-weight="bold" fill="#831843">Attention</text>
  <text x="70" y="289" font-size="7" fill="#db2777">L3</text>
  <line x1="300" y1="268" x2="300" y2="302" stroke="#db2777" stroke-width="0" fill="none"/>
  <rect x="290" y="272" width="110" height="26" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="345" y="289" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">MoE FFN</text>

  <line x1="270" y1="268" x2="270" y2="256" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Layer 4: Mamba -->
  <rect x="130" y="222" width="280" height="32" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="270" y="242" text-anchor="middle" font-size="9" font-weight="bold" fill="#0c4a6e">Mamba Layer</text>
  <text x="60" y="242" font-size="7" fill="#0284c7">L4</text>

  <line x1="270" y1="222" x2="270" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Layer 5: Mamba -->
  <rect x="130" y="176" width="280" height="32" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="270" y="196" text-anchor="middle" font-size="9" font-weight="bold" fill="#0c4a6e">Mamba Layer</text>
  <text x="60" y="196" font-size="7" fill="#0284c7">L5</text>

  <line x1="270" y1="176" x2="270" y2="164" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Layer 6: Attention + MoE -->
  <rect x="130" y="128" width="280" height="34" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
  <text x="210" y="149" text-anchor="middle" font-size="9" font-weight="bold" fill="#831843">Attention</text>
  <text x="20" y="149" font-size="7" fill="#db2777">L6</text>
  <rect x="290" y="132" width="110" height="26" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="345" y="149" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">MoE FFN</text>

  <line x1="270" y1="128" x2="270" y2="115" stroke="#475569" stroke-width="1.5"/>
  <text x="270" y="110" text-anchor="middle" font-size="10" fill="#94a3b8">...</text>

  <!-- Pattern annotation -->
  <rect x="55" y="105" width="60" height="340" rx="0" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="48" y="420" font-size="6" fill="#0284c7" transform="rotate(-90,48,420)">Ratio: ~7:1 Mamba : Attention</text>

  <!-- Right side: Design rationale -->
  <rect x="540" y="65" width="290" height="130" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="685" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">Why Hybrid?</text>
  <text x="560" y="112" font-size="8" fill="#334155">Mamba layers: O(n) in sequence length</text>
  <text x="560" y="128" font-size="8" fill="#334155">  - Efficient for long contexts (256K tokens)</text>
  <text x="560" y="144" font-size="8" fill="#334155">  - Constant KV cache per layer</text>
  <text x="560" y="164" font-size="8" fill="#334155">Attention layers: exact recall for critical info</text>
  <text x="560" y="180" font-size="8" fill="#334155">  - Sprinkled sparsely (every ~7 layers)</text>

  <!-- MoE detail -->
  <rect x="540" y="210" width="290" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="685" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">MoE in Attention Layers</text>
  <text x="560" y="258" font-size="8" fill="#334155">16 experts, top-2 routing per token</text>
  <text x="560" y="275" font-size="8" fill="#334155">Only in attention layers (not Mamba layers)</text>
  <text x="560" y="292" font-size="8" fill="#334155">Standard FFN in Mamba layers</text>
  <text x="560" y="309" font-size="8" fill="#d97706">52B total params, ~12B active per token</text>

  <!-- KV cache comparison -->
  <rect x="540" y="335" width="290" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="685" y="358" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">KV Cache Advantage</text>

  <rect x="560" y="370" width="120" height="28" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="620" y="388" text-anchor="middle" font-size="8" fill="#ef4444">Pure Transformer</text>

  <rect x="560" y="405" width="120" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="620" y="423" text-anchor="middle" font-size="8" fill="#16a34a">Jamba</text>

  <rect x="695" y="370" width="120" height="28" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="755" y="388" text-anchor="middle" font-size="7" fill="#ef4444">128 GB @ 256K</text>

  <rect x="695" y="405" width="50" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="720" y="423" text-anchor="middle" font-size="7" fill="#16a34a">~8 GB</text>

  <text x="685" y="448" text-anchor="middle" font-size="7" fill="#14532d">Mamba layers: no KV cache needed (constant state)</text>
</svg>