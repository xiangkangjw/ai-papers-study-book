    <!-- Row 2 -->
    <rect x="30" y="55" width="50" height="45" rx="3" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1"/>
    <text x="55" y="82" text-anchor="middle" font-size="11" fill="#3a3a4a">s₂₁</text>
    <rect x="80" y="55" width="50" height="45" rx="3" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1"/>
