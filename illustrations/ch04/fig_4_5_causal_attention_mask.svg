    <text x="55" y="182" text-anchor="middle" font-size="11" fill="#3a3a4a">s₄₁</text>
    <rect x="80" y="155" width="50" height="45" rx="3" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1"/>
    <text x="105" y="182" text-anchor="middle" font-size="11" fill="#3a3a4a">s₄₂</text>
    <rect x="130" y="155" width="50" height="45" rx="3" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1"/>
    <text x="155" y="182" text-anchor="middle" font-size="11" fill="#3a3a4a">s₄₃</text>
    <rect x="180" y="155" width="50" height="45" rx="3" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1"/>
    <text x="205" y="182" text-anchor="middle" font-size="11" fill="#3a3a4a">s₄₄</text>
