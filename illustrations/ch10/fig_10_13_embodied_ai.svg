<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Embodied AI: LLMs as Robot Brains</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Grounding language models in physical world through perception and action</text>

  <!-- Main loop -->
  <rect x="30" y="65" width="800" height="260" rx="10" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="2"/>

  <!-- Perception -->
  <rect x="55" y="95" width="170" height="100" rx="8" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="140" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Perception</text>
  <text x="140" y="138" text-anchor="middle" font-size="11" fill="#3a3a4a">Camera, LiDAR, depth</text>
  <text x="140" y="155" text-anchor="middle" font-size="11" fill="#3a3a4a">→ Visual tokens</text>
  <text x="140" y="172" text-anchor="middle" font-size="11" fill="#3a3a4a">→ Scene description</text>
  <text x="140" y="189" text-anchor="middle" font-size="11" fill="#4a7fb5">CLIP / ViT / SAM</text>

  <line x1="225" y1="145" x2="268" y2="145" stroke="#4a7fb5" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- LLM Planner -->
  <rect x="270" y="80" width="280" height="130" rx="8" fill="#f6e4e3" stroke="#d4645c" stroke-width="2.5"/>
  <text x="410" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">LLM Planner / Reasoner</text>

  <text x="290" y="128" font-size="11" fill="#3a3a4a">Task: "Make me a cup of coffee"</text>

  <rect x="290" y="138" width="240" height="60" rx="4" fill="#f6e4e3" stroke="#d4645c" stroke-width="1"/>
  <text x="410" y="155" text-anchor="middle" font-size="11" fill="#d4645c" font-family="'JetBrains Mono', 'Fira Code', monospace">1. Find coffee machine</text>
  <text x="410" y="168" text-anchor="middle" font-size="11" fill="#d4645c" font-family="'JetBrains Mono', 'Fira Code', monospace">2. Pick up coffee pod</text>
  <text x="410" y="181" text-anchor="middle" font-size="11" fill="#d4645c" font-family="'JetBrains Mono', 'Fira Code', monospace">3. Insert pod → press start</text>
  <text x="410" y="194" text-anchor="middle" font-size="11" fill="#d4645c" font-family="'JetBrains Mono', 'Fira Code', monospace">4. Wait → pick up mug → serve</text>

  <line x1="550" y1="145" x2="593" y2="145" stroke="#d4645c" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Action execution -->
  <rect x="595" y="95" width="170" height="100" rx="8" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="680" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Action</text>
  <text x="680" y="138" text-anchor="middle" font-size="11" fill="#3a3a4a">Low-level controllers</text>
  <text x="680" y="155" text-anchor="middle" font-size="11" fill="#3a3a4a">Grasping, navigation</text>
  <text x="680" y="172" text-anchor="middle" font-size="11" fill="#3a3a4a">Motor commands</text>
  <text x="680" y="189" text-anchor="middle" font-size="11" fill="#3a9e8f">RT-2 / skill primitives</text>

  <!-- Feedback loop -->
  <line x1="680" y1="195" x2="680" y2="230" stroke="#3a9e8f" stroke-width="1.5"/>
  <line x1="680" y1="230" x2="410" y2="230" stroke="#d4a03c" stroke-width="1.5"/>
  <line x1="410" y1="230" x2="140" y2="230" stroke="#d4a03c" stroke-width="1.5"/>
  <line x1="140" y1="230" x2="140" y2="195" stroke="#4a7fb5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="410" y="248" text-anchor="middle" font-size="11" fill="#d4a03c">Environment feedback → re-perceive → re-plan if needed</text>

  <!-- World model -->
  <rect x="300" y="260" width="260" height="40" rx="4" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="430" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Grounding: affordances, physics, spatial reasoning</text>
  <text x="430" y="295" text-anchor="middle" font-size="11" fill="#d4a03c">LLM must understand what is physically possible</text>

  <!-- Key systems -->
  <rect x="30" y="345" width="800" height="105" rx="10" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="430" y="368" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Key Systems</text>

  <rect x="50" y="380" width="170" height="55" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1"/>
  <text x="135" y="398" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">SayCan (Google)</text>
  <text x="135" y="413" text-anchor="middle" font-size="11" fill="#3a3a4a">LLM plans + affordance</text>
  <text x="135" y="428" text-anchor="middle" font-size="11" fill="#3a3a4a">scoring filters actions</text>

  <rect x="240" y="380" width="170" height="55" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1"/>
  <text x="325" y="398" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">RT-2 (Google)</text>
  <text x="325" y="413" text-anchor="middle" font-size="11" fill="#3a3a4a">VLM outputs robot actions</text>
  <text x="325" y="428" text-anchor="middle" font-size="11" fill="#3a3a4a">as text tokens directly</text>

  <rect x="430" y="380" width="170" height="55" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1"/>
  <text x="515" y="398" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">PaLM-E (Google)</text>
  <text x="515" y="413" text-anchor="middle" font-size="11" fill="#3a3a4a">562B embodied multimodal</text>
  <text x="515" y="428" text-anchor="middle" font-size="11" fill="#3a3a4a">LM with sensor inputs</text>

  <rect x="620" y="380" width="190" height="55" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1"/>
  <text x="715" y="398" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Voyager (NVIDIA)</text>
  <text x="715" y="413" text-anchor="middle" font-size="11" fill="#3a3a4a">LLM writes code as actions</text>
  <text x="715" y="428" text-anchor="middle" font-size="11" fill="#3a3a4a">in Minecraft — lifelong learning</text>
</svg>