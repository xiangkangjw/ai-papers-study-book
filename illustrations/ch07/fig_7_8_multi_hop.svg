<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Multi-Hop Retrieval and Reasoning</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Iterative decomposition: retrieve, reason, generate sub-queries, retrieve again</text>

  <!-- Example question -->
  <rect x="30" y="65" width="800" height="35" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="430" y="87" text-anchor="middle" font-size="11" fill="#d4a03c" font-weight="bold">Q: "What university did the inventor of the Transformer architecture attend for their PhD?"</text>

  <!-- Hop 1 -->
  <rect x="30" y="115" width="250" height="170" rx="10" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="155" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Hop 1</text>

  <rect x="50" y="152" width="210" height="30" rx="4" fill="#fff" stroke="#4a7fb5" stroke-width="1"/>
  <text x="155" y="171" text-anchor="middle" font-size="11" fill="#3a3a4a">Sub-query: "Who invented the Transformer?"</text>

  <line x1="155" y1="182" x2="155" y2="198" stroke="#4a7fb5" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="50" y="200" width="210" height="28" rx="4" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1"/>
  <text x="155" y="218" text-anchor="middle" font-size="11" fill="#4a4a5a">Retrieve from knowledge base</text>

  <line x1="155" y1="228" x2="155" y2="244" stroke="#4a7fb5" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="50" y="246" width="210" height="28" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="155" y="264" text-anchor="middle" font-size="11" fill="#3a9e8f">Finding: Ashish Vaswani et al. (2017)</text>

  <!-- Arrow to Hop 2 -->
  <line x1="280" y1="220" x2="318" y2="220" stroke="#d4a03c" stroke-width="2" marker-end="url(#a)"/>
  <text x="299" y="212" text-anchor="middle" font-size="11" fill="#d4a03c">context</text>

  <!-- Hop 2 -->
  <rect x="320" y="115" width="250" height="170" rx="10" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="445" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Hop 2</text>

  <rect x="340" y="152" width="210" height="30" rx="4" fill="#fff" stroke="#d4645c" stroke-width="1"/>
  <text x="445" y="165" text-anchor="middle" font-size="11" fill="#3a3a4a">Sub-query: "Where did Ashish</text>
  <text x="445" y="176" text-anchor="middle" font-size="11" fill="#3a3a4a">Vaswani do his PhD?"</text>

  <line x1="445" y1="182" x2="445" y2="198" stroke="#d4645c" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="340" y="200" width="210" height="28" rx="4" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1"/>
  <text x="445" y="218" text-anchor="middle" font-size="11" fill="#4a4a5a">Retrieve from knowledge base</text>

  <line x1="445" y1="228" x2="445" y2="244" stroke="#d4645c" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="340" y="246" width="210" height="28" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="445" y="264" text-anchor="middle" font-size="11" fill="#3a9e8f">Finding: USC (University of S. California)</text>

  <!-- Arrow to synthesis -->
  <line x1="570" y1="220" x2="608" y2="220" stroke="#d4a03c" stroke-width="2" marker-end="url(#a)"/>
  <text x="589" y="212" text-anchor="middle" font-size="11" fill="#d4a03c">context</text>

  <!-- Final synthesis -->
  <rect x="610" y="115" width="220" height="170" rx="10" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="720" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Synthesize</text>

  <rect x="630" y="155" width="180" height="55" rx="4" fill="#fff" stroke="#3a9e8f" stroke-width="1"/>
  <text x="720" y="172" text-anchor="middle" font-size="11" fill="#3a3a4a">LLM combines findings:</text>
  <text x="720" y="186" text-anchor="middle" font-size="11" fill="#3a3a4a">Hop 1: Vaswani invented Transformer</text>
  <text x="720" y="200" text-anchor="middle" font-size="11" fill="#3a3a4a">Hop 2: Vaswani attended USC</text>

  <line x1="720" y1="210" x2="720" y2="228" stroke="#3a9e8f" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="640" y="230" width="160" height="40" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="720" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">A: "USC (University</text>
  <text x="720" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">of Southern California)"</text>

  <!-- General framework below -->
  <rect x="30" y="305" width="800" height="105" rx="10" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="2"/>
  <text x="430" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">General Multi-Hop Framework</text>

  <!-- Pipeline -->
  <rect x="55" y="345" width="105" height="45" rx="6" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="107" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Decompose</text>
  <text x="107" y="380" text-anchor="middle" font-size="11" fill="#4a7fb5">Break question into</text>
  <text x="107" y="389" text-anchor="middle" font-size="11" fill="#4a7fb5">sub-questions</text>

  <line x1="160" y1="367" x2="182" y2="367" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="185" y="345" width="105" height="45" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="237" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Retrieve</text>
  <text x="237" y="380" text-anchor="middle" font-size="11" fill="#d4a03c">Search for each</text>
  <text x="237" y="389" text-anchor="middle" font-size="11" fill="#d4a03c">sub-question</text>

  <line x1="290" y1="367" x2="312" y2="367" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="315" y="345" width="105" height="45" rx="6" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="367" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Reason</text>
  <text x="367" y="380" text-anchor="middle" font-size="11" fill="#d4645c">Extract answer,</text>
  <text x="367" y="389" text-anchor="middle" font-size="11" fill="#d4645c">check sufficiency</text>

  <line x1="420" y1="367" x2="442" y2="367" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Loop back arrow -->
  <rect x="445" y="345" width="105" height="45" rx="6" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="497" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b68a8">More hops?</text>
  <text x="497" y="380" text-anchor="middle" font-size="11" fill="#7b68a8">Generate next</text>
  <text x="497" y="389" text-anchor="middle" font-size="11" fill="#7b68a8">sub-query if needed</text>

  <path d="M497,345 Q497,330 367,345" fill="none" stroke="#7b68a8" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a)"/>

  <line x1="550" y1="367" x2="572" y2="367" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="575" y="345" width="105" height="45" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="627" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Synthesize</text>
  <text x="627" y="380" text-anchor="middle" font-size="11" fill="#3a9e8f">Combine all</text>
  <text x="627" y="389" text-anchor="middle" font-size="11" fill="#3a9e8f">findings → answer</text>

  <!-- Systems -->
  <rect x="700" y="340" width="115" height="55" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1"/>
  <text x="757" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Systems</text>
  <text x="757" y="373" text-anchor="middle" font-size="11" fill="#3a3a4a">IRCoT, ReAct</text>
  <text x="757" y="385" text-anchor="middle" font-size="11" fill="#3a3a4a">DSP, ITER-RETGEN</text>
</svg>