<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Actor-Critic Methods</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Combine policy gradient (actor) with value estimation (critic) to reduce variance</text>

  <!-- Main diagram -->
  <rect x="30" y="65" width="800" height="250" rx="10" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="2"/>

  <!-- Environment -->
  <rect x="340" y="200" width="180" height="90" rx="8" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="430" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Environment</text>
  <text x="430" y="248" text-anchor="middle" font-size="11" fill="#d4a03c">s_t, r_t, s_{t+1}</text>
  <text x="430" y="268" text-anchor="middle" font-size="11" fill="#d4a03c">Returns state + reward</text>

  <!-- Actor (Policy) -->
  <rect x="55" y="85" width="200" height="100" rx="8" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2.5"/>
  <text x="155" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Actor π_θ(a|s)</text>
  <text x="155" y="132" text-anchor="middle" font-size="11" fill="#3a9e8f">Policy Network</text>
  <text x="155" y="150" text-anchor="middle" font-size="11" fill="#3a3a4a">Outputs: action probabilities</text>
  <text x="155" y="168" text-anchor="middle" font-size="11" fill="#3a9e8f" font-family="'JetBrains Mono', 'Fira Code', monospace">∇_θ J ≈ E[∇log π · A(s,a)]</text>

  <!-- Critic (Value) -->
  <rect x="605" y="85" width="200" height="100" rx="8" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2.5"/>
  <text x="705" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Critic V_φ(s)</text>
  <text x="705" y="132" text-anchor="middle" font-size="11" fill="#4a7fb5">Value Network</text>
  <text x="705" y="150" text-anchor="middle" font-size="11" fill="#3a3a4a">Outputs: state value estimate</text>
  <text x="705" y="168" text-anchor="middle" font-size="11" fill="#4a7fb5" font-family="'JetBrains Mono', 'Fira Code', monospace">L = (r + γV(s') - V(s))²</text>

  <!-- Advantage computation -->
  <rect x="320" y="95" width="220" height="55" rx="6" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="430" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Advantage A(s,a)</text>
  <text x="430" y="132" text-anchor="middle" font-size="11" fill="#d4645c" font-family="'JetBrains Mono', 'Fira Code', monospace">A = r + γV(s') - V(s)</text>
  <text x="430" y="145" text-anchor="middle" font-size="11" fill="#d4645c">TD error: how much better than expected</text>

  <!-- Arrows -->
  <!-- Actor → action → Environment -->
  <line x1="155" y1="185" x2="155" y2="225" stroke="#3a9e8f" stroke-width="1.5"/>
  <line x1="155" y1="225" x2="338" y2="225" stroke="#3a9e8f" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="230" y="218" font-size="11" fill="#3a9e8f" font-weight="bold">action a_t</text>

  <!-- Environment → state → both -->
  <line x1="430" y1="200" x2="430" y2="155" stroke="#d4a03c" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="450" y="175" font-size="11" fill="#d4a03c">s_t</text>

  <line x1="340" y1="240" x2="80" y2="240" stroke="#d4a03c" stroke-width="1.5"/>
  <line x1="80" y1="240" x2="80" y2="185" stroke="#d4a03c" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="200" y="255" font-size="11" fill="#d4a03c">s_t, r_t</text>

  <line x1="520" y1="240" x2="780" y2="240" stroke="#d4a03c" stroke-width="1.5"/>
  <line x1="780" y1="240" x2="780" y2="185" stroke="#d4a03c" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="660" y="255" font-size="11" fill="#d4a03c">s_t, r_t, s_{t+1}</text>

  <!-- Critic → Advantage → Actor (gradient signal) -->
  <line x1="605" y1="122" x2="542" y2="122" stroke="#4a7fb5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="575" y="115" font-size="11" fill="#4a7fb5">V(s)</text>

  <line x1="320" y1="122" x2="257" y2="122" stroke="#d4645c" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="290" y="115" font-size="11" fill="#d4645c">A(s,a)</text>

  <!-- Comparison -->
  <rect x="30" y="335" width="250" height="75" rx="8" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="155" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">REINFORCE (Actor Only)</text>
  <text x="50" y="378" font-size="11" fill="#3a3a4a">Uses full return G_t as signal</text>
  <text x="50" y="393" font-size="11" fill="#d4645c">High variance — slow convergence</text>
  <text x="50" y="408" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace">∇J ≈ E[∇log π · G_t]</text>

  <rect x="305" y="335" width="250" height="75" rx="8" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="430" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Actor-Critic (A2C)</text>
  <text x="325" y="378" font-size="11" fill="#3a3a4a">Uses learned baseline V(s)</text>
  <text x="325" y="393" font-size="11" fill="#3a9e8f">Lower variance — faster learning</text>
  <text x="325" y="408" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace">∇J ≈ E[∇log π · A(s,a)]</text>

  <rect x="580" y="335" width="250" height="75" rx="8" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="705" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b68a8">PPO (Proximal Policy Opt.)</text>
  <text x="600" y="378" font-size="11" fill="#3a3a4a">Actor-Critic + clipped objective</text>
  <text x="600" y="393" font-size="11" fill="#7b68a8">Stable updates — used in RLHF</text>
  <text x="600" y="408" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace">clip(r(θ), 1±ε) · A</text>
</svg>