<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="Inter, Helvetica, Arial, sans-serif">
  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Notation Reference Card</text>
  <text x="430" y="46" text-anchor="middle" font-size="10" fill="#64748b">Key symbols and conventions used throughout this book</text>

  <!-- Vectors & Matrices -->
  <rect x="30" y="65" width="260" height="210" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="160" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">Vectors &amp; Matrices</text>

  <text x="50" y="115" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">x, h, z</text>
  <text x="155" y="115" font-size="8" fill="#334155">Vectors (lowercase bold)</text>

  <text x="50" y="138" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">W, A, B</text>
  <text x="155" y="138" font-size="8" fill="#334155">Matrices (uppercase bold)</text>

  <text x="50" y="161" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">W_Q, W_K, W_V</text>
  <text x="195" y="161" font-size="8" fill="#334155">Attention projections</text>

  <text x="50" y="184" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">x_i or x^(i)</text>
  <text x="155" y="184" font-size="8" fill="#334155">i-th element or sample</text>

  <text x="50" y="207" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">X^T</text>
  <text x="155" y="207" font-size="8" fill="#334155">Matrix transpose</text>

  <text x="50" y="230" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">||x||</text>
  <text x="155" y="230" font-size="8" fill="#334155">L2 norm (default)</text>

  <text x="50" y="253" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">I_d</text>
  <text x="155" y="253" font-size="8" fill="#334155">d x d identity matrix</text>

  <!-- Dimensions & Shapes -->
  <rect x="310" y="65" width="240" height="210" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">Dimensions &amp; Shapes</text>

  <text x="330" y="115" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">B</text>
  <text x="420" y="115" font-size="8" fill="#334155">Batch size</text>

  <text x="330" y="138" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">T, L, N</text>
  <text x="420" y="138" font-size="8" fill="#334155">Sequence length</text>

  <text x="330" y="161" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">d_model, d</text>
  <text x="420" y="161" font-size="8" fill="#334155">Hidden dimension</text>

  <text x="330" y="184" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">d_k, d_v</text>
  <text x="420" y="184" font-size="8" fill="#334155">Key/value head dim</text>

  <text x="330" y="207" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">d_ff</text>
  <text x="420" y="207" font-size="8" fill="#334155">FFN inner dim (4d)</text>

  <text x="330" y="230" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">n_h</text>
  <text x="420" y="230" font-size="8" fill="#334155">Number of heads</text>

  <text x="330" y="253" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">[B,T,d]</text>
  <text x="420" y="253" font-size="8" fill="#334155">Tensor shape notation</text>

  <!-- Functions & Operations -->
  <rect x="570" y="65" width="260" height="210" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="700" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">Functions &amp; Operations</text>

  <text x="590" y="115" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">sigma(x)</text>
  <text x="700" y="115" font-size="8" fill="#334155">Sigmoid function</text>

  <text x="590" y="138" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">softmax(x)</text>
  <text x="700" y="138" font-size="8" fill="#334155">Softmax over last dim</text>

  <text x="590" y="161" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">LN(x), RMSNorm</text>
  <text x="730" y="161" font-size="8" fill="#334155">Normalization</text>

  <text x="590" y="184" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">x * y</text>
  <text x="700" y="184" font-size="8" fill="#334155">Elementwise multiply</text>

  <text x="590" y="207" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">x @ W</text>
  <text x="700" y="207" font-size="8" fill="#334155">Matrix multiply</text>

  <text x="590" y="230" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">[x; y]</text>
  <text x="700" y="230" font-size="8" fill="#334155">Concatenation</text>

  <text x="590" y="253" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">f ∘ g</text>
  <text x="700" y="253" font-size="8" fill="#334155">Function composition</text>

  <!-- Probability & Training -->
  <rect x="30" y="295" width="260" height="210" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="160" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#831843">Probability &amp; Training</text>

  <text x="50" y="345" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">theta</text>
  <text x="155" y="345" font-size="8" fill="#334155">Model parameters</text>

  <text x="50" y="368" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">L, J</text>
  <text x="155" y="368" font-size="8" fill="#334155">Loss / objective function</text>

  <text x="50" y="391" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">nabla_theta L</text>
  <text x="155" y="391" font-size="8" fill="#334155">Gradient w.r.t. params</text>

  <text x="50" y="414" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">eta, lr</text>
  <text x="155" y="414" font-size="8" fill="#334155">Learning rate</text>

  <text x="50" y="437" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">p(x), q(x)</text>
  <text x="155" y="437" font-size="8" fill="#334155">Probability distributions</text>

  <text x="50" y="460" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">KL(p||q)</text>
  <text x="155" y="460" font-size="8" fill="#334155">KL divergence</text>

  <text x="50" y="483" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">E_x[f(x)]</text>
  <text x="155" y="483" font-size="8" fill="#334155">Expectation</text>

  <!-- Architecture-Specific -->
  <rect x="310" y="295" width="240" height="210" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="430" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#581c87">Architecture-Specific</text>

  <text x="330" y="345" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">Q, K, V</text>
  <text x="420" y="345" font-size="8" fill="#334155">Query, key, value</text>

  <text x="330" y="368" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">Attn(Q,K,V)</text>
  <text x="440" y="368" font-size="8" fill="#334155">Attention function</text>

  <text x="330" y="391" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">PE, RoPE</text>
  <text x="420" y="391" font-size="8" fill="#334155">Positional encoding</text>

  <text x="330" y="414" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">z_t, eps_t</text>
  <text x="420" y="414" font-size="8" fill="#334155">Diffusion latent, noise</text>

  <text x="330" y="437" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">alpha_t, beta_t</text>
  <text x="440" y="437" font-size="8" fill="#334155">Noise schedule</text>

  <text x="330" y="460" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">r</text>
  <text x="420" y="460" font-size="8" fill="#334155">LoRA rank</text>

  <text x="330" y="483" font-size="9" fill="#334155" font-family="'SF Mono', Consolas, monospace" font-weight="bold">R_t</text>
  <text x="420" y="483" font-size="8" fill="#334155">Return-to-go (RL)</text>

  <!-- Conventions -->
  <rect x="570" y="295" width="260" height="210" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="700" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Conventions</text>

  <rect x="590" y="338" width="16" height="16" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="618" y="351" font-size="8" fill="#334155">Frozen / pretrained</text>

  <rect x="590" y="366" width="16" height="16" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="618" y="379" font-size="8" fill="#334155">Trainable / output</text>

  <rect x="590" y="394" width="16" height="16" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="618" y="407" font-size="8" fill="#334155">Weights / learnable</text>

  <rect x="590" y="422" width="16" height="16" rx="3" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="618" y="435" font-size="8" fill="#334155">Attention / decoder</text>

  <rect x="590" y="450" width="16" height="16" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="618" y="463" font-size="8" fill="#334155">Operations / encoder</text>

  <rect x="590" y="478" width="16" height="16" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="618" y="491" font-size="8" fill="#334155">Error / loss / pruned</text>
</svg>