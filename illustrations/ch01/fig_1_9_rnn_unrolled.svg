<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="af" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a7fb5"/></marker>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">RNN Unrolled Through Time</text>
  <text x="450" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Weight sharing across timesteps — same W_hh and W_xh at every step</text>

  <!-- h_0 -->
  <circle cx="60" cy="190" r="25" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="60" y="194" text-anchor="middle" font-size="11" fill="#7a7a8a">h₀</text>

  <!-- 5 RNN cells -->
  <!-- Cell 1 -->
  <rect x="120" y="155" width="100" height="70" rx="10" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="170" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">RNN Cell</text>
  <text x="170" y="196" text-anchor="middle" font-size="11" fill="#4a7fb5">tanh(W_hh h + W_xh x)</text>
  <!-- Input x1 -->
  <rect x="140" y="280" width="60" height="35" rx="6" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="170" y="302" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">x₁</text>
  <!-- Output h1 -->
  <text x="170" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">h₁</text>

  <!-- Cell 2 -->
  <rect x="270" y="155" width="100" height="70" rx="10" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="320" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">RNN Cell</text>
  <text x="320" y="196" text-anchor="middle" font-size="11" fill="#4a7fb5">tanh(W_hh h + W_xh x)</text>
  <rect x="290" y="280" width="60" height="35" rx="6" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="320" y="302" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">x₂</text>
  <text x="320" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">h₂</text>

  <!-- Cell 3 -->
  <rect x="420" y="155" width="100" height="70" rx="10" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="470" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">RNN Cell</text>
  <text x="470" y="196" text-anchor="middle" font-size="11" fill="#4a7fb5">tanh(W_hh h + W_xh x)</text>
  <rect x="440" y="280" width="60" height="35" rx="6" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="470" y="302" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">x₃</text>
  <text x="470" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">h₃</text>

  <!-- Cell 4 -->
  <rect x="570" y="155" width="100" height="70" rx="10" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="620" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">RNN Cell</text>
  <text x="620" y="196" text-anchor="middle" font-size="11" fill="#4a7fb5">tanh(W_hh h + W_xh x)</text>
  <rect x="590" y="280" width="60" height="35" rx="6" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="620" y="302" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">x₄</text>
  <text x="620" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">h₄</text>

  <!-- Cell 5 (T) -->
  <rect x="720" y="155" width="100" height="70" rx="10" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="770" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">RNN Cell</text>
  <text x="770" y="196" text-anchor="middle" font-size="11" fill="#4a7fb5">tanh(W_hh h + W_xh x)</text>
  <rect x="740" y="280" width="60" height="35" rx="6" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="770" y="302" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">x_T</text>
  <text x="770" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">h_T</text>

  <!-- Loss -->
  <rect x="840" y="160" width="50" height="40" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="865" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">L</text>

  <!-- Forward arrows: h0→cell1, cell1→cell2, etc (blue) -->
  <line x1="85" y1="190" x2="118" y2="190" stroke="#4a7fb5" stroke-width="2" marker-end="url(#af)"/>
  <line x1="220" y1="190" x2="268" y2="190" stroke="#4a7fb5" stroke-width="2" marker-end="url(#af)"/>
  <text x="244" y="183" text-anchor="middle" font-size="11" fill="#4a7fb5">W_hh</text>
  <line x1="370" y1="190" x2="418" y2="190" stroke="#4a7fb5" stroke-width="2" marker-end="url(#af)"/>
  <text x="394" y="183" text-anchor="middle" font-size="11" fill="#4a7fb5">W_hh</text>
  <line x1="520" y1="190" x2="568" y2="190" stroke="#4a7fb5" stroke-width="2" marker-end="url(#af)"/>
  <text x="544" y="183" text-anchor="middle" font-size="11" fill="#4a7fb5">W_hh</text>
  <line x1="670" y1="190" x2="718" y2="190" stroke="#4a7fb5" stroke-width="2" marker-end="url(#af)"/>
  <text x="694" y="183" text-anchor="middle" font-size="11" fill="#4a7fb5">W_hh</text>
  <line x1="820" y1="180" x2="838" y2="180" stroke="#4a7fb5" stroke-width="2" marker-end="url(#af)"/>

  <!-- Input arrows (vertical) -->
  <line x1="170" y1="280" x2="170" y2="227" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="320" y1="280" x2="320" y2="227" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="470" y1="280" x2="470" y2="227" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="620" y1="280" x2="620" y2="227" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="770" y1="280" x2="770" y2="227" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ===== Backward Pass: Fading Gradient Arrows ===== -->
  <!-- From Loss backward, with decreasing opacity -->
  <line x1="840" y1="200" x2="822" y2="210" stroke="#d4645c" stroke-width="3.5" opacity="1.0"/>
  <line x1="822" y1="210" x2="770" y2="210" stroke="none"/>

  <!-- ∂L/∂h_T — strong -->
  <line x1="720" y1="215" x2="672" y2="215" stroke="#d4645c" stroke-width="3.5" stroke-opacity="1.0"/>
  <text x="696" y="210" text-anchor="middle" font-size="11" fill="#d4645c" opacity="1.0">∂L/∂h_T</text>

  <!-- ∂L/∂h_4 — fading -->
  <line x1="570" y1="215" x2="522" y2="215" stroke="#d4645c" stroke-width="3" stroke-opacity="0.7"/>
  <text x="546" y="210" text-anchor="middle" font-size="11" fill="#d4645c" opacity="0.7">∂L/∂h₄</text>

  <!-- ∂L/∂h_3 — more fading -->
  <line x1="420" y1="215" x2="372" y2="215" stroke="#d4645c" stroke-width="2.5" stroke-opacity="0.4"/>
  <text x="396" y="210" text-anchor="middle" font-size="11" fill="#d4645c" opacity="0.4">∂L/∂h₃</text>

  <!-- ∂L/∂h_2 — very faded -->
  <line x1="270" y1="215" x2="222" y2="215" stroke="#d4645c" stroke-width="2" stroke-opacity="0.2"/>
  <text x="246" y="210" text-anchor="middle" font-size="11" fill="#d4645c" opacity="0.2">∂L/∂h₂</text>

  <!-- ∂L/∂h_1 — nearly gone -->
  <line x1="120" y1="215" x2="85" y2="215" stroke="#d4645c" stroke-width="1.5" stroke-opacity="0.08"/>
  <text x="100" y="210" text-anchor="middle" font-size="11" fill="#d4645c" opacity="0.15">∂L/∂h₁</text>

  <!-- Annotations -->
  <text x="820" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Strong ∇</text>
  <text x="100" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#e4ada9">Vanished ∇</text>

  <!-- Gradient formula -->
  <rect x="100" y="350" width="700" height="55" rx="8" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="450" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#b5454a">Vanishing Gradient Problem</text>
  <text x="450" y="388" text-anchor="middle" font-size="11" fill="#b5454a" font-family="'JetBrains Mono', 'Fira Code', monospace">∂L/∂h₁ = ∂L/∂h_T · ∏(t=2..T) ∂h_t/∂h_{t-1}  →  product of T-1 Jacobians shrinks exponentially</text>
</svg>