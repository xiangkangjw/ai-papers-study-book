<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">SimCLR: Simple Contrastive Learning</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Chen et al. (2020) — Learn visual representations via contrastive learning on augmented views</text>

  <!-- Pipeline -->
  <rect x="30" y="65" width="800" height="300" rx="10" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="2"/>

  <!-- Original image -->
  <rect x="60" y="150" width="60" height="60" rx="4" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="2"/>
  <text x="90" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">x</text>

  <!-- Two augmented views -->
  <line x1="120" y1="170" x2="165" y2="120" stroke="#d4a03c" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="120" y1="190" x2="165" y2="240" stroke="#d4a03c" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="145" y="145" font-size="11" fill="#d4a03c">aug t</text>
  <text x="145" y="225" font-size="11" fill="#d4a03c">aug t'</text>

  <!-- View 1 -->
  <rect x="170" y="95" width="55" height="55" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="197" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">x̃ᵢ</text>

  <!-- View 2 -->
  <rect x="170" y="215" width="55" height="55" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="197" y="247" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">x̃ⱼ</text>

  <!-- Encoders (shared weights) -->
  <line x1="225" y1="122" x2="268" y2="122" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="225" y1="242" x2="268" y2="242" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="270" y="100" width="90" height="45" rx="6" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="315" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Encoder f(·)</text>
  <text x="315" y="135" text-anchor="middle" font-size="11" fill="#d4645c">ResNet-50</text>

  <rect x="270" y="220" width="90" height="45" rx="6" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="315" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Encoder f(·)</text>
  <text x="315" y="255" text-anchor="middle" font-size="11" fill="#d4645c">shared weights</text>

  <!-- Representations -->
  <line x1="360" y1="122" x2="393" y2="122" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="360" y1="242" x2="393" y2="242" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="395" y="107" width="50" height="30" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="420" y="126" text-anchor="middle" font-size="11" fill="#4a7fb5">hᵢ</text>

  <rect x="395" y="227" width="50" height="30" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="420" y="246" text-anchor="middle" font-size="11" fill="#3a9e8f">hⱼ</text>

  <!-- Projection heads -->
  <line x1="445" y1="122" x2="478" y2="122" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="445" y1="242" x2="478" y2="242" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="480" y="100" width="90" height="45" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="525" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Proj g(·)</text>
  <text x="525" y="135" text-anchor="middle" font-size="11" fill="#d4a03c">MLP (2-layer)</text>

  <rect x="480" y="220" width="90" height="45" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="525" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Proj g(·)</text>
  <text x="525" y="255" text-anchor="middle" font-size="11" fill="#d4a03c">shared weights</text>

  <!-- Projected representations -->
  <line x1="570" y1="122" x2="603" y2="122" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="570" y1="242" x2="603" y2="242" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="605" y="107" width="45" height="30" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="627" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">zᵢ</text>

  <rect x="605" y="227" width="45" height="30" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="627" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">zⱼ</text>

  <!-- Contrastive loss -->
  <line x1="650" y1="122" x2="693" y2="165" stroke="#4a7fb5" stroke-width="1.5"/>
  <line x1="650" y1="242" x2="693" y2="200" stroke="#3a9e8f" stroke-width="1.5"/>

  <rect x="695" y="155" width="110" height="55" rx="8" fill="#7b68a8" stroke="#7b68a8" stroke-width="2"/>
  <text x="750" y="177" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">NT-Xent Loss</text>
  <text x="750" y="195" text-anchor="middle" font-size="11" fill="#e8e4f1">Attract pos, repel neg</text>

  <!-- Positive/negative annotation -->
  <text x="700" y="140" font-size="11" fill="#3a9e8f" font-weight="bold">positive pair ✓</text>
  <text x="700" y="225" font-size="11" fill="#d4645c">2(N-1) negatives ✗</text>

  <!-- Augmentation details -->
  <rect x="55" y="290" width="250" height="55" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="180" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Data Augmentations (Critical!)</text>
  <text x="70" y="328" font-size="11" fill="#3a3a4a">Random crop + resize, color jitter,</text>
  <text x="70" y="342" font-size="11" fill="#3a3a4a">Gaussian blur, horizontal flip</text>

  <!-- Batch size note -->
  <rect x="320" y="290" width="180" height="55" rx="6" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="410" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Large Batch Size</text>
  <text x="410" y="328" text-anchor="middle" font-size="11" fill="#3a3a4a">N = 4096–8192</text>
  <text x="410" y="342" text-anchor="middle" font-size="11" fill="#3a3a4a">More negatives → better</text>

  <!-- NT-Xent formula -->
  <rect x="515" y="290" width="295" height="55" rx="6" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="662" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b68a8">NT-Xent Loss</text>
  <text x="662" y="328" text-anchor="middle" font-size="11" fill="#7b68a8" font-family="'JetBrains Mono', 'Fira Code', monospace">ℓ(i,j) = -log exp(sim(zᵢ,zⱼ)/τ)</text>
  <text x="662" y="339" text-anchor="middle" font-size="11" fill="#7b68a8" font-family="'JetBrains Mono', 'Fira Code', monospace">           ─────────────────────</text>
  <text x="662" y="350" text-anchor="middle" font-size="11" fill="#7b68a8" font-family="'JetBrains Mono', 'Fira Code', monospace">          Σ_{k≠i} exp(sim(zᵢ,z_k)/τ)</text>

  <!-- Key insight -->
  <rect x="30" y="370" width="800" height="80" rx="8" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="430" y="393" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Key Insights from SimCLR</text>
  <text x="50" y="413" font-size="11" fill="#3a3a4a">1. <tspan font-weight="bold">Composition of augmentations</tspan> matters more than any single augmentation (crop + color is essential)</text>
  <text x="50" y="430" font-size="11" fill="#3a3a4a">2. <tspan font-weight="bold">Projection head g(·)</tspan> is critical — contrastive loss in z-space, but h-space gives better downstream features</text>
  <text x="50" y="447" font-size="11" fill="#3a3a4a">3. <tspan font-weight="bold">Larger batch</tspan> and <tspan font-weight="bold">longer training</tspan> benefit contrastive learning more than supervised learning</text>
</svg>