<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#3a9e8f"/></marker>
  </defs>

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">LSTM Cell Architecture</text>

  <!-- ===== Cell State Highway (top) ===== -->
  <line x1="30" y1="90" x2="790" y2="90" stroke="#3a9e8f" stroke-width="4"/>
  <text x="410" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Cell State Highway c_t  (Gradient Highway — additive updates preserve gradients)</text>

  <!-- c_{t-1} label -->
  <text x="30" y="83" text-anchor="start" font-size="11" font-weight="bold" fill="#3a9e8f" font-family="'JetBrains Mono', 'Fira Code', monospace">c_{t-1}</text>
  <!-- c_t label -->
  <text x="760" y="83" text-anchor="end" font-size="11" font-weight="bold" fill="#3a9e8f" font-family="'JetBrains Mono', 'Fira Code', monospace">c_t</text>

  <!-- ===== Forget Gate ===== -->
  <rect x="75" y="120" width="180" height="74" rx="8" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="165" y="139" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Forget Gate f_t</text>
  <text x="165" y="158" text-anchor="middle" font-size="9.5" fill="#d4a03c">looks at [h_{t-1}, x_t]</text>
  <text x="165" y="173" text-anchor="middle" font-size="9.5" fill="#d4a03c">0 forgets, 1 keeps</text>
  <text x="165" y="186" text-anchor="middle" font-size="9.5" fill="#d4a03c">retain old memory</text>

  <!-- Forget gate pointwise multiply on highway -->
  <circle cx="165" cy="90" r="14" fill="white" stroke="#d4a03c" stroke-width="2"/>
  <text x="165" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#d4a03c">⊗</text>
  <line x1="165" y1="120" x2="165" y2="106" stroke="#d4a03c" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ===== Input Gate ===== -->
  <rect x="260" y="120" width="170" height="74" rx="8" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="345" y="139" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Input Gate i_t</text>
  <text x="345" y="158" text-anchor="middle" font-size="9.5" fill="#d4a03c">looks at [h_{t-1}, x_t]</text>
  <text x="345" y="173" text-anchor="middle" font-size="9.5" fill="#d4a03c">scales the candidate</text>
  <text x="345" y="186" text-anchor="middle" font-size="9.5" fill="#d4a03c">write new memory</text>

  <!-- ===== Candidate ===== -->
  <rect x="260" y="212" width="170" height="62" rx="8" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="345" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Candidate c̃_t</text>
  <text x="345" y="249" text-anchor="middle" font-size="9.5" fill="#d4a03c">new content via tanh</text>
  <text x="345" y="264" text-anchor="middle" font-size="9.5" fill="#d4a03c">proposed cell content</text>

  <!-- Input gate × Candidate -->
  <circle cx="345" cy="290" r="14" fill="white" stroke="#d4a03c" stroke-width="2"/>
  <text x="345" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#d4a03c">⊗</text>
  <line x1="345" y1="194" x2="345" y2="278" stroke="#d4a03c" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="345" y1="274" x2="345" y2="278" stroke="#d4a03c" stroke-width="1.5"/>

  <!-- Add to highway -->
  <circle cx="410" cy="90" r="14" fill="white" stroke="#3a9e8f" stroke-width="2.5"/>
  <text x="410" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a9e8f">⊕</text>
  <!-- Arrow from i⊗c̃ up to highway -->
  <line x1="359" y1="290" x2="410" y2="290" stroke="#4a4a5a" stroke-width="1.5"/>
  <line x1="410" y1="290" x2="410" y2="106" stroke="#3a9e8f" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- ===== Output Gate ===== -->
  <rect x="490" y="120" width="170" height="74" rx="8" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="575" y="139" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Output Gate o_t</text>
  <text x="575" y="158" text-anchor="middle" font-size="9.5" fill="#d4a03c">looks at [h_{t-1}, x_t]</text>
  <text x="575" y="173" text-anchor="middle" font-size="9.5" fill="#d4a03c">gates tanh(c_t)</text>
  <text x="575" y="186" text-anchor="middle" font-size="9.5" fill="#d4a03c">expose hidden state</text>

  <!-- tanh of cell state -->
  <rect x="510" y="210" width="60" height="35" rx="6" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="540" y="233" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">tanh</text>
  <!-- Arrow from highway down to tanh -->
  <line x1="540" y1="90" x2="540" y2="90" stroke="#3a9e8f" stroke-width="1"/>
  <circle cx="540" cy="90" r="3" fill="#3a9e8f"/>
  <line x1="540" y1="93" x2="540" y2="208" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Output gate × tanh(c) -->
  <circle cx="620" cy="230" r="14" fill="white" stroke="#d4a03c" stroke-width="2"/>
  <text x="620" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#d4a03c">⊗</text>
  <line x1="570" y1="227" x2="606" y2="227" stroke="#4a4a5a" stroke-width="1.5"/>
  <line x1="575" y1="194" x2="620" y2="218" stroke="#d4a03c" stroke-width="1.5"/>

  <!-- h_t output -->
  <line x1="634" y1="230" x2="720" y2="230" stroke="#4a4a5a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="720" y="210" width="80" height="40" rx="6" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="2"/>
  <text x="760" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">h_t</text>

  <!-- ===== Inputs from below ===== -->
  <!-- h_{t-1} -->
  <rect x="20" y="370" width="90" height="40" rx="6" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="2"/>
  <text x="65" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">h_{t-1}</text>

  <!-- x_t -->
  <rect x="20" y="430" width="90" height="40" rx="6" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="2"/>
  <text x="65" y="455" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">x_t</text>

  <!-- Concat box -->
  <rect x="150" y="370" width="110" height="100" rx="8" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="205" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Concat</text>
  <text x="205" y="418" text-anchor="middle" font-size="11" fill="#4a7fb5">[h_{t-1}, x_t]</text>
  <text x="205" y="458" text-anchor="middle" font-size="11" fill="#7a7a8a" font-family="'JetBrains Mono', 'Fira Code', monospace">[2·d_h]</text>

  <!-- Arrows to concat -->
  <line x1="110" y1="390" x2="148" y2="400" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="110" y1="450" x2="148" y2="440" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Fan-out from concat to all gates -->
  <!-- Connect to forget gate -->
  <line x1="260" y1="390" x2="125" y2="390" stroke="#4a4a5a" stroke-width="1"/>
  <line x1="125" y1="390" x2="125" y2="214" stroke="#4a4a5a" stroke-width="1"/>
  <line x1="125" y1="214" x2="165" y2="214" stroke="#4a4a5a" stroke-width="1"/>
  <line x1="165" y1="214" x2="165" y2="196" stroke="#4a4a5a" stroke-width="1" marker-end="url(#a)"/>
  <!-- Connect to input gate -->
  <line x1="260" y1="400" x2="300" y2="400" stroke="#4a4a5a" stroke-width="1"/>
  <line x1="300" y1="400" x2="300" y2="214" stroke="#4a4a5a" stroke-width="1"/>
  <line x1="300" y1="214" x2="345" y2="214" stroke="#4a4a5a" stroke-width="1"/>
  <line x1="345" y1="214" x2="345" y2="196" stroke="#4a4a5a" stroke-width="1" marker-end="url(#a)"/>
  <!-- Connect to candidate -->
  <line x1="260" y1="410" x2="285" y2="410" stroke="#4a4a5a" stroke-width="1"/>
  <line x1="285" y1="410" x2="285" y2="286" stroke="#4a4a5a" stroke-width="1"/>
  <line x1="285" y1="286" x2="345" y2="286" stroke="#4a4a5a" stroke-width="1"/>
  <line x1="345" y1="286" x2="345" y2="276" stroke="#4a4a5a" stroke-width="1" marker-end="url(#a)"/>
  <!-- Connect to output gate -->
  <line x1="260" y1="430" x2="610" y2="430" stroke="#4a4a5a" stroke-width="1"/>
  <line x1="610" y1="430" x2="610" y2="214" stroke="#4a4a5a" stroke-width="1"/>
  <line x1="610" y1="214" x2="575" y2="214" stroke="#4a4a5a" stroke-width="1"/>
  <line x1="575" y1="214" x2="575" y2="196" stroke="#4a4a5a" stroke-width="1" marker-end="url(#a)"/>

  <!-- Cell state equation -->
  <rect x="100" y="510" width="620" height="45" rx="8" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="410" y="528" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Cell State Update (Additive — not multiplicative!)</text>
  <text x="410" y="546" text-anchor="middle" font-size="10" fill="#3a9e8f" font-family="'JetBrains Mono', 'Fira Code', monospace">c_t = f_t ⊙ c_{t-1} + i_t ⊙ c̃_t     →     Gradient flows through ⊕ unattenuated</text>
</svg>
