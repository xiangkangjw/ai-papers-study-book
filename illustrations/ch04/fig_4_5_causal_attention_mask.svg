    <text x="55" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">.2</text>
    <rect x="80" y="105" width="50" height="45" rx="3" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
    <text x="105" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">.3</text>
    <rect x="130" y="105" width="50" height="45" rx="3" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
    <text x="155" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">.5</text>
    <rect x="180" y="105" width="50" height="45" rx="3" fill="#f6e4e3" stroke="#e4ada9" stroke-width="1"/>
    <text x="205" y="132" text-anchor="middle" font-size="11" fill="#b5454a">0</text>

    <!-- Row 4 -->
    <rect x="30" y="155" width="50" height="45" rx="3" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
    <text x="55" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">.1</text>
    <rect x="80" y="155" width="50" height="45" rx="3" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
    <text x="105" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">.2</text>
    <rect x="130" y="155" width="50" height="45" rx="3" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
