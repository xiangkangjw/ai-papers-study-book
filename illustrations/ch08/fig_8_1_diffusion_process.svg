<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a7fb5"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d4645c"/></marker>
  </defs>

  <text x="460" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Forward &amp; Reverse Diffusion Process</text>

  <!-- ===== Forward Process (top row) ===== -->
  <text x="460" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">→ Forward Process q(x_t | x_{t-1}): Gradually add Gaussian noise</text>

  <!-- x_0 (clean) -->
  <rect x="30" y="75" width="80" height="80" rx="8" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="70" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">x₀</text>
  <text x="70" y="125" text-anchor="middle" font-size="11" fill="#3a9e8f">clean</text>
  <!-- Noise dots: none -->

  <!-- Forward arrow -->
  <line x1="112" y1="115" x2="145" y2="115" stroke="#4a7fb5" stroke-width="2" marker-end="url(#ab)"/>
  <text x="128" y="108" text-anchor="middle" font-size="11" fill="#4a7fb5">+ε</text>

  <!-- x_1 (slight noise) -->
  <rect x="148" y="75" width="80" height="80" rx="8" fill="#edf7f5" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="188" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a3a4a">x₁</text>
  <circle cx="165" cy="95" r="2" fill="#c0c0c8" opacity="0.3"/>
  <circle cx="200" cy="130" r="2" fill="#c0c0c8" opacity="0.3"/>

  <line x1="230" y1="115" x2="263" y2="115" stroke="#4a7fb5" stroke-width="2" marker-end="url(#ab)"/>

  <!-- x_2 -->
  <rect x="266" y="75" width="80" height="80" rx="8" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1.5"/>
  <text x="306" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a3a4a">x₂</text>
  <circle cx="280" cy="90" r="2" fill="#c0c0c8" opacity="0.4"/>
  <circle cx="295" cy="100" r="2" fill="#c0c0c8" opacity="0.4"/>
  <circle cx="320" cy="130" r="2" fill="#c0c0c8" opacity="0.4"/>
  <circle cx="275" cy="140" r="2" fill="#c0c0c8" opacity="0.4"/>

  <!-- Dots -->
  <text x="370" y="118" text-anchor="middle" font-size="16" fill="#c0c0c8">···</text>

  <!-- x_{T-1} -->
  <rect x="400" y="75" width="80" height="80" rx="8" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1.5"/>
  <text x="440" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a3a4a">x_{T-1}</text>
  <g opacity="0.5">
    <circle cx="415" cy="90" r="2" fill="#c0c0c8"/><circle cx="430" cy="95" r="2" fill="#c0c0c8"/>
    <circle cx="450" cy="100" r="2" fill="#c0c0c8"/><circle cx="420" cy="110" r="2" fill="#c0c0c8"/>
    <circle cx="440" cy="120" r="2" fill="#c0c0c8"/><circle cx="460" cy="130" r="2" fill="#c0c0c8"/>
    <circle cx="410" cy="135" r="2" fill="#c0c0c8"/><circle cx="455" cy="140" r="2" fill="#c0c0c8"/>
  </g>

  <line x1="482" y1="115" x2="515" y2="115" stroke="#4a7fb5" stroke-width="2" marker-end="url(#ab)"/>

  <!-- x_T (pure noise) -->
  <rect x="518" y="75" width="80" height="80" rx="8" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="2"/>
  <text x="558" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">x_T</text>
  <text x="558" y="123" text-anchor="middle" font-size="11" fill="#4a4a5a">pure noise</text>
  <g opacity="0.7">
    <circle cx="530" cy="88" r="2" fill="#7a7a8a"/><circle cx="545" cy="92" r="2" fill="#7a7a8a"/>
    <circle cx="560" cy="85" r="2" fill="#7a7a8a"/><circle cx="575" cy="95" r="2" fill="#7a7a8a"/>
    <circle cx="535" cy="100" r="2" fill="#7a7a8a"/><circle cx="550" cy="105" r="2" fill="#7a7a8a"/>
    <circle cx="570" cy="110" r="2" fill="#7a7a8a"/><circle cx="585" cy="100" r="2" fill="#7a7a8a"/>
    <circle cx="530" cy="115" r="2" fill="#7a7a8a"/><circle cx="548" cy="120" r="2" fill="#7a7a8a"/>
    <circle cx="565" cy="125" r="2" fill="#7a7a8a"/><circle cx="580" cy="118" r="2" fill="#7a7a8a"/>
    <circle cx="540" cy="135" r="2" fill="#7a7a8a"/><circle cx="555" cy="140" r="2" fill="#7a7a8a"/>
    <circle cx="575" cy="138" r="2" fill="#7a7a8a"/><circle cx="585" cy="145" r="2" fill="#7a7a8a"/>
  </g>

  <!-- Noise schedule annotation -->
  <text x="558" y="170" text-anchor="middle" font-size="11" fill="#4a4a5a" font-family="'JetBrains Mono', 'Fira Code', monospace">≈ N(0, I)</text>

  <!-- ===== Reverse Process (bottom row) ===== -->
  <text x="460" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">← Reverse Process p_θ(x_{t-1} | x_t): Learned denoising</text>

  <!-- Same boxes but reversed arrows -->
  <!-- x_T -->
  <rect x="518" y="220" width="80" height="80" rx="8" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="2"/>
  <text x="558" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">x_T</text>
  <text x="558" y="270" text-anchor="middle" font-size="11" fill="#4a4a5a">noise</text>

  <line x1="516" y1="260" x2="483" y2="260" stroke="#d4645c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="500" y="253" text-anchor="middle" font-size="11" fill="#d4645c">−ε_θ</text>

  <rect x="400" y="220" width="80" height="80" rx="8" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1.5"/>
  <text x="440" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a3a4a">x_{T-1}</text>

  <text x="380" y="263" text-anchor="middle" font-size="16" fill="#c0c0c8">···</text>

  <rect x="266" y="220" width="80" height="80" rx="8" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1.5"/>
  <text x="306" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a3a4a">x₂</text>

  <line x1="264" y1="260" x2="231" y2="260" stroke="#d4645c" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="148" y="220" width="80" height="80" rx="8" fill="#edf7f5" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="188" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a3a4a">x₁</text>

  <line x1="146" y1="260" x2="113" y2="260" stroke="#d4645c" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="30" y="220" width="80" height="80" rx="8" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="70" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">x₀</text>
  <text x="70" y="270" text-anchor="middle" font-size="11" fill="#3a9e8f">recovered!</text>

  <!-- Neural network annotation -->
  <rect x="630" y="230" width="260" height="60" rx="8" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="760" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">U-Net ε_θ(x_t, t) predicts noise</text>
  <text x="760" y="268" text-anchor="middle" font-size="11" fill="#d4a03c" font-family="'JetBrains Mono', 'Fira Code', monospace">L = E[‖ε − ε_θ(x_t, t)‖²]</text>
  <text x="760" y="282" text-anchor="middle" font-size="11" fill="#d4a03c">Simple MSE loss on noise prediction</text>
</svg>