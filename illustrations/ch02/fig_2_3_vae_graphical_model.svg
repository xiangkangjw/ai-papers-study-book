<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a7fb5"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d4645c"/></marker>
  </defs>

  <text x="250" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">VAE Graphical Model</text>

  <!-- Prior -->
  <text x="250" y="70" text-anchor="middle" font-size="11" fill="#7a7a8a" font-family="'JetBrains Mono', 'Fira Code', monospace">p(z) = N(0, I)</text>

  <!-- Latent z (open circle = latent/unobserved) -->
  <circle cx="250" cy="120" r="32" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2.5"/>
  <text x="250" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a9e8f">z</text>
  <text x="250" y="136" text-anchor="middle" font-size="11" fill="#3a9e8f">latent</text>

  <!-- Observed x (shaded circle = observed) -->
  <circle cx="250" cy="270" r="32" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="2.5"/>
  <text x="250" y="268" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">x</text>
  <text x="250" y="286" text-anchor="middle" font-size="11" fill="#4a4a5a">observed</text>

  <!-- Generative model arrow (right side): z → x, p_θ(x|z) -->
  <line x1="272" y1="148" x2="272" y2="236" stroke="#4a7fb5" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="340" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5" font-family="'JetBrains Mono', 'Fira Code', monospace">p_θ(x|z)</text>
  <text x="340" y="212" text-anchor="middle" font-size="11" fill="#4a7fb5">decoder / generative</text>

  <!-- θ parameter -->
  <rect x="370" y="150" width="40" height="25" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="390" y="167" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">θ</text>
  <line x1="370" y1="162" x2="320" y2="185" stroke="#4a7fb5" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Inference model arrow (left side): x → z, q_φ(z|x) -->
  <line x1="228" y1="240" x2="228" y2="154" stroke="#d4645c" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#ar)"/>
  <text x="140" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c" font-family="'JetBrains Mono', 'Fira Code', monospace">q_φ(z|x)</text>
  <text x="140" y="212" text-anchor="middle" font-size="11" fill="#d4645c">encoder / inference</text>

  <!-- φ parameter -->
  <rect x="85" y="150" width="40" height="25" rx="4" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="105" y="167" text-anchor="middle" font-size="11" font-weight="bold" fill="#b5454a">φ</text>
  <line x1="125" y1="162" x2="158" y2="185" stroke="#d4645c" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Plate notation (N data points) -->
  <rect x="180" y="85" width="140" height="235" rx="10" fill="none" stroke="#c0c0c8" stroke-width="1.5"/>
  <text x="310" y="310" font-size="12" font-weight="bold" fill="#c0c0c8">N</text>

  <!-- Legend -->
  <rect x="70" y="340" width="360" height="70" rx="8" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="1"/>
  <circle cx="100" cy="360" r="10" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="120" y="364" font-size="11" fill="#3a3a4a">Open circle = latent (unobserved) variable</text>
  <circle cx="100" cy="388" r="10" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="120" y="392" font-size="11" fill="#3a3a4a">Shaded circle = observed variable</text>
  <line x1="260" y1="358" x2="290" y2="358" stroke="#4a7fb5" stroke-width="2"/>
  <text x="300" y="362" font-size="11" fill="#4a7fb5">Generative (solid)</text>
  <line x1="260" y1="386" x2="290" y2="386" stroke="#d4645c" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="300" y="390" font-size="11" fill="#d4645c">Inference (dashed)</text>
</svg>