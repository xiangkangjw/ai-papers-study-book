<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#3a9e8f"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d4645c"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">GAN: Generator vs. Discriminator</text>
  <text x="430" y="48" text-anchor="middle" font-size="11" fill="#7a7a8a" font-family="'JetBrains Mono', 'Fira Code', monospace">min_G max_D  E[log D(x)] + E[log(1 − D(G(z)))]</text>

  <!-- ===== Noise Input ===== -->
  <rect x="30" y="130" width="100" height="50" rx="8" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="2"/>
  <text x="80" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Noise z</text>
  <text x="80" y="168" text-anchor="middle" font-size="11" fill="#7a7a8a" font-family="'JetBrains Mono', 'Fira Code', monospace">z ~ N(0, I)</text>

  <!-- ===== Generator ===== -->
  <rect x="180" y="110" width="150" height="90" rx="10" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2.5"/>
  <text x="255" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a9e8f">Generator G</text>
  <text x="255" y="158" text-anchor="middle" font-size="11" fill="#3a9e8f">Neural Network</text>
  <text x="255" y="175" text-anchor="middle" font-size="11" fill="#3a9e8f">(learns to create fakes)</text>
  <text x="255" y="192" text-anchor="middle" font-size="11" fill="#3a9e8f" font-family="'JetBrains Mono', 'Fira Code', monospace">G(z) → fake image</text>

  <!-- Arrow noise→G -->
  <line x1="130" y1="155" x2="178" y2="155" stroke="#4a4a5a" stroke-width="2" marker-end="url(#a)"/>

  <!-- Fake image -->
  <rect x="380" y="120" width="90" height="70" rx="8" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="425" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Fake</text>
  <text x="425" y="168" text-anchor="middle" font-size="11" fill="#d4645c">G(z)</text>
  <text x="425" y="184" text-anchor="middle" font-size="11" fill="#d4645c">image</text>

  <!-- Arrow G→fake -->
  <line x1="330" y1="155" x2="378" y2="155" stroke="#3a9e8f" stroke-width="2" marker-end="url(#ag)"/>

  <!-- ===== Real image ===== -->
  <rect x="380" y="240" width="90" height="70" rx="8" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="425" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Real</text>
  <text x="425" y="288" text-anchor="middle" font-size="11" fill="#4a7fb5">x ~ p_data</text>
  <text x="425" y="304" text-anchor="middle" font-size="11" fill="#4a7fb5">image</text>

  <!-- ===== Discriminator ===== -->
  <rect x="530" y="160" width="150" height="110" rx="10" fill="#f6e4e3" stroke="#d4645c" stroke-width="2.5"/>
  <text x="605" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#b5454a">Discriminator D</text>
  <text x="605" y="208" text-anchor="middle" font-size="11" fill="#d4645c">Neural Network</text>
  <text x="605" y="225" text-anchor="middle" font-size="11" fill="#d4645c">(learns to detect fakes)</text>
  <text x="605" y="242" text-anchor="middle" font-size="11" fill="#d4645c" font-family="'JetBrains Mono', 'Fira Code', monospace">D(x) → P(real)</text>
  <text x="605" y="260" text-anchor="middle" font-size="11" fill="#d4645c" font-family="'JetBrains Mono', 'Fira Code', monospace">output ∈ [0, 1]</text>

  <!-- Arrow fake→D -->
  <line x1="470" y1="155" x2="528" y2="195" stroke="#4a4a5a" stroke-width="2" marker-end="url(#a)"/>
  <!-- Arrow real→D -->
  <line x1="470" y1="275" x2="528" y2="240" stroke="#4a4a5a" stroke-width="2" marker-end="url(#a)"/>

  <!-- Output -->
  <rect x="730" y="190" width="100" height="50" rx="8" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="2"/>
  <text x="780" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">P(real)</text>
  <text x="780" y="230" text-anchor="middle" font-size="11" fill="#7a7a8a" font-family="'JetBrains Mono', 'Fira Code', monospace">∈ [0, 1]</text>

  <line x1="680" y1="215" x2="728" y2="215" stroke="#4a4a5a" stroke-width="2" marker-end="url(#a)"/>

  <!-- ===== Adversarial gradient arrows ===== -->
  <!-- G gradient: wants D to output 1 for fakes (minimize log(1-D(G(z)))) -->
  <path d="M 605 160 C 605 80, 255 60, 255 108" fill="none" stroke="#3a9e8f" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="430" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">G updates: "Make fakes more realistic"</text>
  <text x="430" y="92" text-anchor="middle" font-size="11" fill="#3a9e8f">minimize log(1 − D(G(z)))</text>

  <!-- D gradient: wants to correctly classify real/fake -->
  <path d="M 780 240 C 780 340, 605 340, 605 272" fill="none" stroke="#d4645c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="700" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">D updates: "Get better at detecting"</text>
  <text x="700" y="346" text-anchor="middle" font-size="11" fill="#d4645c">maximize log D(x) + log(1 − D(G(z)))</text>

  <!-- Equilibrium note -->
  <rect x="130" y="370" width="600" height="45" rx="8" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="1.5"/>
  <text x="430" y="388" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Nash Equilibrium: G generates p_g = p_data, D outputs 0.5 everywhere</text>
  <text x="430" y="405" text-anchor="middle" font-size="11" fill="#7a7a8a">Two players with opposing objectives — G improves by fooling D, D improves by catching G</text>
</svg>