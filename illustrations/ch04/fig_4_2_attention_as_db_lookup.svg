<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Attention as Soft Database Lookup</text>
  <text x="410" y="46" text-anchor="middle" font-size="10" fill="#64748b">From hard retrieval to differentiable soft attention over all entries</text>

  <!-- Hard Lookup (Left) -->
  <rect x="30" y="70" width="350" height="280" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="205" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Hard Lookup (Dictionary)</text>

  <!-- Query -->
  <rect x="55" y="120" width="80" height="35" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="95" y="142" text-anchor="middle" font-size="9" font-weight="bold" fill="#831843">Query q</text>

  <!-- Key-Value pairs -->
  <rect x="180" y="110" width="180" height="140" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="270" y="130" text-anchor="middle" font-size="9" font-weight="bold" fill="#475569">Key-Value Store</text>

  <rect x="195" y="140" width="65" height="25" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="227" y="157" text-anchor="middle" font-size="7" fill="#0c4a6e">k₁</text>
  <rect x="270" y="140" width="75" height="25" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="307" y="157" text-anchor="middle" font-size="7" fill="#14532d">v₁</text>

  <rect x="195" y="170" width="65" height="25" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="227" y="187" text-anchor="middle" font-size="7" font-weight="bold" fill="#0c4a6e">k₂ ✓</text>
  <rect x="270" y="170" width="75" height="25" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="307" y="187" text-anchor="middle" font-size="7" font-weight="bold" fill="#14532d">v₂ ←</text>

  <rect x="195" y="200" width="65" height="25" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="227" y="217" text-anchor="middle" font-size="7" fill="#0c4a6e">k₃</text>
  <rect x="270" y="200" width="75" height="25" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="307" y="217" text-anchor="middle" font-size="7" fill="#14532d">v₃</text>

  <!-- Arrow from query to match -->
  <line x1="135" y1="137" x2="192" y2="182" stroke="#db2777" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="155" y="155" font-size="7" fill="#db2777">exact match</text>

  <!-- Result -->
  <text x="205" y="270" text-anchor="middle" font-size="9" fill="#475569">Output = v₂ (single value)</text>
  <text x="205" y="290" text-anchor="middle" font-size="8" fill="#64748b">Non-differentiable — argmax selection</text>
  <text x="205" y="310" text-anchor="middle" font-size="8" fill="#64748b" font-family="'SF Mono', Consolas, monospace">output = V[argmax_k match(q, k)]</text>

  <!-- Soft Lookup (Right) -->
  <rect x="420" y="70" width="370" height="280" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="605" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">Soft Attention (Transformer)</text>

  <!-- Query -->
  <rect x="445" y="120" width="80" height="35" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="485" y="142" text-anchor="middle" font-size="9" font-weight="bold" fill="#831843">Query q</text>

  <!-- Key-Value pairs with weights -->
  <rect x="570" y="110" width="200" height="140" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="670" y="130" text-anchor="middle" font-size="9" font-weight="bold" fill="#475569">Key-Value Store</text>

  <!-- Weighted entries -->
  <rect x="585" y="140" width="50" height="25" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="610" y="157" text-anchor="middle" font-size="7" fill="#0c4a6e">k₁</text>
  <rect x="640" y="140" width="55" height="25" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="667" y="157" text-anchor="middle" font-size="7" fill="#14532d">v₁</text>
  <text x="710" y="157" font-size="8" fill="#d97706" font-weight="bold">0.1</text>

  <rect x="585" y="170" width="50" height="25" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="610" y="187" text-anchor="middle" font-size="7" font-weight="bold" fill="#0c4a6e">k₂</text>
  <rect x="640" y="170" width="55" height="25" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="667" y="187" text-anchor="middle" font-size="7" font-weight="bold" fill="#14532d">v₂</text>
  <text x="710" y="187" font-size="8" fill="#d97706" font-weight="bold">0.7</text>

  <rect x="585" y="200" width="50" height="25" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="610" y="217" text-anchor="middle" font-size="7" fill="#0c4a6e">k₃</text>
  <rect x="640" y="200" width="55" height="25" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="667" y="217" text-anchor="middle" font-size="7" fill="#14532d">v₃</text>
  <text x="710" y="217" font-size="8" fill="#d97706" font-weight="bold">0.2</text>

  <!-- Arrows from query to all keys -->
  <line x1="525" y1="133" x2="582" y2="152" stroke="#db2777" stroke-width="1" marker-end="url(#a)"/>
  <line x1="525" y1="137" x2="582" y2="182" stroke="#db2777" stroke-width="2" marker-end="url(#a)"/>
  <line x1="525" y1="142" x2="582" y2="212" stroke="#db2777" stroke-width="1" marker-end="url(#a)"/>
  <text x="540" y="165" font-size="7" fill="#db2777">similarity</text>
  <text x="540" y="178" font-size="7" fill="#db2777">scores</text>

  <!-- Softmax annotation -->
  <text x="745" y="155" font-size="7" fill="#d97706">softmax</text>
  <text x="745" y="168" font-size="7" fill="#d97706">weights</text>
  <text x="745" y="181" font-size="7" fill="#d97706">α = 1.0</text>

  <!-- Result -->
  <text x="605" y="270" text-anchor="middle" font-size="9" fill="#14532d">Output = 0.1·v₁ + 0.7·v₂ + 0.2·v₃</text>
  <text x="605" y="290" text-anchor="middle" font-size="8" fill="#64748b">Differentiable — weighted sum of all values</text>
  <text x="605" y="310" text-anchor="middle" font-size="8" fill="#64748b" font-family="'SF Mono', Consolas, monospace">output = Σ softmax(qᵀk/√d) · v</text>

  <!-- Bottom equation -->
  <rect x="130" y="365" width="560" height="30" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="410" y="385" text-anchor="middle" font-size="9" fill="#78350f" font-family="'SF Mono', Consolas, monospace">Attention(Q, K, V) = softmax(QKᵀ / √d_k) V</text>
</svg>