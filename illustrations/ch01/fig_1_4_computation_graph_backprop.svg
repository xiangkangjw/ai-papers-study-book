<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="af" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/></marker>
  </defs>

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Computation Graph &amp; Backpropagation</text>

  <!-- Forward Pass Label -->
  <rect x="30" y="55" width="140" height="24" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="100" y="71" text-anchor="middle" font-size="10" font-weight="bold" fill="#0284c7">→ Forward Pass</text>

  <!-- Backward Pass Label -->
  <rect x="200" y="55" width="160" height="24" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="280" y="71" text-anchor="middle" font-size="10" font-weight="bold" fill="#ef4444">← Backward Pass (∇)</text>

  <!-- ===== Forward Pass Nodes ===== -->
  <!-- x -->
  <rect x="30" y="160" width="80" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="70" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">x</text>
  <text x="70" y="200" text-anchor="middle" font-size="8" fill="#64748b">input</text>

  <!-- w -->
  <rect x="30" y="280" width="80" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="70" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350f">w</text>
  <text x="70" y="320" text-anchor="middle" font-size="8" fill="#d97706">weight</text>

  <!-- Multiply node -->
  <circle cx="210" cy="230" r="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="210" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">×</text>
  <text x="210" y="244" text-anchor="middle" font-size="8" fill="#0284c7">z = wx</text>

  <!-- b -->
  <rect x="240" y="320" width="80" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350f">b</text>
  <text x="280" y="360" text-anchor="middle" font-size="8" fill="#d97706">bias</text>

  <!-- Add node -->
  <circle cx="370" cy="270" r="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="370" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">+</text>
  <text x="370" y="284" text-anchor="middle" font-size="8" fill="#0284c7">a = z+b</text>

  <!-- ReLU node -->
  <circle cx="520" cy="270" r="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="520" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">ReLU</text>
  <text x="520" y="282" text-anchor="middle" font-size="8" fill="#0284c7">h=max(0,a)</text>

  <!-- Loss node -->
  <circle cx="670" cy="270" r="35" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="670" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">Loss</text>
  <text x="670" y="282" text-anchor="middle" font-size="8" fill="#16a34a">L(h, y)</text>

  <!-- Forward arrows (blue) -->
  <line x1="110" y1="185" x2="182" y2="218" stroke="#0284c7" stroke-width="2" marker-end="url(#af)"/>
  <line x1="110" y1="305" x2="182" y2="242" stroke="#0284c7" stroke-width="2" marker-end="url(#af)"/>
  <line x1="240" y1="235" x2="340" y2="265" stroke="#0284c7" stroke-width="2" marker-end="url(#af)"/>
  <line x1="310" y1="325" x2="345" y2="293" stroke="#0284c7" stroke-width="2" marker-end="url(#af)"/>
  <line x1="400" y1="270" x2="488" y2="270" stroke="#0284c7" stroke-width="2" marker-end="url(#af)"/>
  <line x1="550" y1="270" x2="633" y2="270" stroke="#0284c7" stroke-width="2" marker-end="url(#af)"/>

  <!-- ===== Backward Pass (red arrows, offset above forward path) ===== -->
  <!-- ∂L/∂h -->
  <line x1="635" y1="250" x2="555" y2="250" stroke="#ef4444" stroke-width="2" marker-end="url(#ab)"/>
  <text x="595" y="243" text-anchor="middle" font-size="7" font-weight="bold" fill="#ef4444">∂L/∂h</text>

  <!-- ∂L/∂a = ∂L/∂h · ∂h/∂a -->
  <line x1="490" y1="252" x2="405" y2="252" stroke="#ef4444" stroke-width="2" marker-end="url(#ab)"/>
  <text x="448" y="245" text-anchor="middle" font-size="6" fill="#ef4444">∂L/∂h · 1[a&gt;0]</text>

  <!-- ∂L/∂z -->
  <line x1="340" y1="255" x2="243" y2="220" stroke="#ef4444" stroke-width="2" marker-end="url(#ab)"/>
  <text x="305" y="228" text-anchor="middle" font-size="6" fill="#ef4444">∂L/∂a · 1</text>

  <!-- ∂L/∂w = ∂L/∂z · x (KEY PATH) -->
  <line x1="188" y1="252" x2="115" y2="285" stroke="#ef4444" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="170" y="278" font-size="7" font-weight="bold" fill="#ef4444">∂L/∂w</text>

  <!-- ∂L/∂x -->
  <line x1="188" y1="208" x2="115" y2="188" stroke="#ef4444" stroke-width="2" marker-end="url(#ab)"/>
  <text x="160" y="190" font-size="6" fill="#ef4444">∂z/∂x · w</text>

  <!-- ∂L/∂b -->
  <line x1="352" y1="296" x2="322" y2="322" stroke="#ef4444" stroke-width="2" marker-end="url(#ab)"/>
  <text x="348" y="318" font-size="6" fill="#ef4444">∂L/∂a</text>

  <!-- Chain Rule Explanation Box -->
  <rect x="80" y="400" width="660" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="410" y="420" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Chain Rule (Reverse-Mode Autodiff)</text>
  <text x="410" y="440" text-anchor="middle" font-size="10" fill="#334155" font-family="'SF Mono', Consolas, monospace">∂L/∂w = ∂L/∂h · ∂h/∂a · ∂a/∂z · ∂z/∂w</text>
  <text x="410" y="460" text-anchor="middle" font-size="10" fill="#64748b" font-family="'SF Mono', Consolas, monospace">     = ∂L/∂h · 1[a>0] · 1    · x</text>
  <text x="410" y="485" text-anchor="middle" font-size="9" fill="#64748b">One backward pass computes ALL gradients simultaneously (O(N) vs O(N²) for forward-mode)</text>
</svg>