<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">RETRO: Retrieval-Enhanced Transformer</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Borgeaud et al. (2022) — Chunked cross-attention to retrieved neighbors at specific layers</text>

  <!-- Input sequence chunking -->
  <rect x="30" y="65" width="800" height="60" rx="8" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="60" y="85" font-size="11" font-weight="bold" fill="#1a1a2e">Input: Split into chunks of m=64 tokens</text>

  <rect x="60" y="95" width="100" height="22" rx="3" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="110" y="110" text-anchor="middle" font-size="11" fill="#4a7fb5">Chunk 1 (C₁)</text>

  <rect x="170" y="95" width="100" height="22" rx="3" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="220" y="110" text-anchor="middle" font-size="11" fill="#4a7fb5">Chunk 2 (C₂)</text>

  <rect x="280" y="95" width="100" height="22" rx="3" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="330" y="110" text-anchor="middle" font-size="11" fill="#4a7fb5">Chunk 3 (C₃)</text>

  <text x="400" y="110" font-size="11" fill="#c0c0c8">···</text>

  <rect x="430" y="95" width="100" height="22" rx="3" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="480" y="110" text-anchor="middle" font-size="11" fill="#4a7fb5">Chunk l (C_l)</text>

  <!-- Retrieval -->
  <rect x="550" y="72" width="260" height="48" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="680" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Retrieval: k nearest neighbors per chunk</text>
  <text x="680" y="108" text-anchor="middle" font-size="11" fill="#d4a03c">from 2T token database via frozen BERT embeddings</text>

  <!-- Main transformer stack -->
  <rect x="30" y="140" width="500" height="290" rx="10" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="2"/>
  <text x="280" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">RETRO Transformer Stack</text>

  <!-- Standard layers -->
  <rect x="60" y="380" width="440" height="30" rx="4" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#7b68a8">Standard Transformer Layer (Self-Attention + FFN)</text>

  <line x1="280" y1="380" x2="280" y2="368" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="60" y="340" width="440" height="26" rx="4" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="280" y="357" text-anchor="middle" font-size="11" fill="#7b68a8">Standard Transformer Layer</text>

  <line x1="280" y1="340" x2="280" y2="328" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="60" y="300" width="440" height="26" rx="4" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="280" y="317" text-anchor="middle" font-size="11" fill="#7b68a8">Standard Transformer Layer</text>

  <line x1="280" y1="300" x2="280" y2="288" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- CCA Layer -->
  <rect x="60" y="250" width="440" height="36" rx="6" fill="#f6e4e3" stroke="#d4645c" stroke-width="2.5"/>
  <text x="280" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Chunked Cross-Attention (CCA) Layer</text>

  <line x1="280" y1="250" x2="280" y2="238" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- More standard layers -->
  <rect x="60" y="210" width="440" height="26" rx="4" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="280" y="227" text-anchor="middle" font-size="11" fill="#7b68a8">Standard Transformer Layer</text>

  <line x1="280" y1="210" x2="280" y2="198" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="280" y="195" text-anchor="middle" font-size="11" fill="#c0c0c8">···</text>

  <line x1="280" y1="190" x2="280" y2="180" stroke="#4a4a5a" stroke-width="1"/>

  <!-- Output -->
  <rect x="180" y="148" width="200" height="28" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="280" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Output predictions</text>

  <!-- CCA detail (right side) -->
  <rect x="555" y="140" width="275" height="200" rx="10" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="692" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">CCA Detail (per chunk)</text>

  <!-- Retrieved neighbors encoding -->
  <rect x="575" y="180" width="110" height="50" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="630" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Neighbor Encoder</text>
  <text x="630" y="215" text-anchor="middle" font-size="11" fill="#d4a03c">bi-directional attn</text>
  <text x="630" y="225" text-anchor="middle" font-size="11" fill="#d4a03c">over k neighbors</text>

  <!-- Chunk hidden states -->
  <rect x="700" y="180" width="110" height="50" rx="6" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="755" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Chunk hidden H(C_u)</text>
  <text x="755" y="215" text-anchor="middle" font-size="11" fill="#4a7fb5">from prev layer</text>

  <!-- Cross-attention -->
  <line x1="630" y1="230" x2="692" y2="250" stroke="#d4a03c" stroke-width="1.5"/>
  <line x1="755" y1="230" x2="692" y2="250" stroke="#4a7fb5" stroke-width="1.5"/>

  <rect x="625" y="252" width="135" height="40" rx="6" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="692" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Cross-Attention</text>
  <text x="692" y="282" text-anchor="middle" font-size="11" fill="#d4645c" font-family="'JetBrains Mono', 'Fira Code', monospace">Q=H(C_u), K,V=neighbors</text>

  <line x1="692" y1="292" x2="692" y2="310" stroke="#d4645c" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="640" y="312" width="105" height="22" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="692" y="327" text-anchor="middle" font-size="11" fill="#3a9e8f">Updated H(C_u)</text>

  <!-- Retrieval arrow from chunks to CCA -->
  <line x1="480" y1="110" x2="555" y2="85" stroke="#d4a03c" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M630,140 L630,130 Q630,125 500,268" fill="none" stroke="#d4a03c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>

  <!-- Key properties -->
  <rect x="555" y="355" width="275" height="80" rx="8" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="692" y="378" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Key Properties</text>
  <text x="575" y="398" font-size="11" fill="#3a3a4a">CCA at layers {6, 12, 18, ...} only (sparse)</text>
  <text x="575" y="413" font-size="11" fill="#3a3a4a">7.5B params matches 25x larger model on perplexity</text>
  <text x="575" y="428" font-size="11" fill="#3a9e8f">Database updatable without retraining</text>
</svg>