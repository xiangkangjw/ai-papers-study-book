<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Inter, Helvetica, Arial, sans-serif">
  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">GAN vs VAE: Complementary Approaches</text>
  <text x="430" y="46" text-anchor="middle" font-size="10" fill="#64748b">Sharp samples (GAN) vs smooth latent space (VAE) — different tradeoffs</text>

  <!-- VAE column -->
  <rect x="30" y="65" width="380" height="390" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="220" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#0c4a6e">VAE (Chapter 2)</text>

  <!-- VAE architecture mini -->
  <rect x="55" y="110" width="60" height="35" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="85" y="132" text-anchor="middle" font-size="8" fill="#0f172a">x</text>
  <rect x="135" y="110" width="70" height="35" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="170" y="132" text-anchor="middle" font-size="8" fill="#0c4a6e">Encoder</text>
  <rect x="225" y="110" width="50" height="35" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="250" y="132" text-anchor="middle" font-size="8" fill="#14532d">z</text>
  <rect x="295" y="110" width="70" height="35" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="330" y="132" text-anchor="middle" font-size="8" fill="#831843">Decoder</text>

  <!-- VAE properties -->
  <rect x="50" y="165" width="340" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="70" y="182" font-size="9" fill="#14532d">✓</text>
  <text x="85" y="182" font-size="9" fill="#14532d" font-weight="bold">Explicit density</text>
  <text x="85" y="198" font-size="8" fill="#334155">ELBO bound on log p(x) — principled training</text>

  <rect x="50" y="215" width="340" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="70" y="232" font-size="9" fill="#14532d">✓</text>
  <text x="85" y="232" font-size="9" fill="#14532d" font-weight="bold">Smooth latent space</text>
  <text x="85" y="248" font-size="8" fill="#334155">Interpolation, disentanglement, representation learning</text>

  <rect x="50" y="265" width="340" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="70" y="282" font-size="9" fill="#14532d">✓</text>
  <text x="85" y="282" font-size="9" fill="#14532d" font-weight="bold">Stable training</text>
  <text x="85" y="298" font-size="8" fill="#334155">No adversarial dynamics — straightforward optimization</text>

  <rect x="50" y="315" width="340" height="40" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="70" y="332" font-size="9" fill="#ef4444">✗</text>
  <text x="85" y="332" font-size="9" fill="#ef4444" font-weight="bold">Blurry outputs</text>
  <text x="85" y="348" font-size="8" fill="#334155">Pixel-wise reconstruction loss averages modes</text>

  <rect x="50" y="365" width="340" height="40" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="70" y="382" font-size="9" fill="#ef4444">✗</text>
  <text x="85" y="382" font-size="9" fill="#ef4444" font-weight="bold">Posterior collapse risk</text>
  <text x="85" y="398" font-size="8" fill="#334155">Powerful decoder may ignore latent code</text>

  <!-- GAN column -->
  <rect x="450" y="65" width="380" height="390" rx="10" fill="#fef2f2" stroke="#db2777" stroke-width="2"/>
  <text x="640" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#831843">GAN (Chapter 3)</text>

  <!-- GAN architecture mini -->
  <rect x="475" y="110" width="50" height="35" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="500" y="132" text-anchor="middle" font-size="8" fill="#581c87">z</text>
  <rect x="545" y="110" width="70" height="35" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="580" y="132" text-anchor="middle" font-size="8" fill="#14532d">G</text>
  <rect x="635" y="110" width="50" height="35" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="660" y="132" text-anchor="middle" font-size="8" fill="#831843">G(z)</text>
  <rect x="705" y="110" width="70" height="35" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="740" y="132" text-anchor="middle" font-size="8" fill="#78350f">D</text>

  <!-- GAN properties -->
  <rect x="470" y="165" width="340" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="490" y="182" font-size="9" fill="#14532d">✓</text>
  <text x="505" y="182" font-size="9" fill="#14532d" font-weight="bold">Sharp, realistic samples</text>
  <text x="505" y="198" font-size="8" fill="#334155">Adversarial loss drives perceptual quality</text>

  <rect x="470" y="215" width="340" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="490" y="232" font-size="9" fill="#14532d">✓</text>
  <text x="505" y="232" font-size="9" fill="#14532d" font-weight="bold">No explicit density needed</text>
  <text x="505" y="248" font-size="8" fill="#334155">Implicit model — learn to sample directly</text>

  <rect x="470" y="265" width="340" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="490" y="282" font-size="9" fill="#14532d">✓</text>
  <text x="505" y="282" font-size="9" fill="#14532d" font-weight="bold">Fast generation</text>
  <text x="505" y="298" font-size="8" fill="#334155">Single forward pass through G (no iterative sampling)</text>

  <rect x="470" y="315" width="340" height="40" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="490" y="332" font-size="9" fill="#ef4444">✗</text>
  <text x="505" y="332" font-size="9" fill="#ef4444" font-weight="bold">Mode collapse</text>
  <text x="505" y="348" font-size="8" fill="#334155">G may only cover subset of data distribution</text>

  <rect x="470" y="365" width="340" height="40" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="490" y="382" font-size="9" fill="#ef4444">✗</text>
  <text x="505" y="382" font-size="9" fill="#ef4444" font-weight="bold">Training instability</text>
  <text x="505" y="398" font-size="8" fill="#334155">Minimax game — requires careful balancing G vs D</text>

  <!-- Bottom: modern convergence -->
  <rect x="130" y="452" width="600" height="22" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="430" y="468" text-anchor="middle" font-size="9" fill="#78350f">Modern trend: VAE-GAN hybrids (e.g., VQGAN) combine discrete latent spaces with adversarial losses for best of both</text>
</svg>