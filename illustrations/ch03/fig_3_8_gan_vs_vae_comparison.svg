<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Inter, Helvetica, Arial, sans-serif">
  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">GAN vs VAE: Complementary Approaches</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Sharp samples (GAN) vs smooth latent space (VAE) — different tradeoffs</text>

  <!-- VAE column -->
  <rect x="30" y="65" width="380" height="390" rx="10" fill="#edf2f8" stroke="#4a7fb5" stroke-width="2"/>
  <text x="220" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7fb5">VAE (Chapter 2)</text>

  <!-- VAE architecture mini -->
  <rect x="55" y="110" width="60" height="35" rx="4" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="85" y="132" text-anchor="middle" font-size="11" fill="#1a1a2e">x</text>
  <rect x="135" y="110" width="70" height="35" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="170" y="132" text-anchor="middle" font-size="11" fill="#4a7fb5">Encoder</text>
  <rect x="225" y="110" width="50" height="35" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="250" y="132" text-anchor="middle" font-size="11" fill="#3a9e8f">z</text>
  <rect x="295" y="110" width="70" height="35" rx="4" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="330" y="132" text-anchor="middle" font-size="11" fill="#d4645c">Decoder</text>

  <!-- VAE properties -->
  <rect x="50" y="165" width="340" height="40" rx="5" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="70" y="182" font-size="11" fill="#3a9e8f">✓</text>
  <text x="85" y="182" font-size="11" fill="#3a9e8f" font-weight="bold">Explicit density</text>
  <text x="85" y="198" font-size="11" fill="#3a3a4a">ELBO bound on log p(x) — principled training</text>

  <rect x="50" y="215" width="340" height="40" rx="5" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="70" y="232" font-size="11" fill="#3a9e8f">✓</text>
  <text x="85" y="232" font-size="11" fill="#3a9e8f" font-weight="bold">Smooth latent space</text>
  <text x="85" y="248" font-size="11" fill="#3a3a4a">Interpolation, disentanglement, representation learning</text>

  <rect x="50" y="265" width="340" height="40" rx="5" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="70" y="282" font-size="11" fill="#3a9e8f">✓</text>
  <text x="85" y="282" font-size="11" fill="#3a9e8f" font-weight="bold">Stable training</text>
  <text x="85" y="298" font-size="11" fill="#3a3a4a">No adversarial dynamics — straightforward optimization</text>

  <rect x="50" y="315" width="340" height="40" rx="5" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="70" y="332" font-size="11" fill="#d4645c">✗</text>
  <text x="85" y="332" font-size="11" fill="#d4645c" font-weight="bold">Blurry outputs</text>
  <text x="85" y="348" font-size="11" fill="#3a3a4a">Pixel-wise reconstruction loss averages modes</text>

  <rect x="50" y="365" width="340" height="40" rx="5" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="70" y="382" font-size="11" fill="#d4645c">✗</text>
  <text x="85" y="382" font-size="11" fill="#d4645c" font-weight="bold">Posterior collapse risk</text>
  <text x="85" y="398" font-size="11" fill="#3a3a4a">Powerful decoder may ignore latent code</text>

  <!-- GAN column -->
  <rect x="450" y="65" width="380" height="390" rx="10" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="640" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#d4645c">GAN (Chapter 3)</text>

  <!-- GAN architecture mini -->
  <rect x="475" y="110" width="50" height="35" rx="4" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="500" y="132" text-anchor="middle" font-size="11" fill="#7b68a8">z</text>
  <rect x="545" y="110" width="70" height="35" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="580" y="132" text-anchor="middle" font-size="11" fill="#3a9e8f">G</text>
  <rect x="635" y="110" width="50" height="35" rx="4" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="660" y="132" text-anchor="middle" font-size="11" fill="#d4645c">G(z)</text>
  <rect x="705" y="110" width="70" height="35" rx="4" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="740" y="132" text-anchor="middle" font-size="11" fill="#d4a03c">D</text>

  <!-- GAN properties -->
  <rect x="470" y="165" width="340" height="40" rx="5" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="490" y="182" font-size="11" fill="#3a9e8f">✓</text>
  <text x="505" y="182" font-size="11" fill="#3a9e8f" font-weight="bold">Sharp, realistic samples</text>
  <text x="505" y="198" font-size="11" fill="#3a3a4a">Adversarial loss drives perceptual quality</text>

  <rect x="470" y="215" width="340" height="40" rx="5" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="490" y="232" font-size="11" fill="#3a9e8f">✓</text>
  <text x="505" y="232" font-size="11" fill="#3a9e8f" font-weight="bold">No explicit density needed</text>
  <text x="505" y="248" font-size="11" fill="#3a3a4a">Implicit model — learn to sample directly</text>

  <rect x="470" y="265" width="340" height="40" rx="5" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="490" y="282" font-size="11" fill="#3a9e8f">✓</text>
  <text x="505" y="282" font-size="11" fill="#3a9e8f" font-weight="bold">Fast generation</text>
  <text x="505" y="298" font-size="11" fill="#3a3a4a">Single forward pass through G (no iterative sampling)</text>

  <rect x="470" y="315" width="340" height="40" rx="5" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="490" y="332" font-size="11" fill="#d4645c">✗</text>
  <text x="505" y="332" font-size="11" fill="#d4645c" font-weight="bold">Mode collapse</text>
  <text x="505" y="348" font-size="11" fill="#3a3a4a">G may only cover subset of data distribution</text>

  <rect x="470" y="365" width="340" height="40" rx="5" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="490" y="382" font-size="11" fill="#d4645c">✗</text>
  <text x="505" y="382" font-size="11" fill="#d4645c" font-weight="bold">Training instability</text>
  <text x="505" y="398" font-size="11" fill="#3a3a4a">Minimax game — requires careful balancing G vs D</text>

  <!-- Bottom: modern convergence -->
  <rect x="130" y="452" width="600" height="22" rx="5" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="430" y="468" text-anchor="middle" font-size="11" fill="#d4a03c">Modern trend: VAE-GAN hybrids (e.g., VQGAN) combine discrete latent spaces with adversarial losses for best of both</text>
</svg>