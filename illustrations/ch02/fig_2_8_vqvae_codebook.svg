<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">VQ-VAE: Vector Quantized Variational Autoencoder</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">van den Oord et al. (2017) — Discrete latent space via codebook lookup</text>

  <!-- Input -->
  <rect x="20" y="85" width="90" height="60" rx="6" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="2"/>
  <text x="65" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Input x</text>
  <text x="65" y="132" text-anchor="middle" font-size="11" fill="#7a7a8a">image</text>

  <line x1="110" y1="115" x2="138" y2="115" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Encoder -->
  <rect x="140" y="80" width="100" height="70" rx="8" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="190" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Encoder</text>
  <text x="190" y="130" text-anchor="middle" font-size="11" fill="#4a7fb5" font-family="'JetBrains Mono', 'Fira Code', monospace">z_e(x) ∈ ℝ^d</text>
  <text x="190" y="145" text-anchor="middle" font-size="11" fill="#4a7fb5">continuous</text>

  <line x1="240" y1="115" x2="268" y2="115" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Quantization (nearest codebook) -->
  <rect x="270" y="72" width="160" height="86" rx="8" fill="#f5ece0" stroke="#d4a03c" stroke-width="2.5"/>
  <text x="350" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Quantize</text>
  <text x="350" y="115" text-anchor="middle" font-size="11" fill="#d4a03c">Find nearest codebook vector:</text>
  <text x="350" y="133" text-anchor="middle" font-size="11" fill="#d4a03c" font-family="'JetBrains Mono', 'Fira Code', monospace">z_q = e_k where</text>
  <text x="350" y="150" text-anchor="middle" font-size="11" fill="#d4a03c" font-family="'JetBrains Mono', 'Fira Code', monospace">k = argmin ‖z_e - e_j‖</text>

  <line x1="430" y1="115" x2="458" y2="115" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Discrete latent -->
  <rect x="460" y="85" width="90" height="60" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="505" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">z_q</text>
  <text x="505" y="130" text-anchor="middle" font-size="11" fill="#3a9e8f">discrete</text>

  <line x1="550" y1="115" x2="578" y2="115" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Decoder -->
  <rect x="580" y="80" width="100" height="70" rx="8" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="630" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Decoder</text>
  <text x="630" y="130" text-anchor="middle" font-size="11" fill="#d4645c">Reconstruct from z_q</text>

  <line x1="680" y1="115" x2="708" y2="115" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Output -->
  <rect x="710" y="85" width="90" height="60" rx="6" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="2"/>
  <text x="755" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">x̂</text>
  <text x="755" y="132" text-anchor="middle" font-size="11" fill="#7a7a8a">reconstruction</text>

  <!-- Codebook (below) -->
  <rect x="220" y="190" width="360" height="90" rx="8" fill="#faf5ee" stroke="#d4a03c" stroke-width="2"/>
  <text x="400" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Codebook E = {e₁, e₂, ..., e_K}</text>
  <text x="400" y="230" text-anchor="middle" font-size="11" fill="#d4a03c" font-family="'JetBrains Mono', 'Fira Code', monospace">K vectors, each ∈ ℝ^d (e.g., K=512, d=64)</text>

  <!-- Codebook vectors -->
  <rect x="240" y="240" width="40" height="25" rx="3" fill="#f5ece0" stroke="#d4a03c" stroke-width="1"/>
  <text x="260" y="257" text-anchor="middle" font-size="11" fill="#d4a03c">e₁</text>
  <rect x="290" y="240" width="40" height="25" rx="3" fill="#f5ece0" stroke="#d4a03c" stroke-width="1"/>
  <text x="310" y="257" text-anchor="middle" font-size="11" fill="#d4a03c">e₂</text>
  <rect x="340" y="240" width="40" height="25" rx="3" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="360" y="257" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">e_k</text>
  <text x="395" y="257" text-anchor="middle" font-size="11" fill="#c0c0c8">···</text>
  <rect x="415" y="240" width="40" height="25" rx="3" fill="#f5ece0" stroke="#d4a03c" stroke-width="1"/>
  <text x="435" y="257" text-anchor="middle" font-size="11" fill="#d4a03c">e_K</text>

  <!-- Arrow from codebook to quantize -->
  <line x1="360" y1="190" x2="360" y2="160" stroke="#d4a03c" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="375" y="178" font-size="11" fill="#d4a03c">nearest</text>

  <!-- Straight-through estimator -->
  <rect x="130" y="295" width="600" height="35" rx="6" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="1.5"/>
  <text x="430" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Straight-Through Estimator: ∇ passes through quantization as identity</text>
  <text x="430" y="325" text-anchor="middle" font-size="11" fill="#7a7a8a" font-family="'JetBrains Mono', 'Fira Code', monospace">L = ‖x - x̂‖² + ‖sg[z_e] - e_k‖² + β·‖z_e - sg[e_k]‖²</text>
</svg>