<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">S-LoRA: Serving Many LoRA Adapters Efficiently</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Sheng et al. (2023) — Unified memory management for thousands of concurrent LoRA adapters</text>

  <!-- Single base model -->
  <rect x="30" y="75" width="800" height="100" rx="10" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="2"/>
  <text x="430" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">Single Base Model in GPU Memory</text>

  <rect x="60" y="115" width="740" height="45" rx="6" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="2"/>
  <text x="430" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a4a5a">Frozen Base Weights (e.g., LLaMA-7B)</text>
  <text x="430" y="152" text-anchor="middle" font-size="11" fill="#c0c0c8">Loaded once — shared across all requests</text>

  <!-- Multiple adapters -->
  <rect x="30" y="195" width="800" height="100" rx="10" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="430" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">LoRA Adapter Pool (hot-swapped per request)</text>

  <rect x="55" y="230" width="95" height="50" rx="6" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="102" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Adapter A</text>
  <text x="102" y="264" text-anchor="middle" font-size="11" fill="#4a7fb5">chatbot</text>
  <text x="102" y="275" text-anchor="middle" font-size="11" fill="#c0c0c8" font-family="'JetBrains Mono', 'Fira Code', monospace">r=16, ~4MB</text>

  <rect x="165" y="230" width="95" height="50" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="212" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Adapter B</text>
  <text x="212" y="264" text-anchor="middle" font-size="11" fill="#3a9e8f">code gen</text>
  <text x="212" y="275" text-anchor="middle" font-size="11" fill="#c0c0c8" font-family="'JetBrains Mono', 'Fira Code', monospace">r=32, ~8MB</text>

  <rect x="275" y="230" width="95" height="50" rx="6" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="322" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Adapter C</text>
  <text x="322" y="264" text-anchor="middle" font-size="11" fill="#d4645c">medical QA</text>
  <text x="322" y="275" text-anchor="middle" font-size="11" fill="#c0c0c8" font-family="'JetBrains Mono', 'Fira Code', monospace">r=8, ~2MB</text>

  <rect x="385" y="230" width="95" height="50" rx="6" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="432" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b68a8">Adapter D</text>
  <text x="432" y="264" text-anchor="middle" font-size="11" fill="#7b68a8">summarize</text>
  <text x="432" y="275" text-anchor="middle" font-size="11" fill="#c0c0c8" font-family="'JetBrains Mono', 'Fira Code', monospace">r=16, ~4MB</text>

  <text x="510" y="258" font-size="16" fill="#c0c0c8">···</text>

  <rect x="550" y="235" width="100" height="40" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1"/>
  <text x="600" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">up to 1000s</text>
  <text x="600" y="268" text-anchor="middle" font-size="11" fill="#d4a03c">of adapters</text>

  <!-- Memory management -->
  <rect x="670" y="228" width="145" height="55" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="742" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Unified Paging</text>
  <text x="742" y="262" text-anchor="middle" font-size="11" fill="#3a3a4a">GPU ↔ CPU memory</text>
  <text x="742" y="274" text-anchor="middle" font-size="11" fill="#d4a03c">page in/out on demand</text>

  <!-- Key innovations -->
  <rect x="30" y="310" width="260" height="100" rx="8" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="160" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Batched LoRA Computation</text>
  <text x="50" y="355" font-size="11" fill="#3a3a4a">Custom CUDA kernels for batched</text>
  <text x="50" y="370" font-size="11" fill="#3a3a4a">LoRA matmul across different adapters</text>
  <text x="50" y="385" font-size="11" fill="#3a3a4a">in a single batch (heterogeneous ranks)</text>
  <text x="50" y="400" font-size="11" fill="#4a7fb5" font-family="'JetBrains Mono', 'Fira Code', monospace">y_i = x_i W₀ + x_i B_i A_i</text>

  <rect x="310" y="310" width="250" height="100" rx="8" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="435" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Tensor Parallelism</text>
  <text x="330" y="355" font-size="11" fill="#3a3a4a">Base model: standard tensor parallel</text>
  <text x="330" y="370" font-size="11" fill="#3a3a4a">LoRA A: partitioned across GPUs</text>
  <text x="330" y="385" font-size="11" fill="#3a3a4a">LoRA B: replicated (small)</text>
  <text x="330" y="400" font-size="11" fill="#3a9e8f">Minimal communication overhead</text>

  <rect x="580" y="310" width="250" height="100" rx="8" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="705" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Results</text>
  <text x="600" y="355" font-size="11" fill="#3a3a4a">Serve 2000 adapters on single GPU</text>
  <text x="600" y="370" font-size="11" fill="#3a3a4a">4x throughput vs. naive approach</text>
  <text x="600" y="385" font-size="11" fill="#3a3a4a">30x throughput vs. individual deployment</text>
  <text x="600" y="400" font-size="11" fill="#d4a03c">No quality loss — exact same outputs</text>
</svg>