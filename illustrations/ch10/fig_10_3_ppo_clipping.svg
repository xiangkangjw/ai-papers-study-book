<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ax" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">PPO: Clipped Surrogate Objective</text>
  <text x="430" y="46" text-anchor="middle" font-size="10" fill="#64748b">Schulman et al. (2017) — Prevent destructively large policy updates</text>

  <!-- ===== Plot: Positive Advantage (Left) ===== -->
  <rect x="20" y="65" width="400" height="280" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">A_t &gt; 0 (Good Action)</text>
  <text x="220" y="108" text-anchor="middle" font-size="9" fill="#16a34a">Goal: increase probability → push r_t up</text>

  <!-- Axes -->
  <line x1="70" y1="300" x2="390" y2="300" stroke="#475569" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="70" y1="300" x2="70" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="230" y="325" text-anchor="middle" font-size="9" fill="#475569">Probability Ratio r_t(θ) = π_θ / π_old</text>
  <text x="40" y="210" text-anchor="middle" font-size="9" fill="#475569" transform="rotate(-90 40 210)">Objective L</text>

  <!-- x-axis labels -->
  <line x1="70" y1="300" x2="70" y2="305" stroke="#475569" stroke-width="1"/>
  <text x="70" y="318" text-anchor="middle" font-size="7" fill="#94a3b8">0</text>
  <line x1="180" y1="300" x2="180" y2="305" stroke="#475569" stroke-width="1"/>
  <text x="180" y="318" text-anchor="middle" font-size="7" fill="#94a3b8">1</text>
  <line x1="300" y1="300" x2="300" y2="305" stroke="#475569" stroke-width="1"/>
  <text x="300" y="318" text-anchor="middle" font-size="7" fill="#94a3b8">1+ε</text>

  <!-- Unclipped line (dashed) -->
  <line x1="70" y1="280" x2="370" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="355" y="155" font-size="7" fill="#94a3b8">unclipped r·A</text>

  <!-- Clipped line (solid) -->
  <polyline points="70,280 300,196 370,196" fill="none" stroke="#16a34a" stroke-width="3"/>

  <!-- Clip boundary -->
  <line x1="300" y1="120" x2="300" y2="300" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="300" y="140" text-anchor="middle" font-size="8" font-weight="bold" fill="#ef4444">clip at 1+ε</text>

  <!-- Active region -->
  <rect x="72" y="198" width="226" height="100" rx="0" fill="#dcfce7" opacity="0.15"/>
  <text x="180" y="262" text-anchor="middle" font-size="8" fill="#16a34a" font-weight="bold">Gradient flows</text>

  <!-- Clipped region -->
  <rect x="302" y="198" width="66" height="100" rx="0" fill="#fee2e2" opacity="0.15"/>
  <text x="335" y="262" text-anchor="middle" font-size="8" fill="#ef4444" font-weight="bold">Clipped</text>
  <text x="335" y="275" text-anchor="middle" font-size="7" fill="#ef4444">∇ = 0</text>

  <!-- ===== Plot: Negative Advantage (Right) ===== -->
  <rect x="440" y="65" width="400" height="280" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="640" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">A_t &lt; 0 (Bad Action)</text>
  <text x="640" y="108" text-anchor="middle" font-size="9" fill="#ef4444">Goal: decrease probability → push r_t down</text>

  <!-- Axes -->
  <line x1="490" y1="300" x2="810" y2="300" stroke="#475569" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="490" y1="300" x2="490" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="650" y="325" text-anchor="middle" font-size="9" fill="#475569">Probability Ratio r_t(θ)</text>
  <text x="460" y="210" text-anchor="middle" font-size="9" fill="#475569" transform="rotate(-90 460 210)">Objective L</text>

  <!-- x-axis labels -->
  <line x1="490" y1="300" x2="490" y2="305" stroke="#475569" stroke-width="1"/>
  <text x="490" y="318" text-anchor="middle" font-size="7" fill="#94a3b8">0</text>
  <line x1="560" y1="300" x2="560" y2="305" stroke="#475569" stroke-width="1"/>
  <text x="560" y="318" text-anchor="middle" font-size="7" fill="#94a3b8">1-ε</text>
  <line x1="670" y1="300" x2="670" y2="305" stroke="#475569" stroke-width="1"/>
  <text x="670" y="318" text-anchor="middle" font-size="7" fill="#94a3b8">1</text>

  <!-- Unclipped line (dashed, negative slope since A<0 → r·A decreases) -->
  <line x1="490" y1="180" x2="790" y2="300" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="775" y="295" font-size="7" fill="#94a3b8">unclipped</text>

  <!-- Clipped line (solid) — flat below 1-ε then rises -->
  <polyline points="490,228 560,228 790,320" fill="none" stroke="#ef4444" stroke-width="3"/>

  <!-- Clip boundary -->
  <line x1="560" y1="120" x2="560" y2="300" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="560" y="140" text-anchor="middle" font-size="8" font-weight="bold" fill="#ef4444">clip at 1-ε</text>

  <!-- Clipped region -->
  <rect x="492" y="228" width="66" height="70" rx="0" fill="#fee2e2" opacity="0.15"/>
  <text x="525" y="268" text-anchor="middle" font-size="8" fill="#ef4444" font-weight="bold">Clipped</text>
  <text x="525" y="281" text-anchor="middle" font-size="7" fill="#ef4444">∇ = 0</text>

  <!-- Active region -->
  <rect x="562" y="230" width="226" height="68" rx="0" fill="#dcfce7" opacity="0.15"/>
  <text x="670" y="268" text-anchor="middle" font-size="8" fill="#16a34a" font-weight="bold">Gradient flows</text>

  <!-- ===== Equation ===== -->
  <rect x="100" y="365" width="660" height="100" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="430" y="390" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">PPO-Clip Objective</text>
  <text x="430" y="415" text-anchor="middle" font-size="10" fill="#0f172a" font-family="'SF Mono', Consolas, monospace">L^CLIP(θ) = E_t[min(r_t(θ)·A_t, clip(r_t(θ), 1-ε, 1+ε)·A_t)]</text>
  <text x="430" y="440" text-anchor="middle" font-size="9" fill="#64748b">ε = 0.1–0.2 typical  |  r_t = π_θ(a_t|s_t) / π_old(a_t|s_t)  |  A_t = advantage estimate</text>
  <text x="430" y="458" text-anchor="middle" font-size="8" fill="#d97706" font-weight="bold">The min() ensures we take the more conservative (pessimistic) bound in both cases</text>
</svg>