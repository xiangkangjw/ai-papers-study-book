    <rect x="130" y="55" width="50" height="45" rx="3" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
    <text x="155" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">−∞</text>
    <rect x="180" y="55" width="50" height="45" rx="3" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
