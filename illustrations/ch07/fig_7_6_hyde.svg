<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">HyDE: Hypothetical Document Embeddings</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Gao et al. (2022) — Generate a hypothetical answer, embed it, then retrieve similar real documents</text>

  <!-- Standard retrieval (top) -->
  <rect x="30" y="65" width="800" height="100" rx="10" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="430" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#b5454a">Standard Dense Retrieval (Problem: query-document mismatch)</text>

  <rect x="55" y="105" width="100" height="35" rx="4" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="105" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">"What causes</text>
  <text x="105" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">northern lights?"</text>

  <line x1="155" y1="122" x2="178" y2="122" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="180" y="105" width="80" height="35" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="220" y="127" text-anchor="middle" font-size="11" fill="#4a7fb5">Encode q</text>

  <line x1="260" y1="122" x2="283" y2="122" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="285" y="105" width="80" height="35" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="325" y="127" text-anchor="middle" font-size="11" fill="#4a7fb5">FAISS</text>

  <line x1="365" y1="122" x2="388" y2="122" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="390" y="100" width="250" height="45" rx="4" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="515" y="118" text-anchor="middle" font-size="11" fill="#d4645c">Short query ≠ long document style</text>
  <text x="515" y="133" text-anchor="middle" font-size="11" fill="#d4645c">Query: question form · Docs: declarative statements</text>

  <text x="700" y="122" text-anchor="middle" font-size="11" fill="#d4645c" font-weight="bold">Embedding gap!</text>

  <!-- HyDE pipeline -->
  <rect x="30" y="185" width="800" height="130" rx="10" fill="#edf7f5" stroke="#3a9e8f" stroke-width="2"/>
  <text x="430" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">HyDE: Bridge the Gap with a Hypothetical Document</text>

  <!-- Step 1: Query -->
  <rect x="50" y="225" width="90" height="40" rx="4" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="95" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">"What causes</text>
  <text x="95" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">northern lights?"</text>

  <line x1="140" y1="245" x2="158" y2="245" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 2: LLM generates hypothetical doc -->
  <rect x="160" y="218" width="160" height="55" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="240" y="237" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">LLM (InstructGPT)</text>
  <text x="240" y="252" text-anchor="middle" font-size="11" fill="#d4a03c">"Generate a passage that</text>
  <text x="240" y="264" text-anchor="middle" font-size="11" fill="#d4a03c">answers this question"</text>

  <line x1="320" y1="245" x2="338" y2="245" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Hypothetical document -->
  <rect x="340" y="220" width="150" height="50" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="415" y="237" text-anchor="middle" font-size="11" fill="#3a9e8f" font-weight="bold">Hypothetical Document:</text>
  <text x="415" y="250" text-anchor="middle" font-size="11" fill="#3a3a4a">"Aurora borealis is caused</text>
  <text x="415" y="261" text-anchor="middle" font-size="11" fill="#3a3a4a">by solar wind particles..."</text>

  <line x1="490" y1="245" x2="508" y2="245" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 3: Encode hypothetical doc -->
  <rect x="510" y="225" width="80" height="40" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="550" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Encode</text>
  <text x="550" y="255" text-anchor="middle" font-size="11" fill="#4a7fb5">hypothetical</text>

  <line x1="590" y1="245" x2="608" y2="245" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 4: FAISS -->
  <rect x="610" y="225" width="70" height="40" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="645" y="249" text-anchor="middle" font-size="11" fill="#4a7fb5">FAISS</text>

  <line x1="680" y1="245" x2="698" y2="245" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 5: Real documents -->
  <rect x="700" y="220" width="110" height="50" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="755" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Real docs!</text>
  <text x="755" y="255" text-anchor="middle" font-size="11" fill="#3a9e8f">doc-style → doc match</text>

  <!-- Annotation -->
  <text x="550" y="300" text-anchor="middle" font-size="11" fill="#3a9e8f" font-weight="bold">Document-style embedding matches document-style corpus → better retrieval!</text>

  <!-- Key insight -->
  <rect x="30" y="335" width="390" height="55" rx="8" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="225" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Key Insight</text>
  <text x="50" y="373" font-size="11" fill="#3a3a4a">Hypothetical doc may be factually wrong, but its</text>
  <text x="50" y="387" font-size="11" fill="#3a3a4a">embedding is close to real relevant docs in vector space</text>

  <!-- Advantages -->
  <rect x="440" y="335" width="390" height="55" rx="8" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="635" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Properties</text>
  <text x="460" y="373" font-size="11" fill="#3a3a4a">• Zero-shot: no training data or fine-tuning needed</text>
  <text x="460" y="387" font-size="11" fill="#3a3a4a">• Works with any encoder + any LLM</text>
</svg>