<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">DINO: Self-Distillation with No Labels</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Caron et al. (2021) — Knowledge distillation from a momentum teacher, no labels needed</text>

  <!-- Main architecture -->
  <rect x="30" y="65" width="800" height="260" rx="10" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="2"/>

  <!-- Input image -->
  <rect x="55" y="155" width="70" height="70" rx="6" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1.5"/>
  <text x="90" y="185" text-anchor="middle" font-size="11" fill="#4a4a5a">Input</text>
  <text x="90" y="198" text-anchor="middle" font-size="11" fill="#4a4a5a">image x</text>

  <!-- Augmentation arrows -->
  <line x1="125" y1="175" x2="165" y2="130" stroke="#4a7fb5" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="125" y1="205" x2="165" y2="240" stroke="#3a9e8f" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Global crop 1 (student) -->
  <rect x="168" y="108" width="55" height="48" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="195" y="128" text-anchor="middle" font-size="11" fill="#4a7fb5">global</text>
  <text x="195" y="140" text-anchor="middle" font-size="11" fill="#4a7fb5">crop 1</text>
  <text x="195" y="150" text-anchor="middle" font-size="11" fill="#4a7fb5">+ local crops</text>

  <!-- Global crop 2 (teacher) -->
  <rect x="168" y="220" width="55" height="48" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="195" y="240" text-anchor="middle" font-size="11" fill="#3a9e8f">global</text>
  <text x="195" y="252" text-anchor="middle" font-size="11" fill="#3a9e8f">crop 2</text>

  <!-- Student encoder -->
  <line x1="223" y1="132" x2="260" y2="132" stroke="#4a7fb5" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="263" y="98" width="130" height="70" rx="8" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2.5"/>
  <text x="328" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Student (ViT)</text>
  <text x="328" y="138" text-anchor="middle" font-size="11" fill="#3a3a4a">f_theta</text>
  <text x="328" y="155" text-anchor="middle" font-size="11" fill="#4a7fb5">Updated by gradient</text>

  <!-- Teacher encoder -->
  <line x1="223" y1="244" x2="260" y2="244" stroke="#3a9e8f" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="263" y="210" width="130" height="70" rx="8" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2.5"/>
  <text x="328" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Teacher (ViT)</text>
  <text x="328" y="250" text-anchor="middle" font-size="11" fill="#3a3a4a">f_xi</text>
  <text x="328" y="267" text-anchor="middle" font-size="11" fill="#3a9e8f">EMA of student</text>

  <!-- EMA arrow -->
  <path d="M263,210 Q240,190 263,168" fill="none" stroke="#d4a03c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="228" y="192" font-size="11" fill="#d4a03c">EMA</text>
  <text x="218" y="202" font-size="11" fill="#d4a03c" font-family="'JetBrains Mono', 'Fira Code', monospace">xi = m*xi + (1-m)*theta</text>

  <!-- Projection heads -->
  <line x1="393" y1="132" x2="425" y2="132" stroke="#4a7fb5" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="428" y="110" width="80" height="45" rx="6" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="468" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b68a8">Proj Head</text>
  <text x="468" y="145" text-anchor="middle" font-size="11" fill="#7b68a8">MLP + L2 norm</text>

  <line x1="393" y1="244" x2="425" y2="244" stroke="#3a9e8f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="428" y="222" width="80" height="45" rx="6" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="468" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b68a8">Proj Head</text>
  <text x="468" y="257" text-anchor="middle" font-size="11" fill="#7b68a8">MLP + L2 norm</text>

  <!-- Softmax outputs -->
  <line x1="508" y1="132" x2="540" y2="132" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="543" y="112" width="70" height="40" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="578" y="130" text-anchor="middle" font-size="11" fill="#4a7fb5">softmax</text>
  <text x="578" y="143" text-anchor="middle" font-size="11" fill="#4a7fb5" font-family="'JetBrains Mono', 'Fira Code', monospace">p_s = P_s/tau_s</text>

  <line x1="508" y1="244" x2="540" y2="244" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="543" y="224" width="70" height="40" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="578" y="242" text-anchor="middle" font-size="11" fill="#3a9e8f">softmax</text>
  <text x="578" y="255" text-anchor="middle" font-size="11" fill="#3a9e8f" font-family="'JetBrains Mono', 'Fira Code', monospace">p_t = P_t/tau_t</text>

  <!-- Centering on teacher -->
  <text x="578" y="275" text-anchor="middle" font-size="11" fill="#3a9e8f">+ centering (c)</text>

  <!-- Cross-entropy loss -->
  <line x1="613" y1="132" x2="680" y2="175" stroke="#4a7fb5" stroke-width="1.5"/>
  <line x1="613" y1="244" x2="680" y2="200" stroke="#3a9e8f" stroke-width="1.5"/>

  <rect x="660" y="165" width="140" height="50" rx="8" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="730" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Cross-Entropy</text>
  <text x="730" y="204" text-anchor="middle" font-size="11" fill="#d4645c" font-family="'JetBrains Mono', 'Fira Code', monospace">H(p_t, p_s)</text>

  <!-- Gradient back to student only -->
  <line x1="660" y1="185" x2="510" y2="140" stroke="#d4645c" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#a)"/>
  <text x="600" y="155" font-size="11" fill="#d4645c">gradient to student only</text>

  <!-- Label -->
  <text x="430" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Self-Distillation: Teacher = EMA of Student (no labels, no contrastive pairs)</text>

  <!-- Bottom: Emergent properties -->
  <rect x="30" y="340" width="390" height="100" rx="10" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="225" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Collapse Prevention</text>
  <text x="50" y="385" font-size="11" fill="#3a3a4a">1. Centering: subtract running mean of teacher output</text>
  <text x="50" y="402" font-size="11" fill="#3a3a4a">2. Sharpening: low teacher temperature (tau_t = 0.04)</text>
  <text x="50" y="419" font-size="11" fill="#3a3a4a">3. Momentum schedule: m = 0.996 → 1.0</text>
  <text x="50" y="436" font-size="11" fill="#d4a03c">Without these, both networks collapse to uniform output</text>

  <rect x="440" y="340" width="390" height="100" rx="10" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="635" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Emergent Properties</text>
  <text x="460" y="385" font-size="11" fill="#3a3a4a">Self-attention maps reveal object segmentation</text>
  <text x="460" y="402" font-size="11" fill="#3a3a4a">[CLS] token captures scene layout</text>
  <text x="460" y="419" font-size="11" fill="#3a3a4a">k-NN classifier on frozen features: 74.5% ImageNet</text>
  <text x="460" y="436" font-size="11" fill="#3a9e8f">No labels used — properties emerge from self-distillation</text>
</svg>