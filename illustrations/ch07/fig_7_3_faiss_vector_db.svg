<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">FAISS: Approximate Nearest Neighbor Search</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Johnson et al. (2019) — Efficient similarity search over billions of dense vectors</text>

  <!-- Exact vs Approximate -->
  <rect x="30" y="65" width="380" height="170" rx="10" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="220" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#b5454a">Brute Force (Exact)</text>

  <!-- Query dot all vectors -->
  <rect x="55" y="110" width="50" height="30" rx="4" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="80" y="129" text-anchor="middle" font-size="11" fill="#d4645c">query</text>

  <text x="125" y="130" font-size="11" fill="#4a4a5a">·</text>

  <rect x="140" y="100" width="120" height="80" rx="4" fill="#f6e4e3" stroke="#d4645c" stroke-width="1"/>
  <text x="200" y="125" text-anchor="middle" font-size="11" fill="#d4645c">All N vectors</text>
  <text x="200" y="145" text-anchor="middle" font-size="11" fill="#d4645c" font-family="'JetBrains Mono', 'Fira Code', monospace">N = 10⁹</text>
  <text x="200" y="162" text-anchor="middle" font-size="11" fill="#d4645c" font-family="'JetBrains Mono', 'Fira Code', monospace">d = 768</text>

  <text x="280" y="130" font-size="11" fill="#4a4a5a">→</text>

  <rect x="300" y="110" width="80" height="30" rx="4" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="340" y="129" text-anchor="middle" font-size="11" fill="#1a1a2e">top-k</text>

  <text x="220" y="205" text-anchor="middle" font-size="11" fill="#d4645c" font-family="'JetBrains Mono', 'Fira Code', monospace">O(N·d) — too slow for N &gt; 10⁶</text>
  <text x="220" y="225" text-anchor="middle" font-size="11" fill="#d4645c">1B vectors × 768d = hours per query</text>

  <!-- FAISS Approximate -->
  <rect x="450" y="65" width="380" height="170" rx="10" fill="#edf7f5" stroke="#3a9e8f" stroke-width="2"/>
  <text x="640" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">FAISS (Approximate)</text>

  <rect x="475" y="110" width="50" height="30" rx="4" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="500" y="129" text-anchor="middle" font-size="11" fill="#d4645c">query</text>

  <text x="545" y="130" font-size="11" fill="#4a4a5a">→</text>

  <!-- IVF clusters -->
  <rect x="560" y="100" width="120" height="80" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <circle cx="590" cy="125" r="12" fill="#3a9e8f" opacity="0.2" stroke="#3a9e8f" stroke-width="1"/>
  <circle cx="620" cy="140" r="15" fill="#3a9e8f" opacity="0.4" stroke="#3a9e8f" stroke-width="2"/>
  <circle cx="650" cy="120" r="10" fill="#3a9e8f" opacity="0.2" stroke="#3a9e8f" stroke-width="1"/>
  <circle cx="600" cy="160" r="11" fill="#3a9e8f" opacity="0.2" stroke="#3a9e8f" stroke-width="1"/>
  <text x="620" y="100" text-anchor="middle" font-size="11" fill="#3a9e8f">Search only nprobe</text>
  <text x="620" y="178" text-anchor="middle" font-size="11" fill="#3a9e8f">nearest clusters</text>

  <text x="695" y="130" font-size="11" fill="#4a4a5a">→</text>

  <rect x="710" y="110" width="80" height="30" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="750" y="129" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">top-k</text>

  <text x="640" y="205" text-anchor="middle" font-size="11" fill="#3a9e8f" font-family="'JetBrains Mono', 'Fira Code', monospace">O(nprobe · N/K · d) — 1000× faster</text>
  <text x="640" y="225" text-anchor="middle" font-size="11" fill="#3a9e8f">&gt;95% recall with proper tuning</text>

  <!-- Index types -->
  <rect x="30" y="255" width="800" height="90" rx="10" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="430" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Common FAISS Index Types</text>

  <rect x="50" y="295" width="170" height="38" rx="4" fill="#f5ece0" stroke="#d4a03c" stroke-width="1"/>
  <text x="135" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Flat (Exact)</text>
  <text x="135" y="325" text-anchor="middle" font-size="11" fill="#3a3a4a">Brute force, 100% recall</text>

  <rect x="235" y="295" width="170" height="38" rx="4" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="320" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">IVF (Inverted File)</text>
  <text x="320" y="325" text-anchor="middle" font-size="11" fill="#3a3a4a">K-means clusters → search subset</text>

  <rect x="420" y="295" width="195" height="38" rx="4" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="517" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">IVF + PQ (Product Quant)</text>
  <text x="517" y="325" text-anchor="middle" font-size="11" fill="#3a3a4a">Compress vectors 32×, sub-byte</text>

  <rect x="630" y="295" width="180" height="38" rx="4" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="720" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">HNSW (Graph)</text>
  <text x="720" y="325" text-anchor="middle" font-size="11" fill="#3a3a4a">Navigable small-world graph</text>

  <!-- RAG connection -->
  <rect x="30" y="365" width="800" height="85" rx="10" fill="#edf2f8" stroke="#4a7fb5" stroke-width="2"/>
  <text x="430" y="390" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Role in RAG Pipeline</text>

  <rect x="60" y="405" width="100" height="30" rx="4" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="110" y="424" text-anchor="middle" font-size="11" fill="#d4645c">Query embed</text>

  <line x1="160" y1="420" x2="183" y2="420" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="185" y="405" width="120" height="30" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="245" y="424" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">FAISS MIPS</text>

  <line x1="305" y1="420" x2="328" y2="420" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="330" y="405" width="90" height="30" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="375" y="424" text-anchor="middle" font-size="11" fill="#4a7fb5">top-k docs</text>

  <line x1="420" y1="420" x2="443" y2="420" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="445" y="405" width="120" height="30" rx="4" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="505" y="424" text-anchor="middle" font-size="11" fill="#d4a03c">Concat + LLM</text>

  <line x1="565" y1="420" x2="588" y2="420" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="590" y="405" width="80" height="30" rx="4" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="630" y="424" text-anchor="middle" font-size="11" fill="#1a1a2e">Answer</text>

  <text x="430" y="450" text-anchor="middle" font-size="11" fill="#7a7a8a">DPR uses FAISS Flat for dense retrieval; production systems use IVF+PQ for billion-scale corpora</text>
</svg>