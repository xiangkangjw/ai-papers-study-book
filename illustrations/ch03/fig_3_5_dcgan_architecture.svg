<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="460" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">DCGAN: Deep Convolutional GAN</text>
  <text x="460" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Radford et al. (2016) — Architectural guidelines for stable convolutional GANs</text>

  <!-- Generator -->
  <rect x="20" y="65" width="870" height="195" rx="10" fill="#edf7f5" stroke="#3a9e8f" stroke-width="2"/>
  <text x="460" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a9e8f">Generator G: z → image (fractional-strided convolutions)</text>

  <!-- z input -->
  <rect x="40" y="120" width="60" height="60" rx="4" fill="#e8e4f1" stroke="#7b68a8" stroke-width="2"/>
  <text x="70" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b68a8">z</text>
  <text x="70" y="162" text-anchor="middle" font-size="11" fill="#7b68a8" font-family="'JetBrains Mono', 'Fira Code', monospace">100×1</text>

  <line x1="100" y1="150" x2="125" y2="150" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Project & Reshape -->
  <rect x="128" y="110" width="80" height="80" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="168" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Project</text>
  <text x="168" y="153" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Reshape</text>
  <text x="168" y="170" text-anchor="middle" font-size="11" fill="#4a7fb5" font-family="'JetBrains Mono', 'Fira Code', monospace">4×4×1024</text>

  <line x1="208" y1="150" x2="233" y2="150" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ConvT 1 -->
  <rect x="236" y="115" width="90" height="70" rx="4" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="281" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">ConvT 5×5</text>
  <text x="281" y="151" text-anchor="middle" font-size="11" fill="#d4a03c">BN + ReLU</text>
  <text x="281" y="168" text-anchor="middle" font-size="11" fill="#d4a03c" font-family="'JetBrains Mono', 'Fira Code', monospace">8×8×512</text>

  <line x1="326" y1="150" x2="351" y2="150" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ConvT 2 -->
  <rect x="354" y="118" width="90" height="64" rx="4" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="399" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">ConvT 5×5</text>
  <text x="399" y="153" text-anchor="middle" font-size="11" fill="#d4a03c">BN + ReLU</text>
  <text x="399" y="168" text-anchor="middle" font-size="11" fill="#d4a03c" font-family="'JetBrains Mono', 'Fira Code', monospace">16×16×256</text>

  <line x1="444" y1="150" x2="469" y2="150" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ConvT 3 -->
  <rect x="472" y="122" width="90" height="56" rx="4" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="517" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">ConvT 5×5</text>
  <text x="517" y="155" text-anchor="middle" font-size="11" fill="#d4a03c">BN + ReLU</text>
  <text x="517" y="168" text-anchor="middle" font-size="11" fill="#d4a03c" font-family="'JetBrains Mono', 'Fira Code', monospace">32×32×128</text>

  <line x1="562" y1="150" x2="587" y2="150" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ConvT 4 -->
  <rect x="590" y="125" width="90" height="50" rx="4" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="635" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">ConvT 5×5</text>
  <text x="635" y="158" text-anchor="middle" font-size="11" fill="#d4a03c">Tanh</text>
  <text x="635" y="170" text-anchor="middle" font-size="11" fill="#d4a03c" font-family="'JetBrains Mono', 'Fira Code', monospace">64×64×3</text>

  <line x1="680" y1="150" x2="705" y2="150" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Generated image -->
  <rect x="708" y="120" width="60" height="60" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="738" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">G(z)</text>
  <text x="738" y="162" text-anchor="middle" font-size="11" fill="#3a9e8f" font-family="'JetBrains Mono', 'Fira Code', monospace">64×64×3</text>

  <!-- Size growth annotation -->
  <text x="400" y="205" text-anchor="middle" font-size="11" fill="#3a9e8f">4×4 → 8×8 → 16×16 → 32×32 → 64×64 (spatial resolution doubles each layer)</text>
  <text x="400" y="220" text-anchor="middle" font-size="11" fill="#3a9e8f">1024 → 512 → 256 → 128 → 3 (channels halve each layer)</text>

  <!-- Discriminator -->
  <rect x="20" y="275" width="870" height="195" rx="10" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="460" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#b5454a">Discriminator D: image → real/fake (strided convolutions)</text>

  <!-- Input image -->
  <rect x="40" y="330" width="60" height="60" rx="4" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="2"/>
  <text x="70" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">x</text>
  <text x="70" y="372" text-anchor="middle" font-size="11" fill="#7a7a8a" font-family="'JetBrains Mono', 'Fira Code', monospace">64×64×3</text>

  <line x1="100" y1="360" x2="125" y2="360" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Conv 1 -->
  <rect x="128" y="335" width="90" height="50" rx="4" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="173" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Conv 5×5</text>
  <text x="173" y="368" text-anchor="middle" font-size="11" fill="#d4645c">LeakyReLU</text>
  <text x="173" y="380" text-anchor="middle" font-size="11" fill="#d4645c" font-family="'JetBrains Mono', 'Fira Code', monospace">32×32×128</text>

  <line x1="218" y1="360" x2="243" y2="360" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Conv 2 -->
  <rect x="246" y="332" width="90" height="56" rx="4" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="291" y="352" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Conv 5×5</text>
  <text x="291" y="365" text-anchor="middle" font-size="11" fill="#d4645c">BN+LeakyReLU</text>
  <text x="291" y="380" text-anchor="middle" font-size="11" fill="#d4645c" font-family="'JetBrains Mono', 'Fira Code', monospace">16×16×256</text>

  <line x1="336" y1="360" x2="361" y2="360" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Conv 3 -->
  <rect x="364" y="328" width="90" height="64" rx="4" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="409" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Conv 5×5</text>
  <text x="409" y="363" text-anchor="middle" font-size="11" fill="#d4645c">BN+LeakyReLU</text>
  <text x="409" y="380" text-anchor="middle" font-size="11" fill="#d4645c" font-family="'JetBrains Mono', 'Fira Code', monospace">8×8×512</text>

  <line x1="454" y1="360" x2="479" y2="360" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Conv 4 -->
  <rect x="482" y="325" width="90" height="70" rx="4" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="527" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Conv 5×5</text>
  <text x="527" y="361" text-anchor="middle" font-size="11" fill="#d4645c">BN+LeakyReLU</text>
  <text x="527" y="380" text-anchor="middle" font-size="11" fill="#d4645c" font-family="'JetBrains Mono', 'Fira Code', monospace">4×4×1024</text>

  <line x1="572" y1="360" x2="597" y2="360" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Flatten + Sigmoid -->
  <rect x="600" y="330" width="80" height="60" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="640" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Flatten</text>
  <text x="640" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Sigmoid</text>

  <line x1="680" y1="360" x2="705" y2="360" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Output -->
  <rect x="708" y="340" width="60" height="40" rx="4" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="2"/>
  <text x="738" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">D(x)</text>

  <!-- Size shrink annotation -->
  <text x="400" y="418" text-anchor="middle" font-size="11" fill="#d4645c">64×64 → 32×32 → 16×16 → 8×8 → 4×4 (strided conv, no pooling)</text>
  <text x="400" y="433" text-anchor="middle" font-size="11" fill="#d4645c">3 → 128 → 256 → 512 → 1024 (channels double each layer)</text>

  <!-- Guidelines box -->
  <rect x="100" y="460" width="720" height="45" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="460" y="478" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">DCGAN Architecture Guidelines</text>
  <text x="460" y="495" text-anchor="middle" font-size="11" fill="#3a3a4a">No pooling (use strided conv) · BatchNorm in both G and D · No FC layers (except G input) · ReLU in G, LeakyReLU in D · Tanh output in G</text>
</svg>