<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="af" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a7fb5"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d4645c"/></marker>
  </defs>

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Computation Graph &amp; Backpropagation</text>

  <!-- Forward Pass Label -->
  <rect x="30" y="55" width="140" height="24" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="100" y="71" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">→ Forward Pass</text>

  <!-- Backward Pass Label -->
  <rect x="200" y="55" width="160" height="24" rx="4" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="280" y="71" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">← Backward Pass (∇)</text>

  <!-- ===== Forward Pass Nodes ===== -->
  <!-- x -->
  <rect x="30" y="160" width="80" height="50" rx="8" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="2"/>
  <text x="70" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">x</text>
  <text x="70" y="200" text-anchor="middle" font-size="11" fill="#7a7a8a">input</text>

  <!-- w -->
  <rect x="30" y="280" width="80" height="50" rx="8" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="70" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#d4a03c">w</text>
  <text x="70" y="320" text-anchor="middle" font-size="11" fill="#d4a03c">weight</text>

  <!-- Multiply node -->
  <circle cx="210" cy="230" r="30" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="210" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7fb5">×</text>
  <text x="210" y="244" text-anchor="middle" font-size="11" fill="#4a7fb5">z = wx</text>

  <!-- b -->
  <rect x="240" y="320" width="80" height="50" rx="8" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#d4a03c">b</text>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#d4a03c">bias</text>

  <!-- Add node -->
  <circle cx="370" cy="270" r="30" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="370" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7fb5">+</text>
  <text x="370" y="284" text-anchor="middle" font-size="11" fill="#4a7fb5">a = z+b</text>

  <!-- ReLU node -->
  <circle cx="520" cy="270" r="30" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="520" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">ReLU</text>
  <text x="520" y="282" text-anchor="middle" font-size="11" fill="#4a7fb5">h=max(0,a)</text>

  <!-- Loss node -->
  <circle cx="670" cy="270" r="35" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="670" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a9e8f">Loss</text>
  <text x="670" y="282" text-anchor="middle" font-size="11" fill="#3a9e8f">L(h, y)</text>

  <!-- Forward arrows (blue) -->
  <line x1="110" y1="185" x2="182" y2="218" stroke="#4a7fb5" stroke-width="2" marker-end="url(#af)"/>
  <line x1="110" y1="305" x2="182" y2="242" stroke="#4a7fb5" stroke-width="2" marker-end="url(#af)"/>
  <line x1="240" y1="235" x2="340" y2="265" stroke="#4a7fb5" stroke-width="2" marker-end="url(#af)"/>
  <line x1="310" y1="325" x2="345" y2="293" stroke="#4a7fb5" stroke-width="2" marker-end="url(#af)"/>
  <line x1="400" y1="270" x2="488" y2="270" stroke="#4a7fb5" stroke-width="2" marker-end="url(#af)"/>
  <line x1="550" y1="270" x2="633" y2="270" stroke="#4a7fb5" stroke-width="2" marker-end="url(#af)"/>

  <!-- ===== Backward Pass (red arrows, offset above forward path) ===== -->
  <!-- ∂L/∂h -->
  <line x1="635" y1="250" x2="555" y2="250" stroke="#d4645c" stroke-width="2" marker-end="url(#ab)"/>
  <text x="595" y="243" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">∂L/∂h</text>

  <!-- ∂L/∂a = ∂L/∂h · ∂h/∂a -->
  <line x1="490" y1="252" x2="405" y2="252" stroke="#d4645c" stroke-width="2" marker-end="url(#ab)"/>
  <text x="448" y="245" text-anchor="middle" font-size="11" fill="#d4645c">∂L/∂h · 1[a&gt;0]</text>

  <!-- ∂L/∂z -->
  <line x1="340" y1="255" x2="243" y2="220" stroke="#d4645c" stroke-width="2" marker-end="url(#ab)"/>
  <text x="305" y="228" text-anchor="middle" font-size="11" fill="#d4645c">∂L/∂a · 1</text>

  <!-- ∂L/∂w = ∂L/∂z · x (KEY PATH) -->
  <line x1="188" y1="252" x2="115" y2="285" stroke="#d4645c" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="170" y="278" font-size="11" font-weight="bold" fill="#d4645c">∂L/∂w</text>

  <!-- ∂L/∂x -->
  <line x1="188" y1="208" x2="115" y2="188" stroke="#d4645c" stroke-width="2" marker-end="url(#ab)"/>
  <text x="160" y="190" font-size="11" fill="#d4645c">∂z/∂x · w</text>

  <!-- ∂L/∂b -->
  <line x1="352" y1="296" x2="322" y2="322" stroke="#d4645c" stroke-width="2" marker-end="url(#ab)"/>
  <text x="348" y="318" font-size="11" fill="#d4645c">∂L/∂a</text>

  <!-- Chain Rule Explanation Box -->
  <rect x="80" y="400" width="660" height="100" rx="8" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="1.5"/>
  <text x="410" y="420" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Chain Rule (Reverse-Mode Autodiff)</text>
  <text x="410" y="440" text-anchor="middle" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace">∂L/∂w = ∂L/∂h · ∂h/∂a · ∂a/∂z · ∂z/∂w</text>
  <text x="410" y="460" text-anchor="middle" font-size="11" fill="#7a7a8a" font-family="'JetBrains Mono', 'Fira Code', monospace">     = ∂L/∂h · 1[a>0] · 1    · x</text>
  <text x="410" y="485" text-anchor="middle" font-size="11" fill="#7a7a8a">One backward pass computes ALL gradients simultaneously (O(N) vs O(N²) for forward-mode)</text>
</svg>