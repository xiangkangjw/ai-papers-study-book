<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ax" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">ViT vs. CNN: Data Efficiency Crossover</text>
  <text x="410" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Dosovitskiy et al. (2020) — ViT needs more data but achieves higher ceiling</text>

  <!-- ===== Main Plot ===== -->
  <rect x="60" y="65" width="540" height="330" rx="8" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="1.5"/>

  <!-- Axes -->
  <line x1="110" y1="360" x2="570" y2="360" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="110" y1="360" x2="110" y2="80" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#ax)"/>

  <text x="340" y="408" text-anchor="middle" font-size="11" fill="#4a4a5a">Pre-training Data Size (log scale)</text>
  <text x="55" y="220" text-anchor="middle" font-size="11" fill="#4a4a5a" transform="rotate(-90 55 220)">ImageNet Top-1 Accuracy (%)</text>

  <!-- X-axis labels -->
  <line x1="160" y1="360" x2="160" y2="365" stroke="#4a4a5a" stroke-width="1"/>
  <text x="160" y="380" text-anchor="middle" font-size="11" fill="#c0c0c8">ImageNet-1K</text>
  <text x="160" y="392" text-anchor="middle" font-size="11" fill="#c0c0c8">(1.3M)</text>

  <line x1="310" y1="360" x2="310" y2="365" stroke="#4a4a5a" stroke-width="1"/>
  <text x="310" y="380" text-anchor="middle" font-size="11" fill="#c0c0c8">ImageNet-21K</text>
  <text x="310" y="392" text-anchor="middle" font-size="11" fill="#c0c0c8">(14M)</text>

  <line x1="480" y1="360" x2="480" y2="365" stroke="#4a4a5a" stroke-width="1"/>
  <text x="480" y="380" text-anchor="middle" font-size="11" fill="#c0c0c8">JFT-300M</text>
  <text x="480" y="392" text-anchor="middle" font-size="11" fill="#c0c0c8">(300M)</text>

  <!-- Y-axis labels -->
  <text x="100" y="340" text-anchor="end" font-size="11" fill="#c0c0c8">76%</text>
  <line x1="107" y1="338" x2="113" y2="338" stroke="#c0c0c8" stroke-width="0.5"/>
  <text x="100" y="280" text-anchor="end" font-size="11" fill="#c0c0c8">80%</text>
  <line x1="107" y1="278" x2="113" y2="278" stroke="#c0c0c8" stroke-width="0.5"/>
  <text x="100" y="220" text-anchor="end" font-size="11" fill="#c0c0c8">84%</text>
  <line x1="107" y1="218" x2="113" y2="218" stroke="#c0c0c8" stroke-width="0.5"/>
  <text x="100" y="160" text-anchor="end" font-size="11" fill="#c0c0c8">88%</text>
  <line x1="107" y1="158" x2="113" y2="158" stroke="#c0c0c8" stroke-width="0.5"/>

  <!-- CNN line (BiT ResNet) - starts higher, plateaus -->
  <polyline points="160,290 310,230 480,195" fill="none" stroke="#d4a03c" stroke-width="3" stroke-dasharray="8,4"/>
  <circle cx="160" cy="290" r="5" fill="#d4a03c"/>
  <circle cx="310" cy="230" r="5" fill="#d4a03c"/>
  <circle cx="480" cy="195" r="5" fill="#d4a03c"/>

  <!-- ViT line - starts lower, crosses over, goes higher -->
  <polyline points="160,320 310,238 480,150" fill="none" stroke="#4a7fb5" stroke-width="3"/>
  <circle cx="160" cy="320" r="5" fill="#4a7fb5"/>
  <circle cx="310" cy="238" r="5" fill="#4a7fb5"/>
  <circle cx="480" cy="150" r="5" fill="#4a7fb5"/>

  <!-- Data point labels -->
  <text x="155" y="280" text-anchor="end" font-size="11" fill="#d4a03c" font-weight="bold">79.1%</text>
  <text x="155" y="335" text-anchor="end" font-size="11" fill="#4a7fb5" font-weight="bold">77.9%</text>

  <text x="325" y="225" font-size="11" fill="#d4a03c" font-weight="bold">~81%</text>
  <text x="325" y="248" font-size="11" fill="#4a7fb5" font-weight="bold">81.8%</text>

  <text x="495" y="205" font-size="11" fill="#d4a03c" font-weight="bold">~85%</text>
  <text x="495" y="148" font-size="11" fill="#4a7fb5" font-weight="bold">88.6%</text>

  <!-- Crossover point -->
  <circle cx="280" cy="244" r="8" fill="none" stroke="#d4a03c" stroke-width="2"/>
  <text x="280" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Crossover</text>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#d4a03c">~10-14M images</text>

  <!-- CNN wins region -->
  <rect x="130" y="300" width="120" height="45" rx="4" fill="#faf5ee" opacity="0.4"/>
  <text x="190" y="330" text-anchor="middle" font-size="11" fill="#d4a03c">CNN inductive bias wins</text>

  <!-- ViT wins region -->
  <rect x="350" y="130" width="170" height="60" rx="4" fill="#edf2f8" opacity="0.4"/>
  <text x="435" y="160" text-anchor="middle" font-size="11" fill="#4a7fb5">ViT flexibility wins</text>

  <!-- Legend -->
  <line x1="145" y1="100" x2="175" y2="100" stroke="#4a7fb5" stroke-width="3"/>
  <circle cx="160" cy="100" r="4" fill="#4a7fb5"/>
  <text x="182" y="104" font-size="11" font-weight="bold" fill="#4a7fb5">ViT (L/16, H/14)</text>

  <line x1="310" y1="100" x2="340" y2="100" stroke="#d4a03c" stroke-width="3" stroke-dasharray="8,4"/>
  <circle cx="325" cy="100" r="4" fill="#d4a03c"/>
  <text x="347" y="104" font-size="11" font-weight="bold" fill="#d4a03c">BiT ResNet (CNN)</text>

  <!-- ===== Explanation Panel (Right) ===== -->
  <rect x="620" y="65" width="185" height="330" rx="10" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="1.5"/>
  <text x="712" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Why?</text>

  <rect x="635" y="105" width="155" height="80" rx="6" fill="#faf5ee" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="712" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">CNNs</text>
  <text x="712" y="140" text-anchor="middle" font-size="11" fill="#3a3a4a">Locality + translation</text>
  <text x="712" y="153" text-anchor="middle" font-size="11" fill="#3a3a4a">equivariance baked in.</text>
  <text x="712" y="170" text-anchor="middle" font-size="11" fill="#3a3a4a">Strong prior → good with</text>
  <text x="712" y="183" text-anchor="middle" font-size="11" fill="#d4a03c" font-weight="bold">less data</text>

  <rect x="635" y="200" width="155" height="80" rx="6" fill="#edf2f8" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="712" y="217" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">ViTs</text>
  <text x="712" y="235" text-anchor="middle" font-size="11" fill="#3a3a4a">No spatial priors.</text>
  <text x="712" y="248" text-anchor="middle" font-size="11" fill="#3a3a4a">Must learn everything</text>
  <text x="712" y="261" text-anchor="middle" font-size="11" fill="#3a3a4a">from data. Fewer constraints</text>
  <text x="712" y="278" text-anchor="middle" font-size="11" fill="#4a7fb5" font-weight="bold">→ higher ceiling with more data</text>

  <rect x="635" y="295" width="155" height="55" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="712" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">The Tradeoff</text>
  <text x="712" y="330" text-anchor="middle" font-size="11" fill="#3a3a4a">More priors → better sample</text>
  <text x="712" y="343" text-anchor="middle" font-size="11" fill="#3a3a4a">efficiency, lower asymptote</text>

  <!-- Bottom annotation -->
  <text x="410" y="430" text-anchor="middle" font-size="11" fill="#7a7a8a">ViT-H/14 pre-trained on JFT-300M: 88.55% top-1 on ImageNet — surpassed all CNN baselines</text>
</svg>