<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Optimal Discriminator D*(x)</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">For fixed G, the optimal discriminator is D*(x) = p_data(x) / (p_data(x) + p_g(x))</text>

  <!-- Plot area -->
  <rect x="40" y="65" width="500" height="280" rx="8" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="1.5"/>

  <!-- Axes -->
  <line x1="80" y1="310" x2="510" y2="310" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="80" y1="310" x2="80" y2="80" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="295" y="340" text-anchor="middle" font-size="11" fill="#4a4a5a">x</text>
  <text x="55" y="195" text-anchor="middle" font-size="11" fill="#4a4a5a" transform="rotate(-90 55 195)">Density / D*(x)</text>

  <!-- Y-axis ticks -->
  <line x1="75" y1="100" x2="80" y2="100" stroke="#4a4a5a" stroke-width="1"/>
  <text x="70" y="104" text-anchor="end" font-size="11" fill="#7a7a8a">1.0</text>
  <line x1="75" y1="205" x2="80" y2="205" stroke="#4a4a5a" stroke-width="1"/>
  <text x="70" y="209" text-anchor="end" font-size="11" fill="#7a7a8a">0.5</text>
  <line x1="75" y1="310" x2="80" y2="310" stroke="#4a4a5a" stroke-width="1"/>
  <text x="70" y="314" text-anchor="end" font-size="11" fill="#7a7a8a">0</text>

  <!-- p_data distribution (blue, centered left) -->
  <path d="M 100 310 Q 140 310 170 270 Q 200 200 230 180 Q 250 170 270 180 Q 300 200 330 270 Q 360 310 400 310" fill="rgba(2,132,199,0.1)" stroke="#4a7fb5" stroke-width="2.5"/>

  <!-- p_g distribution (green dashed, centered right, partially overlapping) -->
  <path d="M 200 310 Q 240 310 270 280 Q 310 230 340 210 Q 360 200 380 210 Q 410 230 440 280 Q 470 310 500 310" fill="rgba(22,163,74,0.08)" stroke="#3a9e8f" stroke-width="2.5" stroke-dasharray="6,3"/>

  <!-- D*(x) curve (amber) -->
  <path d="M 100 105 Q 150 105 200 110 Q 240 120 270 160 Q 295 195 310 205 Q 340 220 380 250 Q 420 280 480 295" fill="none" stroke="#d4a03c" stroke-width="2.5"/>

  <!-- D* = 0.5 reference line -->
  <line x1="80" y1="205" x2="510" y2="205" stroke="#c0c0c8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Annotations on plot -->
  <!-- Where p_data >> p_g: D* ≈ 1 -->
  <circle cx="140" cy="106" r="4" fill="#d4a03c" stroke="#fff" stroke-width="1.5"/>
  <line x1="144" y1="106" x2="170" y2="92" stroke="#d4a03c" stroke-width="1"/>
  <text x="172" y="90" font-size="11" fill="#d4a03c">D* ≈ 1</text>
  <text x="172" y="102" font-size="11" fill="#7a7a8a">p_data ≫ p_g</text>

  <!-- Where overlap: D* ≈ 0.5 -->
  <circle cx="310" cy="205" r="4" fill="#d4a03c" stroke="#fff" stroke-width="1.5"/>
  <line x1="310" y1="201" x2="310" y2="175" stroke="#d4a03c" stroke-width="1"/>
  <text x="312" y="172" font-size="11" fill="#d4a03c">D* = 0.5</text>
  <text x="312" y="184" font-size="11" fill="#7a7a8a">p_data ≈ p_g</text>

  <!-- Where p_g >> p_data: D* ≈ 0 -->
  <circle cx="460" cy="290" r="4" fill="#d4a03c" stroke="#fff" stroke-width="1.5"/>
  <line x1="460" y1="286" x2="460" y2="265" stroke="#d4a03c" stroke-width="1"/>
  <text x="462" y="262" font-size="11" fill="#d4a03c">D* ≈ 0</text>
  <text x="462" y="274" font-size="11" fill="#7a7a8a">p_g ≫ p_data</text>

  <!-- Legend -->
  <line x1="100" y1="355" x2="130" y2="355" stroke="#4a7fb5" stroke-width="2.5"/>
  <text x="138" y="359" font-size="11" fill="#4a7fb5" font-weight="bold">p_data(x)</text>
  <line x1="240" y1="355" x2="270" y2="355" stroke="#3a9e8f" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="278" y="359" font-size="11" fill="#3a9e8f" font-weight="bold">p_g(x)</text>
  <line x1="380" y1="355" x2="410" y2="355" stroke="#d4a03c" stroke-width="2.5"/>
  <text x="418" y="359" font-size="11" fill="#d4a03c" font-weight="bold">D*(x)</text>

  <!-- Explanation panel -->
  <rect x="560" y="65" width="280" height="280" rx="10" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="1.5"/>
  <text x="700" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Optimal Discriminator</text>

  <!-- Formula -->
  <rect x="575" y="105" width="250" height="50" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="700" y="122" text-anchor="middle" font-size="11" fill="#d4a03c" font-family="'JetBrains Mono', 'Fira Code', monospace">D*(x) = p_data(x)</text>
  <line x1="620" y1="130" x2="780" y2="130" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="700" y="148" text-anchor="middle" font-size="11" fill="#d4a03c" font-family="'JetBrains Mono', 'Fira Code', monospace">p_data(x) + p_g(x)</text>

  <!-- Interpretation -->
  <rect x="575" y="170" width="250" height="65" rx="6" fill="#edf2f8" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="700" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Interpretation</text>
  <text x="700" y="208" text-anchor="middle" font-size="11" fill="#3a3a4a">D*(x) = probability that x</text>
  <text x="700" y="222" text-anchor="middle" font-size="11" fill="#3a3a4a">came from real data vs. generator</text>

  <!-- Key properties -->
  <rect x="575" y="250" width="250" height="85" rx="6" fill="#edf7f5" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="700" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Key Properties</text>
  <text x="588" y="288" font-size="11" fill="#3a3a4a">• At convergence: p_g = p_data</text>
  <text x="588" y="304" font-size="11" fill="#3a3a4a">• So D*(x) = 1/2 everywhere</text>
  <text x="588" y="320" font-size="11" fill="#3a3a4a">• Min GAN value = -log 4</text>

  <!-- Bottom equation -->
  <rect x="560" y="355" width="280" height="30" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1"/>
  <text x="700" y="375" text-anchor="middle" font-size="11" fill="#d4a03c" font-family="'JetBrains Mono', 'Fira Code', monospace">V(G,D*) = 2·JSD(p_data ‖ p_g) - log 4</text>
</svg>