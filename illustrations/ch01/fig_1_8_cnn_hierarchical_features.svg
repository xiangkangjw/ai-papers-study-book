<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">CNN Hierarchical Feature Detection</text>
  <text x="430" y="46" text-anchor="middle" font-size="10" fill="#64748b">Each layer detects progressively more complex patterns (Zeiler &amp; Fergus, 2014)</text>

  <!-- Layer 1: Edges -->
  <rect x="30" y="70" width="160" height="190" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="110" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">Layer 1</text>
  <text x="110" y="108" text-anchor="middle" font-size="9" fill="#0284c7">Edges &amp; Gradients</text>

  <!-- Edge patterns -->
  <rect x="45" y="120" width="40" height="40" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <line x1="50" y1="155" x2="80" y2="125" stroke="#0f172a" stroke-width="2"/>
  <rect x="95" y="120" width="40" height="40" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <line x1="115" y1="125" x2="115" y2="155" stroke="#0f172a" stroke-width="2"/>
  <rect x="145" y="120" width="40" height="40" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <line x1="150" y1="140" x2="180" y2="140" stroke="#0f172a" stroke-width="2"/>

  <rect x="45" y="170" width="40" height="40" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <line x1="50" y1="175" x2="80" y2="205" stroke="#0f172a" stroke-width="2"/>
  <rect x="95" y="170" width="40" height="40" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="115" cy="190" r="12" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="145" y="170" width="40" height="40" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <path d="M 155 180 Q 165 200 175 180" fill="none" stroke="#0f172a" stroke-width="1.5"/>

  <text x="110" y="232" text-anchor="middle" font-size="7" fill="#64748b" font-family="'SF Mono', Consolas, monospace">3×3 kernels</text>
  <text x="110" y="248" text-anchor="middle" font-size="7" fill="#64748b">Low-level, local</text>

  <!-- Arrow -->
  <line x1="190" y1="165" x2="220" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Layer 2-3: Textures -->
  <rect x="225" y="70" width="160" height="190" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="305" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">Layers 2–3</text>
  <text x="305" y="108" text-anchor="middle" font-size="9" fill="#d97706">Textures &amp; Motifs</text>

  <!-- Texture patterns -->
  <rect x="240" y="120" width="55" height="50" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <g stroke="#78350f" stroke-width="0.8" opacity="0.6">
    <line x1="245" y1="125" x2="255" y2="135"/><line x1="255" y1="125" x2="265" y2="135"/>
    <line x1="265" y1="125" x2="275" y2="135"/><line x1="275" y1="125" x2="285" y2="135"/>
    <line x1="245" y1="135" x2="255" y2="145"/><line x1="255" y1="135" x2="265" y2="145"/>
    <line x1="265" y1="135" x2="275" y2="145"/><line x1="275" y1="135" x2="285" y2="145"/>
    <line x1="245" y1="145" x2="255" y2="155"/><line x1="255" y1="145" x2="265" y2="155"/>
    <line x1="265" y1="145" x2="275" y2="155"/><line x1="275" y1="145" x2="285" y2="155"/>
  </g>
  <text x="267" y="180" text-anchor="middle" font-size="6" fill="#78350f">stripes</text>

  <rect x="305" y="120" width="55" height="50" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <g fill="#78350f" opacity="0.5">
    <circle cx="315" cy="135" r="3"/><circle cx="325" cy="135" r="3"/><circle cx="335" cy="135" r="3"/><circle cx="345" cy="135" r="3"/>
    <circle cx="320" cy="145" r="3"/><circle cx="330" cy="145" r="3"/><circle cx="340" cy="145" r="3"/>
    <circle cx="315" cy="155" r="3"/><circle cx="325" cy="155" r="3"/><circle cx="335" cy="155" r="3"/><circle cx="345" cy="155" r="3"/>
  </g>
  <text x="332" y="180" text-anchor="middle" font-size="6" fill="#78350f">dots</text>

  <rect x="240" y="190" width="120" height="40" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="300" y="215" text-anchor="middle" font-size="7" fill="#78350f">corners, grids, color blobs</text>

  <text x="305" y="248" text-anchor="middle" font-size="7" fill="#64748b">Combinations of edges</text>

  <!-- Arrow -->
  <line x1="385" y1="165" x2="415" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Layer 4-5: Parts -->
  <rect x="420" y="70" width="160" height="190" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="500" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#3b0764">Layers 4–5</text>
  <text x="500" y="108" text-anchor="middle" font-size="9" fill="#9333ea">Object Parts</text>

  <!-- Part patterns (simplified) -->
  <rect x="435" y="120" width="55" height="50" rx="2" fill="#f3e8ff" stroke="#9333ea" stroke-width="1"/>
  <circle cx="462" cy="140" r="10" fill="none" stroke="#3b0764" stroke-width="1.5"/>
  <circle cx="458" cy="137" r="3" fill="#3b0764"/>
  <text x="462" y="180" text-anchor="middle" font-size="6" fill="#3b0764">eyes</text>

  <rect x="500" y="120" width="55" height="50" rx="2" fill="#f3e8ff" stroke="#9333ea" stroke-width="1"/>
  <path d="M 515 150 Q 527 130 540 150" fill="none" stroke="#3b0764" stroke-width="1.5"/>
  <text x="527" y="180" text-anchor="middle" font-size="6" fill="#3b0764">wheels</text>

  <rect x="435" y="190" width="120" height="40" rx="2" fill="#f3e8ff" stroke="#9333ea" stroke-width="1"/>
  <text x="495" y="215" text-anchor="middle" font-size="7" fill="#3b0764">faces, legs, windows</text>

  <text x="500" y="248" text-anchor="middle" font-size="7" fill="#64748b">Semantic composites</text>

  <!-- Arrow -->
  <line x1="580" y1="165" x2="610" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Final: Objects -->
  <rect x="615" y="70" width="160" height="190" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="695" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">Output</text>
  <text x="695" y="108" text-anchor="middle" font-size="9" fill="#16a34a">Full Objects</text>

  <rect x="630" y="120" width="130" height="110" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="695" y="160" text-anchor="middle" font-size="10" fill="#14532d">Cat: 0.95</text>
  <text x="695" y="180" text-anchor="middle" font-size="10" fill="#14532d">Dog: 0.03</text>
  <text x="695" y="200" text-anchor="middle" font-size="10" fill="#14532d">Car: 0.01</text>
  <text x="695" y="220" text-anchor="middle" font-size="10" fill="#64748b">...</text>

  <text x="695" y="248" text-anchor="middle" font-size="7" fill="#64748b">Classification</text>

  <!-- Bottom annotation -->
  <rect x="100" y="275" width="660" height="35" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="430" y="298" text-anchor="middle" font-size="9" fill="#0f172a">Receptive field grows with depth: edges → textures → parts → objects. Each layer composes features from the layer below.</text>
</svg>