<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Inter, Helvetica, Arial, sans-serif">
  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">JS Divergence vs. Wasserstein Distance</text>
  <text x="410" y="46" text-anchor="middle" font-size="10" fill="#64748b">Why WGAN training is more stable</text>

  <!-- ===== Panel (a): JS Divergence ===== -->
  <rect x="20" y="60" width="380" height="320" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="210" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">(a) JS Divergence (Standard GAN)</text>

  <!-- Axes -->
  <line x1="60" y1="300" x2="370" y2="300" stroke="#94a3b8" stroke-width="1"/>
  <line x1="60" y1="300" x2="60" y2="110" stroke="#94a3b8" stroke-width="1"/>
  <text x="370" y="315" font-size="8" fill="#94a3b8">θ (generator params)</text>
  <text x="40" y="115" font-size="8" fill="#94a3b8">JS</text>

  <!-- Flat JS divergence (constant log2 when distributions don't overlap) -->
  <line x1="70" y1="140" x2="200" y2="140" stroke="#ef4444" stroke-width="3"/>
  <text x="135" y="133" text-anchor="middle" font-size="8" fill="#ef4444">JS = log 2 (constant!)</text>

  <!-- Sudden drop when they overlap -->
  <line x1="200" y1="140" x2="210" y2="280" stroke="#ef4444" stroke-width="3"/>
  <line x1="210" y1="280" x2="350" y2="290" stroke="#ef4444" stroke-width="3"/>

  <!-- No overlap region -->
  <rect x="70" y="145" width="130" height="145" fill="#fee2e2" fill-opacity="0.3"/>
  <text x="135" y="225" text-anchor="middle" font-size="9" font-weight="bold" fill="#991b1b">No overlap</text>
  <text x="135" y="240" text-anchor="middle" font-size="8" fill="#991b1b">∇_θ JS = 0</text>
  <text x="135" y="255" text-anchor="middle" font-size="8" fill="#991b1b">No useful gradient!</text>

  <!-- Distribution diagrams -->
  <text x="100" y="170" font-size="7" fill="#3b82f6">p_data</text>
  <path d="M 80,190 Q 100,170 120,190" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="170" y="170" font-size="7" fill="#ef4444">p_g</text>
  <path d="M 150,190 Q 170,170 190,190" fill="none" stroke="#ef4444" stroke-width="1.5"/>

  <text x="210" y="340" text-anchor="middle" font-size="9" fill="#991b1b">Gradient vanishes when p_data and p_g</text>
  <text x="210" y="354" text-anchor="middle" font-size="9" fill="#991b1b">have disjoint supports (common early in training)</text>

  <!-- ===== Panel (b): Wasserstein Distance ===== -->
  <rect x="420" y="60" width="380" height="320" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="610" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">(b) Wasserstein Distance (WGAN)</text>

  <!-- Axes -->
  <line x1="460" y1="300" x2="770" y2="300" stroke="#94a3b8" stroke-width="1"/>
  <line x1="460" y1="300" x2="460" y2="110" stroke="#94a3b8" stroke-width="1"/>
  <text x="770" y="315" font-size="8" fill="#94a3b8">θ (generator params)</text>
  <text x="435" y="115" font-size="8" fill="#94a3b8">W</text>

  <!-- Smooth decreasing Wasserstein distance -->
  <path d="M 470,140 C 500,145 540,165 580,200 C 620,235 660,260 700,275 C 730,282 750,288 770,290" fill="none" stroke="#16a34a" stroke-width="3"/>

  <!-- Gradient arrows along curve showing useful gradients everywhere -->
  <line x1="500" y1="150" x2="520" y2="158" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="530" y="148" font-size="7" fill="#16a34a">∇ ≠ 0</text>
  <line x1="580" y1="200" x2="600" y2="210" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="610" y="198" font-size="7" fill="#16a34a">∇ ≠ 0</text>
  <line x1="660" y1="255" x2="680" y2="262" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="690" y="252" font-size="7" fill="#16a34a">∇ ≠ 0</text>

  <!-- Earth mover intuition -->
  <text x="520" y="172" font-size="7" fill="#3b82f6">p_data</text>
  <path d="M 500,190 Q 520,170 540,190" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="590" y="172" font-size="7" fill="#16a34a">p_g</text>
  <path d="M 570,190 Q 590,170 610,190" fill="none" stroke="#16a34a" stroke-width="1.5"/>
  <path d="M 540,180 L 570,180" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="555" y="175" text-anchor="middle" font-size="6" fill="#d97706">earth moved</text>

  <text x="610" y="340" text-anchor="middle" font-size="9" fill="#166534">Smooth gradients even when distributions</text>
  <text x="610" y="354" text-anchor="middle" font-size="9" fill="#166534">don't overlap — "cost of moving earth" decreases continuously</text>

  <!-- Bottom comparison -->
  <rect x="60" y="390" width="700" height="25" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="410" y="407" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Key insight: W(p_data, p_g) provides useful gradients everywhere, while JS(p_data ‖ p_g) goes flat when supports are disjoint</text>
</svg>