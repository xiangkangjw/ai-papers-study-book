<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Causal Attention Mask</text>
  <text x="400" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Position i can only attend to positions ≤ i (autoregressive constraint)</text>

  <!-- Panel 1: Raw Scores -->
