<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#3a9e8f"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">LoRA: Training vs. Inference (Merge)</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">At inference, merge adapters into base weights — zero added latency</text>

  <!-- ===== Training (Left) ===== -->
  <rect x="20" y="65" width="370" height="260" rx="10" fill="#edf2f8" stroke="#4a7fb5" stroke-width="2"/>
  <text x="205" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7fb5">Training Time</text>
  <text x="205" y="108" text-anchor="middle" font-size="11" fill="#4a7fb5">Two paths: frozen base + trainable low-rank</text>

  <!-- Frozen W -->
  <rect x="50" y="125" width="130" height="70" rx="8" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="115" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7fb5">W₀</text>
  <text x="115" y="172" text-anchor="middle" font-size="11" fill="#4a7fb5">Frozen (d×d)</text>
  <text x="115" y="188" text-anchor="middle" font-size="11" fill="#4a7fb5">No gradients</text>

  <!-- BA adapter -->
  <rect x="220" y="125" width="140" height="70" rx="8" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="290" y="147" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a9e8f">B · A</text>
  <text x="290" y="165" text-anchor="middle" font-size="11" fill="#3a9e8f">Trainable (d×r + r×d)</text>
  <text x="290" y="183" text-anchor="middle" font-size="11" fill="#3a9e8f">Gradients flow here</text>

  <!-- Plus -->
  <circle cx="195" cy="240" r="14" fill="#e8e4f1" stroke="#7b68a8" stroke-width="2"/>
  <text x="195" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#7b68a8">+</text>
  <line x1="115" y1="195" x2="183" y2="232" stroke="#4a7fb5" stroke-width="1.5"/>
  <line x1="290" y1="195" x2="207" y2="232" stroke="#3a9e8f" stroke-width="1.5"/>

  <!-- Output -->
  <line x1="195" y1="254" x2="195" y2="280" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="125" y="285" width="140" height="28" rx="6" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="195" y="304" text-anchor="middle" font-size="11" fill="#1a1a2e" font-family="'JetBrains Mono', 'Fira Code', monospace">h = W₀x + BAx</text>

  <!-- ===== Arrow: Merge ===== -->
  <line x1="395" y1="195" x2="465" y2="195" stroke="#d4a03c" stroke-width="3" marker-end="url(#a)"/>
  <text x="430" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">MERGE</text>
  <text x="430" y="215" text-anchor="middle" font-size="11" fill="#d4a03c" font-family="'JetBrains Mono', 'Fira Code', monospace">W' = W₀ + (α/r)·BA</text>

  <!-- ===== Inference (Right) ===== -->
  <rect x="470" y="65" width="370" height="260" rx="10" fill="#edf7f5" stroke="#3a9e8f" stroke-width="2"/>
  <text x="655" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a9e8f">Inference Time</text>
  <text x="655" y="108" text-anchor="middle" font-size="11" fill="#3a9e8f">Single merged weight — identical to standard model</text>

  <!-- Merged W' -->
  <rect x="570" y="130" width="170" height="90" rx="10" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2.5"/>
  <text x="655" y="162" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a9e8f">W'</text>
  <text x="655" y="185" text-anchor="middle" font-size="11" fill="#3a9e8f">= W₀ + BA</text>
  <text x="655" y="205" text-anchor="middle" font-size="11" fill="#3a9e8f">(d×d, single matrix)</text>

  <!-- Output -->
  <line x1="655" y1="220" x2="655" y2="250" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="585" y="255" width="140" height="28" rx="6" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="655" y="274" text-anchor="middle" font-size="11" fill="#1a1a2e" font-family="'JetBrains Mono', 'Fira Code', monospace">h = W'x</text>

  <!-- Zero overhead callout -->
  <rect x="560" y="295" width="190" height="22" rx="4" fill="#3a9e8f"/>
  <text x="655" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Zero additional latency</text>

  <!-- ===== Multi-adapter serving note ===== -->
  <rect x="100" y="340" width="660" height="30" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="430" y="360" text-anchor="middle" font-size="11" fill="#d4a03c">Multi-task: keep W₀ shared in memory, hot-swap BA adapters per request (~MBs each vs GBs for full model)</text>
</svg>