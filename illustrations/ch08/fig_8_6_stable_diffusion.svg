<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
    <marker id="ap" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7b68a8"/></marker>
  </defs>

  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Stable Diffusion (Latent Diffusion Model)</text>
  <text x="480" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Denoising happens in compressed latent space — 48× fewer pixels than pixel-space diffusion</text>

  <!-- ===== CLIP Text Encoder (Left) ===== -->
  <rect x="20" y="80" width="180" height="200" rx="10" fill="#f0edf5" stroke="#7b68a8" stroke-width="2"/>
  <text x="110" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b68a8">CLIP Text Encoder</text>

  <rect x="40" y="115" width="140" height="30" rx="4" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="110" y="135" text-anchor="middle" font-size="11" fill="#1a1a2e">"a cat on a mat"</text>

  <line x1="110" y1="145" x2="110" y2="168" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="172" width="140" height="35" rx="6" fill="#e8e4f1" stroke="#7b68a8" stroke-width="2"/>
  <text x="110" y="194" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b68a8">Transformer</text>

  <line x1="110" y1="207" x2="110" y2="228" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="35" y="232" width="150" height="30" rx="4" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="110" y="251" text-anchor="middle" font-size="11" fill="#7b68a8" font-family="'JetBrains Mono', 'Fira Code', monospace">text_emb [77, 768]</text>

  <!-- ===== U-Net in Latent Space (Center) ===== -->
  <rect x="230" y="65" width="440" height="330" rx="10" fill="#edf2f8" stroke="#4a7fb5" stroke-width="2"/>
  <text x="450" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7fb5">U-Net Denoiser (Latent Space)</text>

  <!-- Iterative denoising chain -->
  <rect x="250" y="110" width="60" height="50" rx="6" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="280" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">z_T</text>
  <text x="280" y="148" text-anchor="middle" font-size="11" fill="#7a7a8a">noise</text>

  <line x1="310" y1="135" x2="335" y2="135" stroke="#d4645c" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="338" y="105" width="90" height="60" rx="8" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="383" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">U-Net</text>
  <text x="383" y="144" text-anchor="middle" font-size="11" fill="#4a7fb5">ε_θ(z_t, t, c)</text>
  <text x="383" y="157" text-anchor="middle" font-size="11" fill="#4a7fb5">predict noise</text>

  <line x1="428" y1="135" x2="453" y2="135" stroke="#d4645c" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="475" y="138" font-size="12" fill="#c0c0c8">···</text>

  <line x1="495" y1="135" x2="520" y2="135" stroke="#d4645c" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="523" y="105" width="90" height="60" rx="8" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="568" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">U-Net</text>
  <text x="568" y="144" text-anchor="middle" font-size="11" fill="#4a7fb5">ε_θ(z_1, 1, c)</text>

  <line x1="613" y1="135" x2="638" y2="135" stroke="#d4645c" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="641" y="110" width="60" height="50" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="671" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">z₀</text>
  <text x="671" y="148" text-anchor="middle" font-size="11" fill="#3a9e8f">clean latent</text>

  <!-- Time step input -->
  <rect x="370" y="185" width="70" height="25" rx="4" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="405" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">timestep t</text>
  <line x1="405" y1="185" x2="395" y2="167" stroke="#d4a03c" stroke-width="1" marker-end="url(#a)"/>

  <!-- Cross-attention from text -->
  <line x1="185" y1="247" x2="340" y2="145" stroke="#7b68a8" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ap)"/>
  <text x="255" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b68a8">cross-attention</text>
  <text x="255" y="198" text-anchor="middle" font-size="11" fill="#7b68a8">(text → K,V; U-Net → Q)</text>

  <!-- Latent space dimensions -->
  <rect x="310" y="230" width="240" height="40" rx="6" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="1"/>
  <text x="430" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a3a4a">Latent Space: 64 × 64 × 4</text>
  <text x="430" y="264" text-anchor="middle" font-size="11" fill="#7a7a8a">vs. Pixel Space: 512 × 512 × 3 (48× reduction)</text>

  <!-- Classifier-Free Guidance -->
  <rect x="280" y="295" width="340" height="35" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1"/>
  <text x="450" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Classifier-Free Guidance: ε = ε_uncond + w · (ε_cond − ε_uncond)</text>
  <text x="450" y="326" text-anchor="middle" font-size="11" fill="#d4a03c">w = 7.5 typical guidance scale</text>

  <!-- ===== VAE Decoder (Right) ===== -->
  <rect x="720" y="80" width="220" height="200" rx="10" fill="#edf7f5" stroke="#3a9e8f" stroke-width="2"/>
  <text x="830" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">VAE</text>

  <!-- VAE Encoder (top) -->
  <rect x="740" y="115" width="180" height="40" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="830" y="133" text-anchor="middle" font-size="11" fill="#3a9e8f">Encoder: image → latent z</text>
  <text x="830" y="148" text-anchor="middle" font-size="11" fill="#3a9e8f">(for training / img2img)</text>

  <!-- VAE Decoder (bottom) -->
  <rect x="740" y="175" width="180" height="40" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="830" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Decoder: latent z₀ → image</text>
  <text x="830" y="208" text-anchor="middle" font-size="11" fill="#3a9e8f">(for generation)</text>

  <!-- Arrow from z_0 to VAE decoder -->
  <line x1="700" y1="135" x2="738" y2="195" stroke="#3a9e8f" stroke-width="2" marker-end="url(#a)"/>

  <!-- Output image -->
  <rect x="760" y="235" width="140" height="40" rx="8" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="830" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Output Image</text>
  <text x="830" y="270" text-anchor="middle" font-size="11" fill="#3a9e8f" font-family="'JetBrains Mono', 'Fira Code', monospace">512 × 512 × 3</text>

  <line x1="830" y1="215" x2="830" y2="233" stroke="#3a9e8f" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Component labels -->
  <rect x="100" y="400" width="760" height="55" rx="8" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="1.5"/>
  <text x="480" y="418" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Three Components of Stable Diffusion</text>
  <text x="200" y="440" text-anchor="middle" font-size="11" fill="#7b68a8">■ Text Encoder (frozen CLIP)</text>
  <text x="480" y="440" text-anchor="middle" font-size="11" fill="#4a7fb5">■ U-Net (trained denoiser)</text>
  <text x="750" y="440" text-anchor="middle" font-size="11" fill="#3a9e8f">■ VAE (pre-trained autoencoder)</text>
</svg>