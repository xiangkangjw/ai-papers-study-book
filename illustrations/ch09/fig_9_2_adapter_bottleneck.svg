<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Adapter Bottleneck Modules</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Houlsby et al. (2019) — Insert small trainable bottleneck layers into frozen transformer</text>

  <!-- Standard Transformer Block (left) -->
  <rect x="30" y="70" width="280" height="370" rx="10" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="2"/>
  <text x="170" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Standard Transformer Block</text>

  <rect x="100" y="115" width="140" height="35" rx="6" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="2"/>
  <text x="170" y="137" text-anchor="middle" font-size="11" fill="#4a4a5a">Multi-Head Attention</text>

  <line x1="170" y1="150" x2="170" y2="168" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="110" y="170" width="120" height="25" rx="4" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="170" y="187" text-anchor="middle" font-size="11" fill="#7b68a8">Add + LayerNorm</text>

  <line x1="170" y1="195" x2="170" y2="213" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="100" y="215" width="140" height="35" rx="6" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="2"/>
  <text x="170" y="237" text-anchor="middle" font-size="11" fill="#4a4a5a">Feed-Forward Network</text>

  <line x1="170" y1="250" x2="170" y2="268" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="110" y="270" width="120" height="25" rx="4" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="170" y="287" text-anchor="middle" font-size="11" fill="#7b68a8">Add + LayerNorm</text>

  <text x="170" y="330" text-anchor="middle" font-size="11" fill="#7a7a8a">All parameters frozen</text>
  <text x="170" y="348" text-anchor="middle" font-size="11" fill="#7a7a8a">during fine-tuning</text>
  <text x="170" y="370" text-anchor="middle" font-size="11" fill="#7a7a8a">(except task head)</text>

  <!-- With Adapters (right) -->
  <rect x="350" y="70" width="300" height="370" rx="10" fill="#edf7f5" stroke="#3a9e8f" stroke-width="2"/>
  <text x="500" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">+ Adapter Modules</text>

  <rect x="420" y="115" width="140" height="35" rx="6" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="2"/>
  <text x="490" y="132" text-anchor="middle" font-size="11" fill="#4a4a5a">Multi-Head Attention</text>
  <text x="490" y="145" text-anchor="middle" font-size="11" fill="#c0c0c8">🔒 frozen</text>

  <line x1="490" y1="150" x2="490" y2="163" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Adapter 1 -->
  <rect x="430" y="165" width="120" height="55" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2.5"/>
  <text x="490" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Adapter 🔥</text>
  <text x="490" y="196" text-anchor="middle" font-size="11" fill="#3a9e8f">Down → ReLU → Up</text>
  <text x="490" y="210" text-anchor="middle" font-size="11" fill="#3a9e8f" font-family="'JetBrains Mono', 'Fira Code', monospace">d→r→d (r≪d)</text>

  <!-- Residual around adapter -->
  <line x1="415" y1="150" x2="415" y2="225" stroke="#3a9e8f" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="415" y1="225" x2="428" y2="225" stroke="#3a9e8f" stroke-width="1"/>
  <circle cx="430" cy="225" r="5" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1"/>
  <text x="430" y="228" text-anchor="middle" font-size="11" fill="#3a9e8f">+</text>

  <line x1="490" y1="220" x2="490" y2="238" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="435" y="240" width="110" height="22" rx="4" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="490" y="255" text-anchor="middle" font-size="11" fill="#7b68a8">Add + LayerNorm</text>

  <line x1="490" y1="262" x2="490" y2="275" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="420" y="277" width="140" height="35" rx="6" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="2"/>
  <text x="490" y="294" text-anchor="middle" font-size="11" fill="#4a4a5a">Feed-Forward Network</text>
  <text x="490" y="307" text-anchor="middle" font-size="11" fill="#c0c0c8">🔒 frozen</text>

  <line x1="490" y1="312" x2="490" y2="325" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Adapter 2 -->
  <rect x="430" y="327" width="120" height="45" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2.5"/>
  <text x="490" y="345" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Adapter 🔥</text>
  <text x="490" y="360" text-anchor="middle" font-size="11" fill="#3a9e8f">Down → ReLU → Up</text>

  <line x1="490" y1="372" x2="490" y2="388" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="435" y="390" width="110" height="22" rx="4" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="490" y="405" text-anchor="middle" font-size="11" fill="#7b68a8">Add + LayerNorm</text>

  <!-- Adapter detail -->
  <rect x="680" y="70" width="155" height="200" rx="10" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="757" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Adapter Detail</text>

  <rect x="710" y="115" width="90" height="25" rx="4" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1"/>
  <text x="755" y="132" text-anchor="middle" font-size="11" fill="#1a1a2e">Input (d=768)</text>

  <line x1="755" y1="140" x2="755" y2="155" stroke="#4a4a5a" stroke-width="1" marker-end="url(#a)"/>

  <rect x="710" y="157" width="90" height="22" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="755" y="172" text-anchor="middle" font-size="11" fill="#3a9e8f">Down: d→r (64)</text>

  <line x1="755" y1="179" x2="755" y2="190" stroke="#4a4a5a" stroke-width="1" marker-end="url(#a)"/>

  <rect x="720" y="192" width="70" height="18" rx="3" fill="#f5ece0" stroke="#d4a03c" stroke-width="1"/>
  <text x="755" y="205" text-anchor="middle" font-size="11" fill="#d4a03c">ReLU</text>

  <line x1="755" y1="210" x2="755" y2="221" stroke="#4a4a5a" stroke-width="1" marker-end="url(#a)"/>

  <rect x="710" y="223" width="90" height="22" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="755" y="238" text-anchor="middle" font-size="11" fill="#3a9e8f">Up: r→d (768)</text>

  <line x1="755" y1="245" x2="755" y2="256" stroke="#4a4a5a" stroke-width="1" marker-end="url(#a)"/>

  <rect x="710" y="258" width="90" height="18" rx="4" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1"/>
  <text x="755" y="271" text-anchor="middle" font-size="11" fill="#1a1a2e">+ residual</text>

  <!-- Parameter counts -->
  <rect x="680" y="290" width="155" height="140" rx="8" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="757" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Parameter Savings</text>

  <text x="700" y="340" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace">Adapter params per layer:</text>
  <text x="700" y="356" font-size="11" fill="#3a9e8f" font-family="'JetBrains Mono', 'Fira Code', monospace">2 × (d·r + r·d + r + d)</text>
  <text x="700" y="372" font-size="11" fill="#3a3a4a">r=64, d=768:</text>
  <text x="700" y="388" font-size="11" fill="#3a9e8f" font-weight="bold">~0.5-4% of original params</text>
  <text x="700" y="408" font-size="11" fill="#3a3a4a">BERT-Base: 110M → +3.6M</text>
  <text x="700" y="424" font-size="11" fill="#3a9e8f">Within 0.4% of full fine-tuning!</text>
</svg>