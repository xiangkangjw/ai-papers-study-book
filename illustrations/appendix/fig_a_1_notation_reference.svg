<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="Inter, Helvetica, Arial, sans-serif">
  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Notation Reference Card</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Key symbols and conventions used throughout this book</text>

  <!-- Vectors & Matrices -->
  <rect x="30" y="65" width="260" height="210" rx="8" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="160" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Vectors &amp; Matrices</text>

  <text x="50" y="115" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">x, h, z</text>
  <text x="155" y="115" font-size="11" fill="#3a3a4a">Vectors (lowercase bold)</text>

  <text x="50" y="138" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">W, A, B</text>
  <text x="155" y="138" font-size="11" fill="#3a3a4a">Matrices (uppercase bold)</text>

  <text x="50" y="161" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">W_Q, W_K, W_V</text>
  <text x="195" y="161" font-size="11" fill="#3a3a4a">Attention projections</text>

  <text x="50" y="184" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">x_i or x^(i)</text>
  <text x="155" y="184" font-size="11" fill="#3a3a4a">i-th element or sample</text>

  <text x="50" y="207" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">X^T</text>
  <text x="155" y="207" font-size="11" fill="#3a3a4a">Matrix transpose</text>

  <text x="50" y="230" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">||x||</text>
  <text x="155" y="230" font-size="11" fill="#3a3a4a">L2 norm (default)</text>

  <text x="50" y="253" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">I_d</text>
  <text x="155" y="253" font-size="11" fill="#3a3a4a">d x d identity matrix</text>

  <!-- Dimensions & Shapes -->
  <rect x="310" y="65" width="240" height="210" rx="8" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="430" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Dimensions &amp; Shapes</text>

  <text x="330" y="115" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">B</text>
  <text x="420" y="115" font-size="11" fill="#3a3a4a">Batch size</text>

  <text x="330" y="138" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">T, L, N</text>
  <text x="420" y="138" font-size="11" fill="#3a3a4a">Sequence length</text>

  <text x="330" y="161" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">d_model, d</text>
  <text x="420" y="161" font-size="11" fill="#3a3a4a">Hidden dimension</text>

  <text x="330" y="184" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">d_k, d_v</text>
  <text x="420" y="184" font-size="11" fill="#3a3a4a">Key/value head dim</text>

  <text x="330" y="207" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">d_ff</text>
  <text x="420" y="207" font-size="11" fill="#3a3a4a">FFN inner dim (4d)</text>

  <text x="330" y="230" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">n_h</text>
  <text x="420" y="230" font-size="11" fill="#3a3a4a">Number of heads</text>

  <text x="330" y="253" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">[B,T,d]</text>
  <text x="420" y="253" font-size="11" fill="#3a3a4a">Tensor shape notation</text>

  <!-- Functions & Operations -->
  <rect x="570" y="65" width="260" height="210" rx="8" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="700" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Functions &amp; Operations</text>

  <text x="590" y="115" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">sigma(x)</text>
  <text x="700" y="115" font-size="11" fill="#3a3a4a">Sigmoid function</text>

  <text x="590" y="138" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">softmax(x)</text>
  <text x="700" y="138" font-size="11" fill="#3a3a4a">Softmax over last dim</text>

  <text x="590" y="161" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">LN(x), RMSNorm</text>
  <text x="730" y="161" font-size="11" fill="#3a3a4a">Normalization</text>

  <text x="590" y="184" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">x * y</text>
  <text x="700" y="184" font-size="11" fill="#3a3a4a">Elementwise multiply</text>

  <text x="590" y="207" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">x @ W</text>
  <text x="700" y="207" font-size="11" fill="#3a3a4a">Matrix multiply</text>

  <text x="590" y="230" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">[x; y]</text>
  <text x="700" y="230" font-size="11" fill="#3a3a4a">Concatenation</text>

  <text x="590" y="253" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">f ∘ g</text>
  <text x="700" y="253" font-size="11" fill="#3a3a4a">Function composition</text>

  <!-- Probability & Training -->
  <rect x="30" y="295" width="260" height="210" rx="8" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="160" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Probability &amp; Training</text>

  <text x="50" y="345" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">theta</text>
  <text x="155" y="345" font-size="11" fill="#3a3a4a">Model parameters</text>

  <text x="50" y="368" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">L, J</text>
  <text x="155" y="368" font-size="11" fill="#3a3a4a">Loss / objective function</text>

  <text x="50" y="391" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">nabla_theta L</text>
  <text x="155" y="391" font-size="11" fill="#3a3a4a">Gradient w.r.t. params</text>

  <text x="50" y="414" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">eta, lr</text>
  <text x="155" y="414" font-size="11" fill="#3a3a4a">Learning rate</text>

  <text x="50" y="437" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">p(x), q(x)</text>
  <text x="155" y="437" font-size="11" fill="#3a3a4a">Probability distributions</text>

  <text x="50" y="460" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">KL(p||q)</text>
  <text x="155" y="460" font-size="11" fill="#3a3a4a">KL divergence</text>

  <text x="50" y="483" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">E_x[f(x)]</text>
  <text x="155" y="483" font-size="11" fill="#3a3a4a">Expectation</text>

  <!-- Architecture-Specific -->
  <rect x="310" y="295" width="240" height="210" rx="8" fill="#e8e4f1" stroke="#7b68a8" stroke-width="2"/>
  <text x="430" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b68a8">Architecture-Specific</text>

  <text x="330" y="345" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">Q, K, V</text>
  <text x="420" y="345" font-size="11" fill="#3a3a4a">Query, key, value</text>

  <text x="330" y="368" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">Attn(Q,K,V)</text>
  <text x="440" y="368" font-size="11" fill="#3a3a4a">Attention function</text>

  <text x="330" y="391" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">PE, RoPE</text>
  <text x="420" y="391" font-size="11" fill="#3a3a4a">Positional encoding</text>

  <text x="330" y="414" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">z_t, eps_t</text>
  <text x="420" y="414" font-size="11" fill="#3a3a4a">Diffusion latent, noise</text>

  <text x="330" y="437" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">alpha_t, beta_t</text>
  <text x="440" y="437" font-size="11" fill="#3a3a4a">Noise schedule</text>

  <text x="330" y="460" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">r</text>
  <text x="420" y="460" font-size="11" fill="#3a3a4a">LoRA rank</text>

  <text x="330" y="483" font-size="11" fill="#3a3a4a" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="bold">R_t</text>
  <text x="420" y="483" font-size="11" fill="#3a3a4a">Return-to-go (RL)</text>

  <!-- Conventions -->
  <rect x="570" y="295" width="260" height="210" rx="8" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="2"/>
  <text x="700" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Conventions</text>

  <rect x="590" y="338" width="16" height="16" rx="3" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1.5"/>
  <text x="618" y="351" font-size="11" fill="#3a3a4a">Frozen / pretrained</text>

  <rect x="590" y="366" width="16" height="16" rx="3" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="618" y="379" font-size="11" fill="#3a3a4a">Trainable / output</text>

  <rect x="590" y="394" width="16" height="16" rx="3" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="618" y="407" font-size="11" fill="#3a3a4a">Weights / learnable</text>

  <rect x="590" y="422" width="16" height="16" rx="3" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="618" y="435" font-size="11" fill="#3a3a4a">Attention / decoder</text>

  <rect x="590" y="450" width="16" height="16" rx="3" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="618" y="463" font-size="11" fill="#3a3a4a">Operations / encoder</text>

  <rect x="590" y="478" width="16" height="16" rx="3" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="618" y="491" font-size="11" fill="#3a3a4a">Error / loss / pruned</text>
</svg>