  <text x="420" y="95" text-anchor="middle" font-size="11" fill="#7a7a8a">Add −∞ to upper triangle</text>

  <g transform="translate(310, 110)">
    <text x="55" y="-5" text-anchor="middle" font-size="11" fill="#7a7a8a">t₁</text>
    <text x="105" y="-5" text-anchor="middle" font-size="11" fill="#7a7a8a">t₂</text>
    <text x="155" y="-5" text-anchor="middle" font-size="11" fill="#7a7a8a">t₃</text>
    <text x="205" y="-5" text-anchor="middle" font-size="11" fill="#7a7a8a">t₄</text>

