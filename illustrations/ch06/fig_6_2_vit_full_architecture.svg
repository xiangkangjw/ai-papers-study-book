<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Vision Transformer (ViT) — Full Architecture</text>
  <text x="360" y="46" text-anchor="middle" font-size="10" fill="#64748b">ViT-Base/16: 224×224 input, 16×16 patches, 12 layers, 768-dim</text>

  <!-- ===== Stage 1: Patch Embedding ===== -->
  <rect x="60" y="60" width="600" height="230" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="360" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#0c4a6e">1. Patch Embedding Stage</text>

  <!-- Input image -->
  <rect x="90" y="100" width="90" height="90" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <!-- Grid overlay -->
  <g stroke="#94a3b8" stroke-width="0.5">
    <line x1="120" y1="100" x2="120" y2="190"/><line x1="150" y1="100" x2="150" y2="190"/>
    <line x1="90" y1="130" x2="180" y2="130"/><line x1="90" y1="160" x2="180" y2="160"/>
  </g>
  <rect x="90" y="100" width="30" height="30" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" opacity="0.7"/>
  <text x="135" y="210" text-anchor="middle" font-size="8" fill="#475569">Input Image</text>
  <text x="135" y="223" text-anchor="middle" font-size="7" fill="#64748b" font-family="'SF Mono', Consolas, monospace">[B, 3, 224, 224]</text>

  <!-- Arrow -->
  <line x1="185" y1="145" x2="215" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="200" y="138" text-anchor="middle" font-size="7" fill="#475569">Split</text>

  <!-- Patches -->
  <rect x="220" y="100" width="120" height="90" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="280" y="135" text-anchor="middle" font-size="9" font-weight="bold" fill="#78350f">196 Patches</text>
  <text x="280" y="155" text-anchor="middle" font-size="8" fill="#d97706">14×14 grid</text>
  <text x="280" y="170" text-anchor="middle" font-size="7" fill="#d97706">each 16×16×3</text>
  <text x="280" y="223" text-anchor="middle" font-size="7" fill="#64748b" font-family="'SF Mono', Consolas, monospace">[B, 196, 768]</text>

  <!-- Arrow -->
  <line x1="345" y1="145" x2="375" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="360" y="130" text-anchor="middle" font-size="7" fill="#475569">Linear</text>
  <text x="360" y="140" text-anchor="middle" font-size="7" fill="#475569">E ∈ ℝ^{768×768}</text>

  <!-- Prepend CLS + position -->
  <rect x="380" y="95" width="140" height="45" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="450" y="115" text-anchor="middle" font-size="9" font-weight="bold" fill="#831843">Prepend [CLS]</text>
  <text x="450" y="130" text-anchor="middle" font-size="7" fill="#db2777" font-family="'SF Mono', Consolas, monospace">[B, 197, 768]</text>

  <line x1="450" y1="140" x2="450" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="380" y="165" width="140" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="450" y="183" text-anchor="middle" font-size="9" font-weight="bold" fill="#78350f">+ Pos Embed</text>
  <text x="450" y="198" text-anchor="middle" font-size="7" fill="#d97706" font-family="'SF Mono', Consolas, monospace">E_pos ∈ ℝ^{197×768}</text>

  <!-- Token sequence visualization -->
  <rect x="545" y="100" width="25" height="70" rx="3" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="557" y="140" text-anchor="middle" font-size="6" fill="#831843" transform="rotate(-90 557 140)">[CLS]</text>
  <rect x="573" y="100" width="20" height="70" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <rect x="596" y="100" width="20" height="70" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <rect x="619" y="100" width="20" height="70" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="583" y="180" text-anchor="middle" font-size="6" fill="#0284c7">P₁</text>
  <text x="606" y="180" text-anchor="middle" font-size="6" fill="#0284c7">P₂</text>
  <text x="629" y="180" text-anchor="middle" font-size="6" fill="#0284c7">...</text>
  <text x="600" y="223" text-anchor="middle" font-size="7" fill="#64748b">197 tokens</text>

  <!-- ===== Stage 2: Transformer Encoder ===== -->
  <line x1="360" y1="290" x2="360" y2="310" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="360" y="305" text-anchor="middle" font-size="7" fill="#64748b" font-family="'SF Mono', Consolas, monospace">[B, 197, 768]</text>

  <rect x="100" y="315" width="520" height="330" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">2. Transformer Encoder (×12 Layers)</text>

  <!-- Encoder block detail -->
  <rect x="130" y="350" width="460" height="275" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- MSA -->
  <rect x="175" y="365" width="370" height="50" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="360" y="387" text-anchor="middle" font-size="10" font-weight="bold" fill="#831843">Multi-Head Self-Attention (MSA)</text>
  <text x="360" y="405" text-anchor="middle" font-size="8" fill="#db2777" font-family="'SF Mono', Consolas, monospace">h=12 heads, d_k=64 per head</text>

  <!-- Residual + LN -->
  <line x1="360" y1="415" x2="360" y2="433" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="240" y="437" width="240" height="25" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="360" y="454" text-anchor="middle" font-size="9" fill="#3b0764">Add &amp; LayerNorm</text>
  <path d="M 165 390 L 165 449 L 238 449" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- FFN / MLP -->
  <line x1="360" y1="462" x2="360" y2="480" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="175" y="484" width="370" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="360" y="506" text-anchor="middle" font-size="10" font-weight="bold" fill="#0c4a6e">MLP (Feed-Forward)</text>
  <text x="360" y="524" text-anchor="middle" font-size="8" fill="#0284c7" font-family="'SF Mono', Consolas, monospace">Linear(768, 3072) → GELU → Linear(3072, 768)</text>

  <!-- Residual + LN -->
  <line x1="360" y1="534" x2="360" y2="552" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="240" y="556" width="240" height="25" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="360" y="573" text-anchor="middle" font-size="9" fill="#3b0764">Add &amp; LayerNorm</text>
  <path d="M 165 509 L 165 568 L 238 568" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Repeat annotation -->
  <text x="570" y="475" font-size="9" font-weight="bold" fill="#16a34a">×12</text>

  <!-- Output shape -->
  <text x="360" y="610" text-anchor="middle" font-size="7" fill="#64748b" font-family="'SF Mono', Consolas, monospace">[B, 197, 768]</text>

  <!-- ===== Stage 3: Classification ===== -->
  <line x1="360" y1="645" x2="360" y2="665" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="140" y="670" width="440" height="210" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="692" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350f">3. Classification Head</text>

  <!-- Extract CLS -->
  <rect x="210" y="705" width="300" height="35" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="360" y="722" text-anchor="middle" font-size="9" font-weight="bold" fill="#831843">Extract [CLS] token (index 0)</text>
  <text x="360" y="735" text-anchor="middle" font-size="7" fill="#db2777" font-family="'SF Mono', Consolas, monospace">[B, 197, 768] → [B, 768]</text>

  <line x1="360" y1="740" x2="360" y2="755" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- LayerNorm -->
  <rect x="250" y="758" width="220" height="25" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="360" y="775" text-anchor="middle" font-size="9" fill="#3b0764">LayerNorm</text>

  <line x1="360" y1="783" x2="360" y2="798" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- MLP Head -->
  <rect x="230" y="801" width="260" height="35" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="818" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">MLP Head → Predictions</text>
  <text x="360" y="832" text-anchor="middle" font-size="7" fill="#16a34a" font-family="'SF Mono', Consolas, monospace">[B, 768] → [B, num_classes]</text>

  <!-- Output -->
  <line x1="360" y1="836" x2="360" y2="856" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="360" y="870" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a" font-family="'SF Mono', Consolas, monospace">logits [B, 1000]</text>

  <!-- Model variants box -->
  <rect x="540" y="700" width="150" height="80" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="615" y="718" text-anchor="middle" font-size="8" font-weight="bold" fill="#0f172a">Variants</text>
  <text x="615" y="735" text-anchor="middle" font-size="7" fill="#334155">Base: 12L, 768d, 86M</text>
  <text x="615" y="750" text-anchor="middle" font-size="7" fill="#334155">Large: 24L, 1024d, 307M</text>
  <text x="615" y="765" text-anchor="middle" font-size="7" fill="#334155">Huge: 32L, 1280d, 632M</text>
</svg>