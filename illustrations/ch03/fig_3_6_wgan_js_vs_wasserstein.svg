<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Inter, Helvetica, Arial, sans-serif">
  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">JS Divergence vs. Wasserstein Distance</text>
  <text x="410" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Why WGAN training is more stable</text>

  <!-- ===== Panel (a): JS Divergence ===== -->
  <rect x="20" y="60" width="380" height="320" rx="10" fill="#f6e4e3" stroke="#e4ada9" stroke-width="1.5"/>
  <text x="210" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#b5454a">(a) JS Divergence (Standard GAN)</text>

  <!-- Axes -->
  <line x1="60" y1="300" x2="370" y2="300" stroke="#c0c0c8" stroke-width="1"/>
  <line x1="60" y1="300" x2="60" y2="110" stroke="#c0c0c8" stroke-width="1"/>
  <text x="365" y="315" text-anchor="end" font-size="11" fill="#c0c0c8">θ (generator params)</text>
  <text x="40" y="115" font-size="11" fill="#c0c0c8">JS</text>

  <!-- Flat JS divergence (constant log2 when distributions don't overlap) -->
  <line x1="70" y1="140" x2="200" y2="140" stroke="#d4645c" stroke-width="3"/>
  <text x="135" y="133" text-anchor="middle" font-size="11" fill="#d4645c">JS = log 2 (constant!)</text>

  <!-- Sudden drop when they overlap -->
  <line x1="200" y1="140" x2="210" y2="280" stroke="#d4645c" stroke-width="3"/>
  <line x1="210" y1="280" x2="350" y2="290" stroke="#d4645c" stroke-width="3"/>

  <!-- No overlap region -->
  <rect x="70" y="145" width="130" height="145" fill="#f6e4e3" fill-opacity="0.3"/>
  <text x="135" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#b5454a">No overlap</text>
  <text x="135" y="240" text-anchor="middle" font-size="11" fill="#b5454a">∇_θ JS = 0</text>
  <text x="135" y="255" text-anchor="middle" font-size="11" fill="#b5454a">No useful gradient!</text>

  <!-- Distribution diagrams -->
  <text x="100" y="170" font-size="11" fill="#4a7fb5">p_data</text>
  <path d="M 80,190 Q 100,170 120,190" fill="none" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="170" y="170" font-size="11" fill="#d4645c">p_g</text>
  <path d="M 150,190 Q 170,170 190,190" fill="none" stroke="#d4645c" stroke-width="1.5"/>

  <text x="210" y="340" text-anchor="middle" font-size="11" fill="#b5454a">Gradient vanishes when p_data and p_g</text>
  <text x="210" y="354" text-anchor="middle" font-size="11" fill="#b5454a">have disjoint supports (common early in training)</text>

  <!-- ===== Panel (b): Wasserstein Distance ===== -->
  <rect x="420" y="60" width="380" height="320" rx="10" fill="#edf7f5" stroke="#c5e6e1" stroke-width="1.5"/>
  <text x="610" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a9e8f">(b) Wasserstein Distance (WGAN)</text>

  <!-- Axes -->
  <line x1="460" y1="300" x2="770" y2="300" stroke="#c0c0c8" stroke-width="1"/>
  <line x1="460" y1="300" x2="460" y2="110" stroke="#c0c0c8" stroke-width="1"/>
  <text x="765" y="315" text-anchor="end" font-size="11" fill="#c0c0c8">θ (generator params)</text>
  <text x="435" y="115" font-size="11" fill="#c0c0c8">W</text>

  <!-- Smooth decreasing Wasserstein distance -->
  <path d="M 470,140 C 500,145 540,165 580,200 C 620,235 660,260 700,275 C 730,282 750,288 770,290" fill="none" stroke="#3a9e8f" stroke-width="3"/>

  <!-- Gradient arrows along curve showing useful gradients everywhere -->
  <line x1="500" y1="150" x2="520" y2="158" stroke="#3a9e8f" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="530" y="148" font-size="11" fill="#3a9e8f">∇ ≠ 0</text>
  <line x1="580" y1="200" x2="600" y2="210" stroke="#3a9e8f" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="610" y="198" font-size="11" fill="#3a9e8f">∇ ≠ 0</text>
  <line x1="660" y1="255" x2="680" y2="262" stroke="#3a9e8f" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="690" y="252" font-size="11" fill="#3a9e8f">∇ ≠ 0</text>

  <!-- Earth mover intuition -->
  <text x="520" y="172" font-size="11" fill="#4a7fb5">p_data</text>
  <path d="M 500,190 Q 520,170 540,190" fill="none" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="590" y="172" font-size="11" fill="#3a9e8f">p_g</text>
  <path d="M 570,190 Q 590,170 610,190" fill="none" stroke="#3a9e8f" stroke-width="1.5"/>
  <path d="M 540,180 L 570,180" fill="none" stroke="#d4a03c" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="555" y="175" text-anchor="middle" font-size="11" fill="#d4a03c">earth moved</text>

  <text x="610" y="340" text-anchor="middle" font-size="11" fill="#3a9e8f">Smooth gradients even when distributions</text>
  <text x="610" y="354" text-anchor="middle" font-size="11" fill="#3a9e8f">don't overlap — "cost of moving earth" decreases continuously</text>

  <!-- Bottom comparison -->
  <rect x="60" y="390" width="700" height="25" rx="6" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="1"/>
  <text x="410" y="407" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Key insight: W(p_data, p_g) provides useful gradients everywhere, while JS(p_data ‖ p_g) goes flat when supports are disjoint</text>
</svg>