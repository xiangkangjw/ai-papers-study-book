<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 880" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="350" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">BERT: Encoder-Only Transformer</text>
  <text x="350" y="46" text-anchor="middle" font-size="10" fill="#64748b">Bidirectional — every token attends to every other token (no causal mask)</text>

  <!-- ===== Input Tokens ===== -->
  <rect x="60" y="65" width="580" height="40" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="350" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Input Tokens</text>
  <text x="350" y="97" text-anchor="middle" font-size="8" fill="#475569" font-family="'SF Mono', Consolas, monospace">[CLS]  The  bank  can  [MASK]  deposits  [SEP]</text>

  <line x1="350" y1="105" x2="350" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ===== Embeddings ===== -->
  <rect x="80" y="130" width="540" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="350" y="150" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">Three-Way Embedding Sum</text>
  <text x="200" y="175" text-anchor="middle" font-size="8" fill="#475569">Token Embeddings</text>
  <text x="350" y="175" text-anchor="middle" font-size="8" fill="#475569">+ Position Embeddings</text>
  <text x="500" y="175" text-anchor="middle" font-size="8" fill="#475569">+ Segment Embeddings</text>
  <text x="350" y="192" text-anchor="middle" font-size="7" fill="#64748b" font-family="'SF Mono', Consolas, monospace">[B, T, 768]</text>

  <line x1="350" y1="200" x2="350" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ===== Transformer Encoder Stack ===== -->
  <rect x="100" y="225" width="500" height="370" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="350" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">Transformer Encoder Stack (x N layers)</text>

  <!-- Single block detail -->
  <rect x="130" y="265" width="440" height="310" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="350" y="285" text-anchor="middle" font-size="9" fill="#64748b">One Encoder Layer (repeated N times)</text>

  <!-- Multi-Head Self-Attention -->
  <rect x="165" y="295" width="370" height="55" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="350" y="318" text-anchor="middle" font-size="10" font-weight="bold" fill="#831843">Full Bidirectional Multi-Head Self-Attention</text>
  <text x="350" y="340" text-anchor="middle" font-size="8" fill="#db2777" font-family="'SF Mono', Consolas, monospace">Q, K, V all from same input — no mask applied</text>

  <!-- Residual + LN 1 -->
  <line x1="350" y1="350" x2="350" y2="368" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="220" y="372" width="260" height="28" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="350" y="391" text-anchor="middle" font-size="9" fill="#3b0764">Add &amp; LayerNorm</text>

  <!-- Residual arrow 1 -->
  <path d="M 155 322 L 155 386 L 218 386" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="145" y="355" text-anchor="end" font-size="7" fill="#94a3b8">residual</text>

  <!-- FFN -->
  <line x1="350" y1="400" x2="350" y2="418" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="165" y="422" width="370" height="55" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="350" y="445" text-anchor="middle" font-size="10" font-weight="bold" fill="#0c4a6e">Feed-Forward Network</text>
  <text x="350" y="465" text-anchor="middle" font-size="8" fill="#0284c7" font-family="'SF Mono', Consolas, monospace">Linear(768, 3072) → GELU → Linear(3072, 768)</text>

  <!-- Residual + LN 2 -->
  <line x1="350" y1="477" x2="350" y2="495" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="220" y="499" width="260" height="28" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="350" y="518" text-anchor="middle" font-size="9" fill="#3b0764">Add &amp; LayerNorm</text>

  <!-- Residual arrow 2 -->
  <path d="M 155 449 L 155 513 L 218 513" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="145" y="482" text-anchor="end" font-size="7" fill="#94a3b8">residual</text>

  <!-- Output shape -->
  <text x="350" y="560" text-anchor="middle" font-size="8" fill="#64748b" font-family="'SF Mono', Consolas, monospace">[B, T, 768]</text>

  <line x1="350" y1="568" x2="350" y2="588" stroke="#475569" stroke-width="1.5"/>

  <!-- ===== Hidden States ===== -->
  <rect x="100" y="600" width="500" height="35" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="350" y="622" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a" font-family="'SF Mono', Consolas, monospace">H_[CLS]   H_The   H_bank   H_can   H_[MASK]   H_deposits   H_[SEP]</text>

  <!-- ===== Two output heads ===== -->
  <!-- MLM Head -->
  <line x1="250" y1="635" x2="250" y2="660" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="135" y="665" width="230" height="55" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="250" y="688" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">MLM Head</text>
  <text x="250" y="710" text-anchor="middle" font-size="8" fill="#d97706">Predict [MASK] → "accept"</text>

  <!-- NSP Head -->
  <line x1="450" y1="635" x2="450" y2="660" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="355" y="665" width="190" height="55" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="688" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">NSP Head</text>
  <text x="450" y="710" text-anchor="middle" font-size="8" fill="#d97706">H_[CLS] → IsNext?</text>

  <!-- Label which token goes where -->
  <text x="250" y="650" text-anchor="middle" font-size="7" fill="#64748b">masked positions</text>
  <text x="450" y="650" text-anchor="middle" font-size="7" fill="#64748b">[CLS] only</text>

  <!-- ===== Model configs ===== -->
  <rect x="100" y="750" width="230" height="60" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="215" y="770" text-anchor="middle" font-size="9" font-weight="bold" fill="#0c4a6e">BERT-Base</text>
  <text x="215" y="786" text-anchor="middle" font-size="8" fill="#0284c7">N=12, d=768, h=12</text>
  <text x="215" y="800" text-anchor="middle" font-size="8" fill="#0284c7">110M parameters</text>

  <rect x="370" y="750" width="230" height="60" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="485" y="770" text-anchor="middle" font-size="9" font-weight="bold" fill="#0c4a6e">BERT-Large</text>
  <text x="485" y="786" text-anchor="middle" font-size="8" fill="#0284c7">N=24, d=1024, h=16</text>
  <text x="485" y="800" text-anchor="middle" font-size="8" fill="#0284c7">340M parameters</text>

  <!-- Key difference callout -->
  <rect x="120" y="830" width="460" height="35" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="350" y="848" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532d">Key: Full bidirectional attention (no causal mask) — every token sees every other token</text>
  <text x="350" y="860" text-anchor="middle" font-size="8" fill="#16a34a">Pre-trained on BooksCorpus (800M words) + Wikipedia (2.5B words)</text>
</svg>