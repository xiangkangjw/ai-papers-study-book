<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">FAISS: Approximate Nearest Neighbor Search</text>
  <text x="430" y="46" text-anchor="middle" font-size="10" fill="#64748b">Johnson et al. (2019) — Efficient similarity search over billions of dense vectors</text>

  <!-- Exact vs Approximate -->
  <rect x="30" y="65" width="380" height="170" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="220" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">Brute Force (Exact)</text>

  <!-- Query dot all vectors -->
  <rect x="55" y="110" width="50" height="30" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="80" y="129" text-anchor="middle" font-size="8" fill="#831843">query</text>

  <text x="125" y="130" font-size="10" fill="#475569">·</text>

  <rect x="140" y="100" width="120" height="80" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="200" y="125" text-anchor="middle" font-size="8" fill="#ef4444">All N vectors</text>
  <text x="200" y="145" text-anchor="middle" font-size="7" fill="#ef4444" font-family="'SF Mono', Consolas, monospace">N = 10⁹</text>
  <text x="200" y="162" text-anchor="middle" font-size="7" fill="#ef4444" font-family="'SF Mono', Consolas, monospace">d = 768</text>

  <text x="280" y="130" font-size="10" fill="#475569">→</text>

  <rect x="300" y="110" width="80" height="30" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="340" y="129" text-anchor="middle" font-size="8" fill="#0f172a">top-k</text>

  <text x="220" y="205" text-anchor="middle" font-size="8" fill="#ef4444" font-family="'SF Mono', Consolas, monospace">O(N·d) — too slow for N &gt; 10⁶</text>
  <text x="220" y="225" text-anchor="middle" font-size="8" fill="#ef4444">1B vectors × 768d = hours per query</text>

  <!-- FAISS Approximate -->
  <rect x="450" y="65" width="380" height="170" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">FAISS (Approximate)</text>

  <rect x="475" y="110" width="50" height="30" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="500" y="129" text-anchor="middle" font-size="8" fill="#831843">query</text>

  <text x="545" y="130" font-size="10" fill="#475569">→</text>

  <!-- IVF clusters -->
  <rect x="560" y="100" width="120" height="80" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="590" cy="125" r="12" fill="#16a34a" opacity="0.2" stroke="#16a34a" stroke-width="1"/>
  <circle cx="620" cy="140" r="15" fill="#16a34a" opacity="0.4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="650" cy="120" r="10" fill="#16a34a" opacity="0.2" stroke="#16a34a" stroke-width="1"/>
  <circle cx="600" cy="160" r="11" fill="#16a34a" opacity="0.2" stroke="#16a34a" stroke-width="1"/>
  <text x="620" y="100" text-anchor="middle" font-size="7" fill="#14532d">Search only nprobe</text>
  <text x="620" y="178" text-anchor="middle" font-size="7" fill="#14532d">nearest clusters</text>

  <text x="695" y="130" font-size="10" fill="#475569">→</text>

  <rect x="710" y="110" width="80" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="750" y="129" text-anchor="middle" font-size="8" font-weight="bold" fill="#14532d">top-k</text>

  <text x="640" y="205" text-anchor="middle" font-size="8" fill="#16a34a" font-family="'SF Mono', Consolas, monospace">O(nprobe · N/K · d) — 1000× faster</text>
  <text x="640" y="225" text-anchor="middle" font-size="8" fill="#16a34a">&gt;95% recall with proper tuning</text>

  <!-- Index types -->
  <rect x="30" y="255" width="800" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="430" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">Common FAISS Index Types</text>

  <rect x="50" y="295" width="170" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="135" y="310" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">Flat (Exact)</text>
  <text x="135" y="325" text-anchor="middle" font-size="7" fill="#334155">Brute force, 100% recall</text>

  <rect x="235" y="295" width="170" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="320" y="310" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">IVF (Inverted File)</text>
  <text x="320" y="325" text-anchor="middle" font-size="7" fill="#334155">K-means clusters → search subset</text>

  <rect x="420" y="295" width="195" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="517" y="310" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">IVF + PQ (Product Quant)</text>
  <text x="517" y="325" text-anchor="middle" font-size="7" fill="#334155">Compress vectors 32×, sub-byte</text>

  <rect x="630" y="295" width="180" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="720" y="310" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">HNSW (Graph)</text>
  <text x="720" y="325" text-anchor="middle" font-size="7" fill="#334155">Navigable small-world graph</text>

  <!-- RAG connection -->
  <rect x="30" y="365" width="800" height="85" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="430" y="390" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">Role in RAG Pipeline</text>

  <rect x="60" y="405" width="100" height="30" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="110" y="424" text-anchor="middle" font-size="8" fill="#831843">Query embed</text>

  <line x1="160" y1="420" x2="183" y2="420" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="185" y="405" width="120" height="30" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="245" y="424" text-anchor="middle" font-size="8" font-weight="bold" fill="#14532d">FAISS MIPS</text>

  <line x1="305" y1="420" x2="328" y2="420" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="330" y="405" width="90" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="375" y="424" text-anchor="middle" font-size="8" fill="#0c4a6e">top-k docs</text>

  <line x1="420" y1="420" x2="443" y2="420" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="445" y="405" width="120" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="505" y="424" text-anchor="middle" font-size="8" fill="#78350f">Concat + LLM</text>

  <line x1="565" y1="420" x2="588" y2="420" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="590" y="405" width="80" height="30" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="630" y="424" text-anchor="middle" font-size="8" fill="#0f172a">Answer</text>

  <text x="430" y="450" text-anchor="middle" font-size="8" fill="#64748b">DPR uses FAISS Flat for dense retrieval; production systems use IVF+PQ for billion-scale corpora</text>
</svg>