<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Vision Transformer (ViT) — Full Architecture</text>
  <text x="360" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">ViT-Base/16: 224×224 input, 16×16 patches, 12 layers, 768-dim</text>

  <!-- ===== Stage 1: Patch Embedding ===== -->
  <rect x="60" y="60" width="600" height="230" rx="10" fill="#edf2f8" stroke="#4a7fb5" stroke-width="2"/>
  <text x="360" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7fb5">1. Patch Embedding Stage</text>

  <!-- Input image -->
  <rect x="90" y="100" width="90" height="90" rx="4" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="2"/>
  <!-- Grid overlay -->
  <g stroke="#c0c0c8" stroke-width="0.5">
    <line x1="120" y1="100" x2="120" y2="190"/><line x1="150" y1="100" x2="150" y2="190"/>
    <line x1="90" y1="130" x2="180" y2="130"/><line x1="90" y1="160" x2="180" y2="160"/>
  </g>
  <rect x="90" y="100" width="30" height="30" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5" opacity="0.7"/>
  <text x="135" y="210" text-anchor="middle" font-size="11" fill="#4a4a5a">Input Image</text>
  <text x="135" y="223" text-anchor="middle" font-size="11" fill="#7a7a8a" font-family="'JetBrains Mono', 'Fira Code', monospace">[B, 3, 224, 224]</text>

  <!-- Arrow -->
  <line x1="185" y1="145" x2="215" y2="145" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="200" y="138" text-anchor="middle" font-size="11" fill="#4a4a5a">Split</text>

  <!-- Patches -->
  <rect x="220" y="100" width="120" height="90" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="280" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">196 Patches</text>
  <text x="280" y="155" text-anchor="middle" font-size="11" fill="#d4a03c">14×14 grid</text>
  <text x="280" y="170" text-anchor="middle" font-size="11" fill="#d4a03c">each 16×16×3</text>
  <text x="280" y="223" text-anchor="middle" font-size="11" fill="#7a7a8a" font-family="'JetBrains Mono', 'Fira Code', monospace">[B, 196, 768]</text>

  <!-- Arrow -->
  <line x1="345" y1="145" x2="375" y2="145" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="360" y="130" text-anchor="middle" font-size="11" fill="#4a4a5a">Linear</text>
  <text x="360" y="140" text-anchor="middle" font-size="11" fill="#4a4a5a">E ∈ ℝ^{768×768}</text>

  <!-- Prepend CLS + position -->
  <rect x="380" y="95" width="140" height="45" rx="6" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="450" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Prepend [CLS]</text>
  <text x="450" y="130" text-anchor="middle" font-size="11" fill="#d4645c" font-family="'JetBrains Mono', 'Fira Code', monospace">[B, 197, 768]</text>

  <line x1="450" y1="140" x2="450" y2="160" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="380" y="165" width="140" height="40" rx="6" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="450" y="183" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">+ Pos Embed</text>
  <text x="450" y="198" text-anchor="middle" font-size="11" fill="#d4a03c" font-family="'JetBrains Mono', 'Fira Code', monospace">E_pos ∈ ℝ^{197×768}</text>

  <!-- Token sequence visualization -->
  <rect x="545" y="100" width="25" height="70" rx="3" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="557" y="140" text-anchor="middle" font-size="11" fill="#d4645c" transform="rotate(-90 557 140)">[CLS]</text>
  <rect x="573" y="100" width="20" height="70" rx="2" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1"/>
  <rect x="596" y="100" width="20" height="70" rx="2" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1"/>
  <rect x="619" y="100" width="20" height="70" rx="2" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1"/>
  <text x="583" y="180" text-anchor="middle" font-size="11" fill="#4a7fb5">P₁</text>
  <text x="606" y="180" text-anchor="middle" font-size="11" fill="#4a7fb5">P₂</text>
  <text x="629" y="180" text-anchor="middle" font-size="11" fill="#4a7fb5">...</text>
  <text x="600" y="223" text-anchor="middle" font-size="11" fill="#7a7a8a">197 tokens</text>

  <!-- ===== Stage 2: Transformer Encoder ===== -->
  <line x1="360" y1="290" x2="360" y2="310" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="360" y="305" text-anchor="middle" font-size="11" fill="#7a7a8a" font-family="'JetBrains Mono', 'Fira Code', monospace">[B, 197, 768]</text>

  <rect x="100" y="315" width="520" height="330" rx="10" fill="#edf7f5" stroke="#3a9e8f" stroke-width="2"/>
  <text x="360" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a9e8f">2. Transformer Encoder (×12 Layers)</text>

  <!-- Encoder block detail -->
  <rect x="130" y="350" width="460" height="275" rx="8" fill="#fff" stroke="#c0c0c8" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- MSA -->
  <rect x="175" y="365" width="370" height="50" rx="8" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="360" y="387" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Multi-Head Self-Attention (MSA)</text>
  <text x="360" y="405" text-anchor="middle" font-size="11" fill="#d4645c" font-family="'JetBrains Mono', 'Fira Code', monospace">h=12 heads, d_k=64 per head</text>

  <!-- Residual + LN -->
  <line x1="360" y1="415" x2="360" y2="433" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="240" y="437" width="240" height="25" rx="4" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="360" y="454" text-anchor="middle" font-size="11" fill="#7b68a8">Add &amp; LayerNorm</text>
  <path d="M 165 390 L 165 449 L 238 449" fill="none" stroke="#c0c0c8" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- FFN / MLP -->
  <line x1="360" y1="462" x2="360" y2="480" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="175" y="484" width="370" height="50" rx="8" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="360" y="506" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">MLP (Feed-Forward)</text>
  <text x="360" y="524" text-anchor="middle" font-size="11" fill="#4a7fb5" font-family="'JetBrains Mono', 'Fira Code', monospace">Linear(768, 3072) → GELU → Linear(3072, 768)</text>

  <!-- Residual + LN -->
  <line x1="360" y1="534" x2="360" y2="552" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="240" y="556" width="240" height="25" rx="4" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="360" y="573" text-anchor="middle" font-size="11" fill="#7b68a8">Add &amp; LayerNorm</text>
  <path d="M 165 509 L 165 568 L 238 568" fill="none" stroke="#c0c0c8" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Repeat annotation -->
  <text x="570" y="475" font-size="11" font-weight="bold" fill="#3a9e8f">×12</text>

  <!-- Output shape -->
  <text x="360" y="610" text-anchor="middle" font-size="11" fill="#7a7a8a" font-family="'JetBrains Mono', 'Fira Code', monospace">[B, 197, 768]</text>

  <!-- ===== Stage 3: Classification ===== -->
  <line x1="360" y1="645" x2="360" y2="665" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="140" y="670" width="440" height="210" rx="10" fill="#faf5ee" stroke="#d4a03c" stroke-width="2"/>
  <text x="360" y="692" text-anchor="middle" font-size="12" font-weight="bold" fill="#d4a03c">3. Classification Head</text>

  <!-- Extract CLS -->
  <rect x="210" y="705" width="300" height="35" rx="6" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="360" y="722" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Extract [CLS] token (index 0)</text>
  <text x="360" y="735" text-anchor="middle" font-size="11" fill="#d4645c" font-family="'JetBrains Mono', 'Fira Code', monospace">[B, 197, 768] → [B, 768]</text>

  <line x1="360" y1="740" x2="360" y2="755" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- LayerNorm -->
  <rect x="250" y="758" width="220" height="25" rx="4" fill="#e8e4f1" stroke="#7b68a8" stroke-width="1.5"/>
  <text x="360" y="775" text-anchor="middle" font-size="11" fill="#7b68a8">LayerNorm</text>

  <line x1="360" y1="783" x2="360" y2="798" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- MLP Head -->
  <rect x="230" y="801" width="260" height="35" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="360" y="818" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">MLP Head → Predictions</text>
  <text x="360" y="832" text-anchor="middle" font-size="11" fill="#3a9e8f" font-family="'JetBrains Mono', 'Fira Code', monospace">[B, 768] → [B, num_classes]</text>

  <!-- Output -->
  <line x1="360" y1="836" x2="360" y2="856" stroke="#4a4a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="360" y="870" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e" font-family="'JetBrains Mono', 'Fira Code', monospace">logits [B, 1000]</text>

  <!-- Model variants box -->
  <rect x="420" y="700" width="150" height="80" rx="6" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="1"/>
  <text x="495" y="718" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Variants</text>
  <text x="495" y="735" text-anchor="middle" font-size="11" fill="#3a3a4a">Base: 12L, 768d, 86M</text>
  <text x="495" y="750" text-anchor="middle" font-size="11" fill="#3a3a4a">Large: 24L, 1024d, 307M</text>
  <text x="495" y="765" text-anchor="middle" font-size="11" fill="#3a3a4a">Huge: 32L, 1280d, 632M</text>
</svg>