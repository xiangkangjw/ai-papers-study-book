<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">PEFT Method Taxonomy</text>
  <text x="480" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Freeze pre-trained weights, add small trainable parameters — one backbone, many adapters</text>

  <!-- Root -->
  <rect x="360" y="65" width="240" height="45" rx="10" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="2.5"/>
  <text x="480" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">PEFT Methods</text>
  <text x="480" y="102" text-anchor="middle" font-size="11" fill="#7a7a8a">Parameter-Efficient Fine-Tuning</text>

  <!-- Branches -->
  <line x1="390" y1="110" x2="175" y2="155" stroke="#4a4a5a" stroke-width="2"/>
  <line x1="480" y1="110" x2="480" y2="155" stroke="#4a4a5a" stroke-width="2"/>
  <line x1="570" y1="110" x2="785" y2="155" stroke="#4a4a5a" stroke-width="2"/>

  <!-- ===== Additive Methods ===== -->
  <rect x="20" y="155" width="310" height="50" rx="8" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="175" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7fb5">Additive Methods</text>
  <text x="175" y="196" text-anchor="middle" font-size="11" fill="#4a7fb5">Insert new trainable parameters</text>

  <!-- Additive children -->
  <line x1="75" y1="205" x2="75" y2="235" stroke="#4a7fb5" stroke-width="1.5"/>
  <line x1="175" y1="205" x2="175" y2="235" stroke="#4a7fb5" stroke-width="1.5"/>
  <line x1="275" y1="205" x2="275" y2="235" stroke="#4a7fb5" stroke-width="1.5"/>

  <rect x="15" y="238" width="120" height="80" rx="6" fill="#edf2f8" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="75" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Adapters</text>
  <text x="75" y="274" text-anchor="middle" font-size="11" fill="#4a7fb5">Houlsby et al., 2019</text>
  <text x="75" y="290" text-anchor="middle" font-size="11" fill="#7a7a8a">Bottleneck layers</text>
  <text x="75" y="304" text-anchor="middle" font-size="11" fill="#7a7a8a">between sublayers</text>

  <rect x="140" y="238" width="110" height="80" rx="6" fill="#edf2f8" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="195" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Prefix Tuning</text>
  <text x="195" y="274" text-anchor="middle" font-size="11" fill="#4a7fb5">Li &amp; Liang, 2021</text>
  <text x="195" y="290" text-anchor="middle" font-size="11" fill="#7a7a8a">Learned K,V prefixes</text>
  <text x="195" y="304" text-anchor="middle" font-size="11" fill="#7a7a8a">at each layer</text>

  <rect x="255" y="238" width="115" height="80" rx="6" fill="#edf2f8" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="312" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Prompt Tuning</text>
  <text x="312" y="274" text-anchor="middle" font-size="11" fill="#4a7fb5">Lester et al., 2021</text>
  <text x="312" y="290" text-anchor="middle" font-size="11" fill="#7a7a8a">Soft tokens prepended</text>
  <text x="312" y="304" text-anchor="middle" font-size="11" fill="#7a7a8a">to input only</text>

  <!-- ===== Selective Methods ===== -->
  <rect x="390" y="155" width="180" height="50" rx="8" fill="#f5ece0" stroke="#d4a03c" stroke-width="2"/>
  <text x="480" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#d4a03c">Selective Methods</text>
  <text x="480" y="196" text-anchor="middle" font-size="11" fill="#d4a03c">Train subset of existing params</text>

  <!-- Selective children -->
  <line x1="440" y1="205" x2="440" y2="235" stroke="#d4a03c" stroke-width="1.5"/>
  <line x1="520" y1="205" x2="520" y2="235" stroke="#d4a03c" stroke-width="1.5"/>

  <rect x="380" y="238" width="120" height="80" rx="6" fill="#faf5ee" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="440" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">BitFit</text>
  <text x="440" y="274" text-anchor="middle" font-size="11" fill="#d4a03c">Ben Zaken et al., 2022</text>
  <text x="440" y="290" text-anchor="middle" font-size="11" fill="#7a7a8a">Train bias terms only</text>
  <text x="440" y="304" text-anchor="middle" font-size="11" fill="#7a7a8a">~0.1% of params</text>

  <rect x="505" y="238" width="120" height="80" rx="6" fill="#faf5ee" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="565" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Diff Pruning</text>
  <text x="565" y="274" text-anchor="middle" font-size="11" fill="#d4a03c">Guo et al., 2021</text>
  <text x="565" y="290" text-anchor="middle" font-size="11" fill="#7a7a8a">Sparse diff mask</text>
  <text x="565" y="304" text-anchor="middle" font-size="11" fill="#7a7a8a">over full weights</text>

  <!-- ===== Reparameterization Methods ===== -->
  <rect x="645" y="155" width="290" height="50" rx="8" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2.5"/>
  <text x="790" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a9e8f">Reparameterization</text>
  <text x="790" y="196" text-anchor="middle" font-size="11" fill="#3a9e8f">ΔW = low-rank decomposition</text>

  <!-- Reparam children -->
  <line x1="700" y1="205" x2="700" y2="235" stroke="#3a9e8f" stroke-width="1.5"/>
  <line x1="790" y1="205" x2="790" y2="235" stroke="#3a9e8f" stroke-width="1.5"/>
  <line x1="880" y1="205" x2="880" y2="235" stroke="#3a9e8f" stroke-width="1.5"/>

  <rect x="645" y="238" width="110" height="80" rx="6" fill="#edf7f5" stroke="#3a9e8f" stroke-width="2"/>
  <text x="700" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">LoRA</text>
  <text x="700" y="274" text-anchor="middle" font-size="11" fill="#3a9e8f">Hu et al., 2021</text>
  <text x="700" y="290" text-anchor="middle" font-size="11" fill="#3a9e8f">ΔW = B·A (rank r)</text>
  <text x="700" y="304" text-anchor="middle" font-size="11" fill="#3a9e8f">Zero inference cost</text>

  <rect x="760" y="238" width="110" height="80" rx="6" fill="#edf7f5" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="815" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">AdaLoRA</text>
  <text x="815" y="274" text-anchor="middle" font-size="11" fill="#3a9e8f">Zhang et al., 2023</text>
  <text x="815" y="290" text-anchor="middle" font-size="11" fill="#7a7a8a">Adaptive rank per</text>
  <text x="815" y="304" text-anchor="middle" font-size="11" fill="#7a7a8a">weight matrix</text>

  <rect x="875" y="238" width="110" height="80" rx="6" fill="#edf7f5" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="930" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">DoRA</text>
  <text x="930" y="274" text-anchor="middle" font-size="11" fill="#3a9e8f">Liu et al., 2024</text>
  <text x="930" y="290" text-anchor="middle" font-size="11" fill="#7a7a8a">Weight-decomposed:</text>
  <text x="930" y="304" text-anchor="middle" font-size="11" fill="#7a7a8a">magnitude + direction</text>

  <!-- ===== Dominant approach highlight ===== -->
  <rect x="635" y="322" width="130" height="22" rx="4" fill="#3a9e8f" stroke="none"/>
  <text x="700" y="337" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Dominant in practice</text>

  <!-- ===== Comparison summary ===== -->
  <rect x="150" y="370" width="660" height="95" rx="8" fill="#f5f5f8" stroke="#f5f5f8" stroke-width="1.5"/>
  <text x="480" y="392" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Method Comparison</text>

  <!-- Table-like layout -->
  <text x="230" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a7a8a">Method</text>
  <text x="360" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a7a8a">Params Added</text>
  <text x="480" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a7a8a">Inference Cost</text>
  <text x="610" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a7a8a">Mergeable?</text>
  <text x="730" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a7a8a">Performance</text>

  <line x1="170" y1="418" x2="790" y2="418" stroke="#f5f5f8" stroke-width="1"/>

  <text x="230" y="434" text-anchor="middle" font-size="11" fill="#4a7fb5">Adapters</text>
  <text x="360" y="434" text-anchor="middle" font-size="11" fill="#3a3a4a">0.5–3%</text>
  <text x="480" y="434" text-anchor="middle" font-size="11" fill="#d4645c">+latency</text>
  <text x="610" y="434" text-anchor="middle" font-size="11" fill="#d4645c">No</text>
  <text x="730" y="434" text-anchor="middle" font-size="11" fill="#3a9e8f">Strong</text>

  <text x="230" y="450" text-anchor="middle" font-size="11" fill="#d4a03c">BitFit</text>
  <text x="360" y="450" text-anchor="middle" font-size="11" fill="#3a3a4a">~0.1%</text>
  <text x="480" y="450" text-anchor="middle" font-size="11" fill="#3a9e8f">Zero</text>
  <text x="610" y="450" text-anchor="middle" font-size="11" fill="#3a9e8f">Yes</text>
  <text x="730" y="450" text-anchor="middle" font-size="11" fill="#d4a03c">Moderate</text>

  <text x="230" y="466" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">LoRA</text>
  <text x="360" y="466" text-anchor="middle" font-size="11" fill="#3a3a4a">0.1–1%</text>
  <text x="480" y="466" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Zero</text>
  <text x="610" y="466" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Yes (W+BA)</text>
  <text x="730" y="466" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Strong</text>
</svg>