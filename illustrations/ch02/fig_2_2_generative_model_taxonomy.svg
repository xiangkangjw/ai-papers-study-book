<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Generative Model Taxonomy</text>
  <text x="410" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">How different generative models approach learning the data distribution</text>

  <!-- Root -->
  <rect x="290" y="65" width="240" height="40" rx="8" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="2.5"/>
  <text x="410" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">Generative Models</text>

  <!-- Split -->
  <line x1="310" y1="105" x2="200" y2="140" stroke="#4a4a5a" stroke-width="2"/>
  <line x1="510" y1="105" x2="620" y2="140" stroke="#4a4a5a" stroke-width="2"/>

  <!-- Explicit Density -->
  <rect x="60" y="140" width="280" height="40" rx="8" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="2"/>
  <text x="200" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Explicit Density p(x)</text>

  <!-- Implicit Density -->
  <rect x="480" y="140" width="280" height="40" rx="8" fill="#f6e4e3" stroke="#d4645c" stroke-width="2"/>
  <text x="620" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Implicit Density</text>

  <!-- Explicit sub-split -->
  <line x1="120" y1="180" x2="100" y2="210" stroke="#4a7fb5" stroke-width="1.5"/>
  <line x1="280" y1="180" x2="300" y2="210" stroke="#4a7fb5" stroke-width="1.5"/>

  <!-- Tractable -->
  <rect x="20" y="215" width="180" height="40" rx="6" fill="#edf2f8" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="110" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Tractable</text>

  <!-- Approximate -->
  <rect x="220" y="215" width="180" height="40" rx="6" fill="#edf2f8" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="310" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Approximate</text>

  <!-- Tractable methods -->
  <line x1="110" y1="255" x2="110" y2="275" stroke="#4a7fb5" stroke-width="1"/>
  <rect x="20" y="278" width="180" height="60" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="110" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Autoregressive</text>
  <text x="110" y="314" text-anchor="middle" font-size="11" fill="#3a9e8f">GPT, PixelRNN</text>
  <text x="110" y="328" text-anchor="middle" font-size="11" fill="#7a7a8a">Exact likelihood, slow sampling</text>

  <!-- Approximate methods -->
  <line x1="310" y1="255" x2="310" y2="275" stroke="#4a7fb5" stroke-width="1"/>
  <rect x="220" y="278" width="180" height="60" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="310" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">VAE (Ch2)</text>
  <text x="310" y="314" text-anchor="middle" font-size="11" fill="#3a9e8f">ELBO bound on log p(x)</text>
  <text x="310" y="328" text-anchor="middle" font-size="11" fill="#7a7a8a">Smooth latent space, blurry</text>

  <!-- GAN -->
  <line x1="620" y1="180" x2="620" y2="210" stroke="#d4645c" stroke-width="1.5"/>
  <rect x="480" y="215" width="280" height="40" rx="6" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="620" y="233" text-anchor="middle" font-size="11" fill="#d4645c">No explicit p(x) — learn to sample</text>

  <line x1="540" y1="255" x2="540" y2="275" stroke="#d4645c" stroke-width="1"/>
  <line x1="720" y1="255" x2="720" y2="275" stroke="#d4645c" stroke-width="1"/>

  <rect x="460" y="278" width="160" height="60" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="2"/>
  <text x="540" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">GAN (Ch3)</text>
  <text x="540" y="314" text-anchor="middle" font-size="11" fill="#3a9e8f">Adversarial training</text>
  <text x="540" y="328" text-anchor="middle" font-size="11" fill="#7a7a8a">Sharp samples, mode collapse</text>

  <rect x="640" y="278" width="160" height="60" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="720" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Diffusion (Ch8)</text>
  <text x="720" y="314" text-anchor="middle" font-size="11" fill="#3a9e8f">Score matching / denoising</text>
  <text x="720" y="328" text-anchor="middle" font-size="11" fill="#7a7a8a">High quality, slow sampling</text>
</svg>