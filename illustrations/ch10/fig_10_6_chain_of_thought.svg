<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a5a"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Chain-of-Thought Prompting</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#7a7a8a">Wei et al. (2022) — Elicit step-by-step reasoning to improve complex task performance</text>

  <!-- Standard prompting (left) -->
  <rect x="30" y="65" width="380" height="240" rx="10" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="220" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#b5454a">Standard Prompting</text>

  <rect x="50" y="105" width="340" height="60" rx="6" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="60" y="123" font-size="11" fill="#4a4a5a" font-weight="bold">Q:</text>
  <text x="80" y="123" font-size="11" fill="#3a3a4a">Roger has 5 tennis balls. He buys 2 more cans</text>
  <text x="80" y="137" font-size="11" fill="#3a3a4a">of 3 tennis balls each. How many does he have?</text>
  <text x="80" y="155" font-size="11" fill="#4a4a5a" font-weight="bold">A: The answer is 11. ✓</text>

  <rect x="50" y="175" width="340" height="60" rx="6" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="60" y="193" font-size="11" fill="#4a4a5a" font-weight="bold">Q:</text>
  <text x="80" y="193" font-size="11" fill="#3a3a4a">The cafeteria had 23 apples. They used 20 for</text>
  <text x="80" y="207" font-size="11" fill="#3a3a4a">lunch and bought 6 more. How many now?</text>
  <text x="80" y="225" font-size="11" fill="#d4645c" font-weight="bold">A: The answer is 27. ✗</text>

  <text x="220" y="270" text-anchor="middle" font-size="11" fill="#d4645c">Direct answer — often wrong on multi-step</text>
  <text x="220" y="288" text-anchor="middle" font-size="11" fill="#d4645c">No intermediate reasoning shown</text>

  <!-- Chain-of-Thought prompting (right) -->
  <rect x="450" y="65" width="380" height="240" rx="10" fill="#edf7f5" stroke="#3a9e8f" stroke-width="2"/>
  <text x="640" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Chain-of-Thought Prompting</text>

  <rect x="470" y="105" width="340" height="75" rx="6" fill="#f5f5f8" stroke="#4a4a5a" stroke-width="1.5"/>
  <text x="480" y="123" font-size="11" fill="#4a4a5a" font-weight="bold">Q:</text>
  <text x="500" y="123" font-size="11" fill="#3a3a4a">Roger has 5 tennis balls. He buys 2 more cans</text>
  <text x="500" y="137" font-size="11" fill="#3a3a4a">of 3 tennis balls each. How many does he have?</text>
  <text x="480" y="155" font-size="11" fill="#3a9e8f" font-weight="bold">A:</text>
  <text x="500" y="155" font-size="11" fill="#3a9e8f">He started with 5. 2 cans × 3 = 6 new balls.</text>
  <text x="500" y="168" font-size="11" fill="#3a9e8f">5 + 6 = 11. The answer is 11. ✓</text>

  <rect x="470" y="190" width="340" height="75" rx="6" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="480" y="208" font-size="11" fill="#4a4a5a" font-weight="bold">Q:</text>
  <text x="500" y="208" font-size="11" fill="#3a3a4a">The cafeteria had 23 apples. They used 20 for</text>
  <text x="500" y="222" font-size="11" fill="#3a3a4a">lunch and bought 6 more. How many now?</text>
  <text x="480" y="240" font-size="11" fill="#3a9e8f" font-weight="bold">A:</text>
  <text x="500" y="240" font-size="11" fill="#3a9e8f">Started with 23. Used 20: 23-20 = 3.</text>
  <text x="500" y="253" font-size="11" fill="#3a9e8f">Bought 6 more: 3+6 = 9. The answer is 9. ✓</text>

  <text x="640" y="285" text-anchor="middle" font-size="11" fill="#3a9e8f" font-weight="bold">Step-by-step reasoning → correct answer</text>
  <text x="640" y="300" text-anchor="middle" font-size="11" fill="#3a9e8f">Intermediate steps are verifiable</text>

  <!-- Variants -->
  <rect x="30" y="325" width="800" height="85" rx="10" fill="#f5ece0" stroke="#d4a03c" stroke-width="1.5"/>
  <text x="430" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">CoT Variants</text>

  <rect x="50" y="360" width="170" height="38" rx="4" fill="#f5ece0" stroke="#d4a03c" stroke-width="1"/>
  <text x="135" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4a03c">Few-Shot CoT</text>
  <text x="135" y="390" text-anchor="middle" font-size="11" fill="#3a3a4a">Provide reasoning examples</text>

  <rect x="235" y="360" width="170" height="38" rx="4" fill="#dff0ed" stroke="#3a9e8f" stroke-width="1.5"/>
  <text x="320" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a9e8f">Zero-Shot CoT</text>
  <text x="320" y="390" text-anchor="middle" font-size="11" fill="#3a3a4a">"Let's think step by step"</text>

  <rect x="420" y="360" width="190" height="38" rx="4" fill="#e1eaf3" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="515" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7fb5">Self-Consistency</text>
  <text x="515" y="390" text-anchor="middle" font-size="11" fill="#3a3a4a">Sample N chains → majority vote</text>

  <rect x="625" y="360" width="180" height="38" rx="4" fill="#f6e4e3" stroke="#d4645c" stroke-width="1.5"/>
  <text x="715" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4645c">Least-to-Most</text>
  <text x="715" y="390" text-anchor="middle" font-size="11" fill="#3a3a4a">Decompose → solve subproblems</text>
</svg>