<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Diffusion Noise Schedule</text>
  <text x="430" y="46" text-anchor="middle" font-size="10" fill="#64748b">How β_t and ᾱ_t control the forward noising process over T timesteps</text>

  <!-- Plot area -->
  <rect x="40" y="65" width="480" height="280" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Axes -->
  <line x1="80" y1="310" x2="490" y2="310" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="80" y1="310" x2="80" y2="80" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="285" y="340" text-anchor="middle" font-size="10" fill="#475569">Timestep t →</text>
  <text x="55" y="195" text-anchor="middle" font-size="9" fill="#475569" transform="rotate(-90 55 195)">Value</text>

  <!-- Y ticks -->
  <text x="72" y="100" text-anchor="end" font-size="7" fill="#64748b">1.0</text>
  <text x="72" y="205" text-anchor="end" font-size="7" fill="#64748b">0.5</text>
  <text x="72" y="314" text-anchor="end" font-size="7" fill="#64748b">0</text>
  <line x1="75" y1="97" x2="80" y2="97" stroke="#475569" stroke-width="1"/>
  <line x1="75" y1="202" x2="80" y2="202" stroke="#475569" stroke-width="1"/>

  <!-- X ticks -->
  <text x="80" y="325" text-anchor="middle" font-size="7" fill="#64748b">0</text>
  <text x="285" y="325" text-anchor="middle" font-size="7" fill="#64748b">T/2</text>
  <text x="490" y="325" text-anchor="middle" font-size="7" fill="#64748b">T</text>

  <!-- ᾱ_t curve (signal retention — starts at 1, drops to ~0) -->
  <path d="M 80 100 Q 150 102 200 110 Q 250 130 285 200 Q 320 270 370 295 Q 420 308 490 310" fill="none" stroke="#0284c7" stroke-width="2.5"/>
  <text x="140" y="95" font-size="9" fill="#0284c7" font-weight="bold">ᾱ_t (signal)</text>

  <!-- β_t curve (noise added per step — starts small, grows) -->
  <path d="M 80 305 Q 150 302 200 298 Q 250 288 285 268 Q 320 240 370 200 Q 420 170 490 150" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="430" y="145" font-size="9" fill="#ef4444" font-weight="bold">β_t (noise rate)</text>

  <!-- √ᾱ_t and √(1-ᾱ_t) -->
  <path d="M 80 100 Q 150 103 200 112 Q 250 140 285 170 Q 320 210 370 245 Q 420 268 490 280" fill="none" stroke="#16a34a" stroke-width="1.5"/>
  <text x="415" y="295" font-size="7" fill="#16a34a">√(1-ᾱ_t)</text>

  <!-- Annotations on plot -->
  <rect x="100" y="120" width="120" height="35" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" opacity="0.9"/>
  <text x="160" y="135" text-anchor="middle" font-size="7" fill="#0284c7">t≈0: mostly signal</text>
  <text x="160" y="148" text-anchor="middle" font-size="7" fill="#0284c7">x_t ≈ x_0 (clean)</text>

  <rect x="350" y="225" width="120" height="35" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1" opacity="0.9"/>
  <text x="410" y="240" text-anchor="middle" font-size="7" fill="#ef4444">t≈T: mostly noise</text>
  <text x="410" y="253" text-anchor="middle" font-size="7" fill="#ef4444">x_t ≈ N(0,I)</text>

  <!-- Equations panel -->
  <rect x="545" y="65" width="290" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="690" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">Forward Process</text>

  <text x="565" y="115" font-size="8" fill="#78350f" font-family="'SF Mono', Consolas, monospace">q(x_t|x_0) = N(√ᾱ_t · x_0, (1-ᾱ_t)I)</text>

  <text x="565" y="140" font-size="8" fill="#334155" font-family="'SF Mono', Consolas, monospace">ᾱ_t = Π_{s=1}^{t} (1 - β_s)</text>

  <text x="565" y="162" font-size="8" fill="#334155" font-family="'SF Mono', Consolas, monospace">x_t = √ᾱ_t · x_0 + √(1-ᾱ_t) · ε</text>

  <text x="565" y="185" font-size="7" fill="#64748b">Closed-form: sample any x_t directly from x_0</text>
  <text x="565" y="200" font-size="7" fill="#64748b">No need to iterate through all previous steps</text>

  <!-- Schedule types -->
  <rect x="545" y="230" width="290" height="130" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="690" y="255" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">Schedule Types</text>

  <rect x="560" y="270" width="260" height="25" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="690" y="287" text-anchor="middle" font-size="8" fill="#0c4a6e"><tspan font-weight="bold">Linear</tspan> (DDPM): β₁=10⁻⁴ → β_T=0.02</text>

  <rect x="560" y="302" width="260" height="25" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="690" y="319" text-anchor="middle" font-size="8" fill="#14532d"><tspan font-weight="bold">Cosine</tspan> (Nichol): smoother ᾱ_t decay</text>

  <rect x="560" y="334" width="260" height="22" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1"/>
  <text x="690" y="350" text-anchor="middle" font-size="8" fill="#581c87"><tspan font-weight="bold">Scaled Linear</tspan> (Stable Diffusion)</text>

  <!-- Image examples at bottom -->
  <rect x="40" y="365" width="800" height="45" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="60" y="385" font-size="8" fill="#0f172a" font-weight="bold">t=0</text>
  <rect x="85" y="375" width="30" height="25" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="100" y="392" text-anchor="middle" font-size="6" fill="#14532d">clean</text>

  <text x="165" y="392" text-anchor="middle" font-size="8" fill="#475569">→</text>

  <text x="210" y="385" font-size="8" fill="#0f172a">t=T/4</text>
  <rect x="250" y="375" width="30" height="25" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="265" y="392" text-anchor="middle" font-size="6" fill="#0284c7">slight</text>

  <text x="330" y="392" text-anchor="middle" font-size="8" fill="#475569">→</text>

  <text x="380" y="385" font-size="8" fill="#0f172a">t=T/2</text>
  <rect x="420" y="375" width="30" height="25" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="435" y="392" text-anchor="middle" font-size="6" fill="#d97706">noisy</text>

  <text x="500" y="392" text-anchor="middle" font-size="8" fill="#475569">→</text>

  <text x="550" y="385" font-size="8" fill="#0f172a">t=3T/4</text>
  <rect x="600" y="375" width="30" height="25" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="615" y="392" text-anchor="middle" font-size="6" fill="#ef4444">v.noisy</text>

  <text x="680" y="392" text-anchor="middle" font-size="8" fill="#475569">→</text>

  <text x="720" y="385" font-size="8" fill="#0f172a">t=T</text>
  <rect x="750" y="375" width="30" height="25" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
  <text x="765" y="392" text-anchor="middle" font-size="6" fill="#475569">pure ε</text>
</svg>