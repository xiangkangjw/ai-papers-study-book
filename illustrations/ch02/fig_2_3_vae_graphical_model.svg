<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/></marker>
  </defs>

  <text x="250" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">VAE Graphical Model</text>

  <!-- Prior -->
  <text x="250" y="70" text-anchor="middle" font-size="11" fill="#64748b" font-family="'SF Mono', Consolas, monospace">p(z) = N(0, I)</text>

  <!-- Latent z (open circle = latent/unobserved) -->
  <circle cx="250" cy="120" r="32" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="250" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">z</text>
  <text x="250" y="136" text-anchor="middle" font-size="8" fill="#16a34a">latent</text>

  <!-- Observed x (shaded circle = observed) -->
  <circle cx="250" cy="270" r="32" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
  <text x="250" y="268" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">x</text>
  <text x="250" y="286" text-anchor="middle" font-size="8" fill="#475569">observed</text>

  <!-- Generative model arrow (right side): z → x, p_θ(x|z) -->
  <line x1="272" y1="148" x2="272" y2="236" stroke="#0284c7" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="340" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#0284c7" font-family="'SF Mono', Consolas, monospace">p_θ(x|z)</text>
  <text x="340" y="212" text-anchor="middle" font-size="9" fill="#0284c7">decoder / generative</text>

  <!-- θ parameter -->
  <rect x="370" y="150" width="40" height="25" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="390" y="167" text-anchor="middle" font-size="10" font-weight="bold" fill="#0c4a6e">θ</text>
  <line x1="370" y1="162" x2="320" y2="185" stroke="#0284c7" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Inference model arrow (left side): x → z, q_φ(z|x) -->
  <line x1="228" y1="240" x2="228" y2="154" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#ar)"/>
  <text x="140" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#ef4444" font-family="'SF Mono', Consolas, monospace">q_φ(z|x)</text>
  <text x="140" y="212" text-anchor="middle" font-size="9" fill="#ef4444">encoder / inference</text>

  <!-- φ parameter -->
  <rect x="85" y="150" width="40" height="25" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="105" y="167" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">φ</text>
  <line x1="125" y1="162" x2="158" y2="185" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Plate notation (N data points) -->
  <rect x="180" y="85" width="140" height="235" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="310" y="310" font-size="12" font-weight="bold" fill="#94a3b8">N</text>

  <!-- Legend -->
  <rect x="70" y="340" width="360" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="100" cy="360" r="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="120" y="364" font-size="9" fill="#334155">Open circle = latent (unobserved) variable</text>
  <circle cx="100" cy="388" r="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="120" y="392" font-size="9" fill="#334155">Shaded circle = observed variable</text>
  <line x1="260" y1="358" x2="290" y2="358" stroke="#0284c7" stroke-width="2"/>
  <text x="300" y="362" font-size="9" fill="#0284c7">Generative (solid)</text>
  <line x1="260" y1="386" x2="290" y2="386" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="300" y="390" font-size="9" fill="#ef4444">Inference (dashed)</text>
</svg>