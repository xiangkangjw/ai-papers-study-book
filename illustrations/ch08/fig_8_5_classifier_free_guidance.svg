<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Classifier-Free Guidance: Vector Extrapolation</text>
  <text x="430" y="46" text-anchor="middle" font-size="10" fill="#64748b">Ho &amp; Salimans (2022) — Amplify the effect of text conditioning without a separate classifier</text>

  <!-- ===== Geometric Visualization (Left) ===== -->
  <rect x="20" y="65" width="480" height="310" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="260" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Noise Prediction Space (Geometric View)</text>

  <!-- Origin point (latent state) -->
  <circle cx="120" cy="240" r="8" fill="#475569" stroke="#0f172a" stroke-width="2"/>
  <text x="120" y="270" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">x_t</text>
  <text x="120" y="283" text-anchor="middle" font-size="7" fill="#64748b">latent state</text>

  <!-- Unconditional prediction (w=0) -->
  <line x1="128" y1="240" x2="230" y2="210" stroke="#ef4444" stroke-width="2.5" marker-end="url(#a)"/>
  <circle cx="232" cy="209" r="5" fill="#ef4444"/>
  <text x="235" y="200" font-size="9" font-weight="bold" fill="#ef4444">ε_uncond</text>
  <text x="235" y="188" font-size="7" fill="#ef4444">(w = 0, null prompt ∅)</text>

  <!-- Conditional prediction (w=1) -->
  <line x1="128" y1="240" x2="310" y2="175" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a)"/>
  <circle cx="312" cy="174" r="5" fill="#16a34a"/>
  <text x="315" y="165" font-size="9" font-weight="bold" fill="#16a34a">ε_cond</text>
  <text x="315" y="153" font-size="7" fill="#16a34a">(w = 1, text prompt c)</text>

  <!-- Direction vector -->
  <line x1="232" y1="209" x2="312" y2="174" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="280" y="205" text-anchor="middle" font-size="7" fill="#9333ea">ε_cond − ε_uncond</text>

  <!-- Guided prediction (w=7.5) -->
  <line x1="128" y1="240" x2="440" y2="110" stroke="#0284c7" stroke-width="3" marker-end="url(#ab)"/>
  <circle cx="442" cy="109" r="6" fill="#0284c7" stroke="#fff" stroke-width="2"/>
  <text x="445" y="100" font-size="10" font-weight="bold" fill="#0284c7">ε_guided</text>
  <text x="445" y="88" font-size="7" fill="#0284c7">(w = 7.5, extrapolated)</text>

  <!-- Scale annotation -->
  <path d="M 315 170 Q 380 135 438 112" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="390" y="132" text-anchor="middle" font-size="7" fill="#0284c7">scale by (w−1) = 6.5</text>

  <!-- w scale line at bottom -->
  <line x1="120" y1="320" x2="460" y2="320" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="120" cy="320" r="3" fill="#475569"/>
  <circle cx="232" cy="320" r="3" fill="#ef4444"/>
  <circle cx="312" cy="320" r="3" fill="#16a34a"/>
  <circle cx="440" cy="320" r="3" fill="#0284c7"/>
  <text x="120" y="340" text-anchor="middle" font-size="7" fill="#475569">origin</text>
  <text x="232" y="340" text-anchor="middle" font-size="7" font-weight="bold" fill="#ef4444">w=0</text>
  <text x="312" y="340" text-anchor="middle" font-size="7" font-weight="bold" fill="#16a34a">w=1</text>
  <text x="440" y="340" text-anchor="middle" font-size="7" font-weight="bold" fill="#0284c7">w=7.5</text>
  <text x="290" y="358" text-anchor="middle" font-size="8" fill="#64748b">← less aligned with prompt          more aligned with prompt →</text>

  <!-- ===== Equation and Settings (Right) ===== -->
  <rect x="520" y="65" width="320" height="130" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="680" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">Guidance Equation</text>

  <text x="680" y="118" text-anchor="middle" font-size="10" fill="#0f172a" font-family="'SF Mono', Consolas, monospace">ε_guided = ε_uncond</text>
  <text x="680" y="138" text-anchor="middle" font-size="10" fill="#0f172a" font-family="'SF Mono', Consolas, monospace">  + w · (ε_cond − ε_uncond)</text>

  <text x="680" y="165" text-anchor="middle" font-size="8" fill="#0284c7">Two U-Net forward passes per step:</text>
  <text x="680" y="180" text-anchor="middle" font-size="8" fill="#0284c7">one conditional, one unconditional</text>

  <!-- ===== Guidance Scale Effects ===== -->
  <rect x="520" y="210" width="320" height="165" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="680" y="233" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">Guidance Scale w Effects</text>

  <rect x="540" y="248" width="80" height="25" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="580" y="265" text-anchor="middle" font-size="8" font-weight="bold" fill="#ef4444">w = 0</text>
  <text x="640" y="265" font-size="8" fill="#334155">Unconditional (ignores prompt)</text>

  <rect x="540" y="280" width="80" height="25" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="580" y="297" text-anchor="middle" font-size="8" font-weight="bold" fill="#16a34a">w = 1</text>
  <text x="640" y="297" font-size="8" fill="#334155">Pure conditional</text>

  <rect x="540" y="312" width="80" height="25" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="580" y="329" text-anchor="middle" font-size="8" font-weight="bold" fill="#0284c7">w ≈ 7.5</text>
  <text x="640" y="329" font-size="8" fill="#334155">Standard (matches prompt well)</text>

  <rect x="540" y="344" width="80" height="25" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="580" y="361" text-anchor="middle" font-size="8" font-weight="bold" fill="#9333ea">w > 15</text>
  <text x="640" y="361" font-size="8" fill="#334155">Over-saturated, artifacts</text>

  <!-- ===== Tradeoff box ===== -->
  <rect x="520" y="390" width="320" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="680" y="408" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Tradeoff: Precision vs. Diversity</text>
  <text x="680" y="422" text-anchor="middle" font-size="8" fill="#64748b">Higher w → better prompt adherence, less sample diversity</text>
</svg>