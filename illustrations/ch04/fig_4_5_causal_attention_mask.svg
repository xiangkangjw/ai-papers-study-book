  <text x="130" y="95" text-anchor="middle" font-size="11" fill="#7a7a8a">QKᵀ / √d_k</text>

  <!-- 4x4 Grid -->
  <g transform="translate(30, 110)">
    <!-- Headers -->
    <text x="55" y="-5" text-anchor="middle" font-size="11" fill="#7a7a8a">t₁</text>
    <text x="105" y="-5" text-anchor="middle" font-size="11" fill="#7a7a8a">t₂</text>
    <text x="155" y="-5" text-anchor="middle" font-size="11" fill="#7a7a8a">t₃</text>
    <text x="205" y="-5" text-anchor="middle" font-size="11" fill="#7a7a8a">t₄</text>
    <text x="18" y="28" text-anchor="middle" font-size="11" fill="#7a7a8a">t₁</text>
    <text x="18" y="78" text-anchor="middle" font-size="11" fill="#7a7a8a">t₂</text>
    <text x="18" y="128" text-anchor="middle" font-size="11" fill="#7a7a8a">t₃</text>
    <text x="18" y="178" text-anchor="middle" font-size="11" fill="#7a7a8a">t₄</text>

    <!-- Row 1 -->
    <rect x="30" y="5" width="50" height="45" rx="3" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1"/>
    <text x="55" y="32" text-anchor="middle" font-size="11" fill="#3a3a4a">s₁₁</text>
    <rect x="80" y="5" width="50" height="45" rx="3" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1"/>
    <text x="105" y="32" text-anchor="middle" font-size="11" fill="#3a3a4a">s₁₂</text>
