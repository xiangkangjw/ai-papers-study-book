<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Multi-Hop Retrieval and Reasoning</text>
  <text x="430" y="46" text-anchor="middle" font-size="10" fill="#64748b">Iterative decomposition: retrieve, reason, generate sub-queries, retrieve again</text>

  <!-- Example question -->
  <rect x="30" y="65" width="800" height="35" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="430" y="87" text-anchor="middle" font-size="9" fill="#78350f" font-weight="bold">Q: "What university did the inventor of the Transformer architecture attend for their PhD?"</text>

  <!-- Hop 1 -->
  <rect x="30" y="115" width="250" height="170" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="155" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#0c4a6e">Hop 1</text>

  <rect x="50" y="152" width="210" height="30" rx="4" fill="#fff" stroke="#0284c7" stroke-width="1"/>
  <text x="155" y="171" text-anchor="middle" font-size="7" fill="#334155">Sub-query: "Who invented the Transformer?"</text>

  <line x1="155" y1="182" x2="155" y2="198" stroke="#0284c7" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="50" y="200" width="210" height="28" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
  <text x="155" y="218" text-anchor="middle" font-size="7" fill="#475569">Retrieve from knowledge base</text>

  <line x1="155" y1="228" x2="155" y2="244" stroke="#0284c7" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="50" y="246" width="210" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="155" y="264" text-anchor="middle" font-size="7" fill="#14532d">Finding: Ashish Vaswani et al. (2017)</text>

  <!-- Arrow to Hop 2 -->
  <line x1="280" y1="220" x2="318" y2="220" stroke="#d97706" stroke-width="2" marker-end="url(#a)"/>
  <text x="299" y="212" text-anchor="middle" font-size="6" fill="#d97706">context</text>

  <!-- Hop 2 -->
  <rect x="320" y="115" width="250" height="170" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="445" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#831843">Hop 2</text>

  <rect x="340" y="152" width="210" height="30" rx="4" fill="#fff" stroke="#db2777" stroke-width="1"/>
  <text x="445" y="165" text-anchor="middle" font-size="7" fill="#334155">Sub-query: "Where did Ashish</text>
  <text x="445" y="176" text-anchor="middle" font-size="7" fill="#334155">Vaswani do his PhD?"</text>

  <line x1="445" y1="182" x2="445" y2="198" stroke="#db2777" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="340" y="200" width="210" height="28" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
  <text x="445" y="218" text-anchor="middle" font-size="7" fill="#475569">Retrieve from knowledge base</text>

  <line x1="445" y1="228" x2="445" y2="244" stroke="#db2777" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="340" y="246" width="210" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="445" y="264" text-anchor="middle" font-size="7" fill="#14532d">Finding: USC (University of S. California)</text>

  <!-- Arrow to synthesis -->
  <line x1="570" y1="220" x2="608" y2="220" stroke="#d97706" stroke-width="2" marker-end="url(#a)"/>
  <text x="589" y="212" text-anchor="middle" font-size="6" fill="#d97706">context</text>

  <!-- Final synthesis -->
  <rect x="610" y="115" width="220" height="170" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="720" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">Synthesize</text>

  <rect x="630" y="155" width="180" height="55" rx="4" fill="#fff" stroke="#16a34a" stroke-width="1"/>
  <text x="720" y="172" text-anchor="middle" font-size="7" fill="#334155">LLM combines findings:</text>
  <text x="720" y="186" text-anchor="middle" font-size="7" fill="#334155">Hop 1: Vaswani invented Transformer</text>
  <text x="720" y="200" text-anchor="middle" font-size="7" fill="#334155">Hop 2: Vaswani attended USC</text>

  <line x1="720" y1="210" x2="720" y2="228" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="640" y="230" width="160" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="720" y="248" text-anchor="middle" font-size="8" font-weight="bold" fill="#14532d">A: "USC (University</text>
  <text x="720" y="262" text-anchor="middle" font-size="8" font-weight="bold" fill="#14532d">of Southern California)"</text>

  <!-- General framework below -->
  <rect x="30" y="305" width="800" height="105" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="330" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">General Multi-Hop Framework</text>

  <!-- Pipeline -->
  <rect x="55" y="345" width="105" height="45" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="107" y="365" text-anchor="middle" font-size="8" font-weight="bold" fill="#0c4a6e">Decompose</text>
  <text x="107" y="380" text-anchor="middle" font-size="6" fill="#0284c7">Break question into</text>
  <text x="107" y="389" text-anchor="middle" font-size="6" fill="#0284c7">sub-questions</text>

  <line x1="160" y1="367" x2="182" y2="367" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="185" y="345" width="105" height="45" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="237" y="365" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">Retrieve</text>
  <text x="237" y="380" text-anchor="middle" font-size="6" fill="#d97706">Search for each</text>
  <text x="237" y="389" text-anchor="middle" font-size="6" fill="#d97706">sub-question</text>

  <line x1="290" y1="367" x2="312" y2="367" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="315" y="345" width="105" height="45" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="367" y="365" text-anchor="middle" font-size="8" font-weight="bold" fill="#831843">Reason</text>
  <text x="367" y="380" text-anchor="middle" font-size="6" fill="#db2777">Extract answer,</text>
  <text x="367" y="389" text-anchor="middle" font-size="6" fill="#db2777">check sufficiency</text>

  <line x1="420" y1="367" x2="442" y2="367" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Loop back arrow -->
  <rect x="445" y="345" width="105" height="45" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="497" y="365" text-anchor="middle" font-size="8" font-weight="bold" fill="#581c87">More hops?</text>
  <text x="497" y="380" text-anchor="middle" font-size="6" fill="#9333ea">Generate next</text>
  <text x="497" y="389" text-anchor="middle" font-size="6" fill="#9333ea">sub-query if needed</text>

  <path d="M497,345 Q497,330 367,345" fill="none" stroke="#9333ea" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a)"/>

  <line x1="550" y1="367" x2="572" y2="367" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="575" y="345" width="105" height="45" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="627" y="365" text-anchor="middle" font-size="8" font-weight="bold" fill="#14532d">Synthesize</text>
  <text x="627" y="380" text-anchor="middle" font-size="6" fill="#16a34a">Combine all</text>
  <text x="627" y="389" text-anchor="middle" font-size="6" fill="#16a34a">findings → answer</text>

  <!-- Systems -->
  <rect x="700" y="340" width="115" height="55" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="757" y="358" text-anchor="middle" font-size="7" font-weight="bold" fill="#78350f">Systems</text>
  <text x="757" y="373" text-anchor="middle" font-size="6" fill="#334155">IRCoT, ReAct</text>
  <text x="757" y="385" text-anchor="middle" font-size="6" fill="#334155">DSP, ITER-RETGEN</text>
</svg>