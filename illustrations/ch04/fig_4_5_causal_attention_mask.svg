    <text x="55" y="132" text-anchor="middle" font-size="11" fill="#3a3a4a">s₃₁</text>
    <rect x="80" y="105" width="50" height="45" rx="3" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1"/>
    <text x="105" y="132" text-anchor="middle" font-size="11" fill="#3a3a4a">s₃₂</text>
    <rect x="130" y="105" width="50" height="45" rx="3" fill="#f5f5f8" stroke="#c0c0c8" stroke-width="1"/>
    <text x="155" y="132" text-anchor="middle" font-size="11" fill="#3a3a4a">s₃₃</text>
